&lt;body&gt;
&lt;div class=&quot;wrap&quot;&gt;

  &lt;h1&gt;简支梁支座反力影响线 &lt;span class=&quot;badge&quot;&gt;结构力学 · 影响线&lt;/span&gt;&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;横向简支梁：左端 A 为铰支座、右端 B 为滚动支座。单位移动荷载 F&lt;sub&gt;P&lt;/sub&gt; = 1 沿梁移动，
  实时绘制支座反力 F&lt;sub&gt;yA&lt;/sub&gt;、F&lt;sub&gt;yB&lt;/sub&gt; 的影响线。可拖动红色荷载圆点、拖动滑块，或在影响线图上点击定位。&lt;/p&gt;

  &lt;!-- 梁体 + 移动荷载 --&gt;
  &lt;div class=&quot;card beam-card&quot;&gt;
    &lt;canvas id=&quot;beamCanvas&quot;&gt;&lt;/canvas&gt;
  &lt;/div&gt;

  &lt;!-- 控制面板 --&gt;
  &lt;div class=&quot;card controls&quot;&gt;
    &lt;div class=&quot;toolbar&quot;&gt;
      &lt;label&gt;荷载位置&lt;/label&gt;
      &lt;input type=&quot;range&quot; id=&quot;slider&quot; min=&quot;0&quot; max=&quot;8&quot; step=&quot;0.01&quot; value=&quot;2&quot;&gt;
      &lt;span id=&quot;xVal&quot; class=&quot;mono&quot;&gt;x = 2.00 m&lt;/span&gt;
      &lt;button id=&quot;playBtn&quot;&gt;▶ 自动演示&lt;/button&gt;
      &lt;button id=&quot;resetBtn&quot;&gt;重置&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stats&quot;&gt;
      &lt;div class=&quot;stat fya&quot;&gt;&lt;span class=&quot;k&quot;&gt;支座反力 F&lt;sub&gt;yA&lt;/sub&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;fyAval&quot;&gt;0.750&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stat fyb&quot;&gt;&lt;span class=&quot;k&quot;&gt;支座反力 F&lt;sub&gt;yB&lt;/sub&gt;&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;fyBval&quot;&gt;0.250&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stat&quot;&gt;&lt;span class=&quot;k&quot;&gt;F&lt;sub&gt;yA&lt;/sub&gt; + F&lt;sub&gt;yB&lt;/sub&gt;（校核）&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;sumval&quot;&gt;1.000&lt;/span&gt;&lt;/div&gt;

  &lt;/div&gt;

    &lt;div class=&quot;formula&quot;&gt;F&lt;sub&gt;yB&lt;/sub&gt; = &lt;b class=&quot;o&quot;&gt;x/l&lt;/b&gt; = x/8&lt;/div&gt;
    &lt;div class=&quot;formula&quot;&gt;F&lt;sub&gt;yA&lt;/sub&gt; + F&lt;sub&gt;yB&lt;/sub&gt; = 1&lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 两根影响线 --&gt;
  &lt;div class=&quot;charts&quot;&gt;
    &lt;div class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#2563eb;&quot;&gt;&lt;/span&gt;支座反力 F&lt;sub&gt;yA&lt;/sub&gt; 的影响线&lt;/div&gt;
      &lt;canvas id=&quot;ilaCanvas&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;chart-val&quot;&gt;当前纵标 &lt;b id=&quot;ilaVal&quot; style=&quot;color:#2563eb;&quot;&gt;0.750&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#ea580c;&quot;&gt;&lt;/span&gt;支座反力 F&lt;sub&gt;yB&lt;/sub&gt; 的影响线&lt;/div&gt;
      &lt;canvas id=&quot;ilbCanvas&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;chart-val&quot;&gt;当前纵标 &lt;b id=&quot;ilbVal&quot; style=&quot;color:#ea580c;&quot;&gt;0.250&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 说明 --&gt;
  &lt;div class=&quot;card note&quot;&gt;
    &lt;strong&gt;说明：&lt;/strong&gt;影响线纵标表示单位荷载 F&lt;sub&gt;P&lt;/sub&gt;=1 移到该位置时，所求支座反力的大小（纵标为无量纲比值，即 反力 / F&lt;sub&gt;P&lt;/sub&gt;）。
    F&lt;sub&gt;yA&lt;/sub&gt; 影响线为左端纵标 1、右端纵标 0 的斜直线；F&lt;sub&gt;yB&lt;/sub&gt; 影响线为左端 0、右端 1 的斜直线；两反力之和恒等于 1，满足竖向平衡 ΣF&lt;sub&gt;y&lt;/sub&gt;=0。
  &lt;/div&gt;

&lt;script&gt;
&quot;use strict&quot;;

/* ================= 常量 ================= */
const FONT = '&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,sans-serif';
const L = 8;                 // 梁跨长 (m)
let xp = 2.0;               // 荷载位置 (m)
const BLUE = '#2563eb', ORANGE = '#ea580c', RED = '#dc2626';

/* ================= Canvas 元素 ================= */
const beamEl = document.getElementById('beamCanvas');
const ilaEl   = document.getElementById('ilaCanvas');
const ilbEl   = document.getElementById('ilbCanvas');

/* 逻辑尺寸（CSS 下自适应缩放） */
const BEAM_W = 960, BEAM_H = 300;
const IL_W = 480, IL_H = 340;

function setupCanvas(cv, W, H){
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = '100%';
  cv.style.height = 'auto';
  cv._dpr = dpr;
  cv._logicalW = W;
  cv._logicalH = H;
}
setupCanvas(beamEl, BEAM_W, BEAM_H);
setupCanvas(ilaEl,  IL_W, IL_H);
setupCanvas(ilbEl,  IL_W, IL_H);

/* ================= 绘图工具 ================= */
function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function textW(ctx, s, size){ ctx.font = 'bold ' + size + 'px ' + FONT; return ctx.measureText(s).width; }
// 画「基符 + 下标」左对齐，返回总宽度
function subText(ctx, base, sub, x, y, size, color){
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.fillText(base, x, y);
  const w = ctx.measureText(base).width;
  ctx.font = Math.round(size*0.7) + 'px ' + FONT;
  ctx.fillText(sub, x + w, y + size*0.16);
  return w + ctx.measureText(sub).width;
}
function subWidth(ctx, base, sub, size){
  ctx.font = 'bold ' + size + 'px ' + FONT;
  const w = ctx.measureText(base).width;
  ctx.font = Math.round(size*0.7) + 'px ' + FONT;
  return w + ctx.measureText(sub).width;
}

/* ================= 梁体绘制 ================= */
function drawBeam(){
  const ctx = beamEl.getContext('2d');
  const dpr = beamEl._dpr, W = beamEl._logicalW, H = beamEl._logicalH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const xA = 130, xB = 880, beamY = 108;
  const bx = x =&gt; xA + (x / L) * (xB - xA);
  const fya = 1 - xp/L, fyb = xp/L;

  /* --- 地面（含斜线阴影） --- */
  const gY = beamY + 24;
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(xA-46, gY); ctx.lineTo(xB+46, gY); ctx.stroke();
  ctx.lineWidth = 1;
  for (let x = xA-46; x &lt;= xB+46; x += 8){
    ctx.beginPath(); ctx.moveTo(x, gY); ctx.lineTo(x-7, gY+9); ctx.stroke();
  }

  /* --- 支座 A（铰支座：三角形） --- */
  ctx.fillStyle = '#334155';
  ctx.beginPath(); ctx.moveTo(xA-15, beamY+16); ctx.lineTo(xA+15, beamY+16); ctx.lineTo(xA, beamY); ctx.closePath(); ctx.fill();

  /* --- 支座 B（滚动支座：三角形 + 两个滚轮） --- */
  ctx.beginPath(); ctx.moveTo(xB-15, beamY+11); ctx.lineTo(xB+15, beamY+11); ctx.lineTo(xB, beamY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#475569';
  ctx.beginPath(); ctx.arc(xB-7, beamY+17.5, 5.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(xB+7, beamY+17.5, 5.2, 0, Math.PI*2); ctx.fill();

  /* --- 梁体 --- */
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(xA, beamY); ctx.lineTo(xB, beamY); ctx.stroke();

  /* --- 节点标注 A / B --- */
  ctx.fillStyle = '#1e293b'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 15px ' + FONT;
  ctx.fillText('A', xA, beamY - 22);
  ctx.fillText('B', xB, beamY - 22);

  /* --- 移动荷载 F_P = 1 --- */
  const lx = bx(xp);
  const top = beamY - 68;               // 荷载圆点圆心
  // 竖向虚线引导
  ctx.setLineDash([4,4]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(lx, beamY-6); ctx.lineTo(lx, top); ctx.stroke();
  ctx.setLineDash([]);
  // 向下箭头
  ctx.strokeStyle = RED; ctx.fillStyle = RED; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(lx, top+9); ctx.lineTo(lx, beamY-7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx-7, beamY-15); ctx.lineTo(lx, beamY-7); ctx.lineTo(lx+7, beamY-15); ctx.closePath(); ctx.fill();
  // 荷载圆点（可拖动）
  ctx.beginPath(); ctx.arc(lx, top, 8.5, 0, Math.PI*2);
  ctx.fillStyle = RED; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  // 荷载标注 F_P = 1
  ctx.fillStyle = RED;
  const wF = subWidth(ctx,'F','P',15);
  const wEq = textW(ctx,' = 1',15);
  const lw = lx + 14;
  subText(ctx,'F','P',lw, top - 1, 15, RED);
  ctx.font = 'bold 15px ' + FONT; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(' = 1', lw + wF, top - 1);

  /* --- 支座反力箭头（颜色与影响线一致） --- */
  drawUpArrow(ctx, xA-32, beamY+46, beamY+10, BLUE);
  drawUpArrow(ctx, xB+32, beamY+46, beamY+10, ORANGE);
  // A 处标注 F_yA = 值
  let val = fya.toFixed(2);
  let w1 = subWidth(ctx,'F','yA',13) + textW(ctx,' = '+val,13);
  let lx0 = xA - 32;
  let ww = subText(ctx,'F','yA', lx0 - w1/2, beamY+4, 13, BLUE);
  ctx.font = 'bold 13px ' + FONT; ctx.fillStyle = BLUE; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(' = '+val, lx0 - w1/2 + ww, beamY+4);
  // B 处标注
  val = fyb.toFixed(2);
  w1 = subWidth(ctx,'F','yB',13) + textW(ctx,' = '+val,13);
  lx0 = xB + 32;
  ww = subText(ctx,'F','yB', lx0 - w1/2, beamY+4, 13, ORANGE);
  ctx.font = 'bold 13px ' + FONT; ctx.fillStyle = ORANGE;
  ctx.fillText(' = '+val, lx0 - w1/2 + ww, beamY+4);

  /* --- 尺寸标注 --- */
  dimLine(ctx, xA, xB, beamY+64, 'l = 8 m', 'center');
  dimLine(ctx, xA, lx, beamY+94, 'x = ' + xp.toFixed(2) + ' m', (lx-xA) &lt; 52 ? 'left' : 'center');
}

function drawUpArrow(ctx, x, yB, yT, color){
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x, yB); ctx.lineTo(x, yT); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-6, yT+7); ctx.lineTo(x, yT); ctx.lineTo(x+6, yT+7); ctx.closePath(); ctx.fill();
}

function dimLine(ctx, x1, x2, y, label, align){
  if (x2 - x1 &lt; 4) return;
  ctx.strokeStyle = '#64748b'; ctx.fillStyle = '#475569'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y-4); ctx.lineTo(x1, y+4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y-4); ctx.lineTo(x2, y+4); ctx.stroke();
  ctx.font = '13px ' + FONT; ctx.textBaseline = 'middle';
  if (align === 'left'){ ctx.textAlign = 'left'; ctx.fillText(label, x2 + 10, y); }
  else { ctx.textAlign = 'center'; ctx.fillText(label, (x1+x2)/2, y + 15); }
}

/* ================= 影响线绘制 ================= */
function drawIL(cv, color, vx, baseLab, subLab){
  const ctx = cv.getContext('2d');
  const dpr = cv._dpr, W = cv._logicalW, H = cv._logicalH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const ml = 58, mr = 24, mt = 18, mb = 56;
  const pw = W - ml - mr, ph = H - mt - mb;
  const ox = ml, oy = mt + ph;
  const X = x =&gt; ox + (x/L)*pw;
  const Y = v =&gt; oy - v*ph;

  /* 绘图区背景 */
  ctx.fillStyle = '#fbfcfe';
  ctx.fillRect(ox, mt, pw, ph);

  /* 网格 */
  ctx.lineWidth = 1;
  for (let x = 0; x &lt;= L; x += 1){
    ctx.strokeStyle = '#edf2f7';
    ctx.beginPath(); ctx.moveTo(X(x), mt); ctx.lineTo(X(x), oy); ctx.stroke();
  }
  for (let v = 0; v &lt;= 1.0001; v += 0.25){
    ctx.strokeStyle = (v === 0) ? '#cbd5e1' : '#edf2f7';
    ctx.beginPath(); ctx.moveTo(ox, Y(v)); ctx.lineTo(ox+pw, Y(v)); ctx.stroke();
  }

  /* 坐标轴 + 箭头 */
  ctx.strokeStyle = '#94a3b8'; ctx.fillStyle = '#94a3b8'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox+pw+8, oy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, mt-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox+pw+12, oy); ctx.lineTo(ox+pw+2, oy-4); ctx.lineTo(ox+pw+2, oy+4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox, mt-12); ctx.lineTo(ox-4, mt-2); ctx.lineTo(ox+4, mt-2); ctx.closePath(); ctx.fill();

  /* 刻度 */
  ctx.font = '12px ' + FONT; ctx.fillStyle = '#475569';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let x = 0; x &lt;= L; x += 2) ctx.fillText(String(x), X(x), oy + 6);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('0', ox-6, oy);
  ctx.fillText('0.5', ox-6, Y(0.5));
  ctx.fillText('1', ox-6, Y(1));

  /* 轴标题 */
  ctx.fillStyle = '#334155'; ctx.font = '13px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('荷载位置 x (m)', ox + pw/2, oy + 36);
  ctx.save();
  ctx.translate(15, mt + ph/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('影响线纵标（反力 / F_P）', 0, 0);
  ctx.restore();

  /* 影响线填充 + 直线 */
  const v0 = vx(0), v1 = vx(L);
  ctx.beginPath();
  ctx.moveTo(X(0), oy); ctx.lineTo(X(0), Y(v0)); ctx.lineTo(X(L), Y(v1)); ctx.lineTo(X(L), oy);
  ctx.closePath();
  ctx.fillStyle = hexA(color, 0.12); ctx.fill();

  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X(0), Y(v0)); ctx.lineTo(X(L), Y(v1)); ctx.stroke();

  /* 端点 */
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(X(0), Y(v0), 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(X(L), Y(v1), 4, 0, Math.PI*2); ctx.fill();

  /* 当前荷载位置：虚线 + 高亮点 + 标注 */
  const curV = vx(xp), curX = X(xp), curY = Y(curV);
  ctx.setLineDash([5,4]); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(curX, curY); ctx.lineTo(curX, oy); ctx.stroke();
  ctx.setLineDash([]);

  ctx.beginPath(); ctx.arc(curX, curY, 7, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();

  /* 标注 F_yA = 值 / F_yB = 值 */
  const size = 13;
  const rest = ' = ' + curV.toFixed(3);
  const total = subWidth(ctx, baseLab, subLab, size) + textW(ctx, rest, size);
  let sx = curX + 12;
  if (sx + total &gt; ox + pw) sx = curX - 12 - total;
  const labY = curY - 14 &lt; mt ? curY + 18 : curY - 14;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let cx = sx;
  ctx.font = 'bold ' + size + 'px ' + FONT; ctx.fillStyle = color;
  ctx.fillText(baseLab, cx, labY);
  cx += ctx.measureText(baseLab).width;
  ctx.font = Math.round(size*0.7) + 'px ' + FONT;
  ctx.fillText(subLab, cx, labY + size*0.18);
  cx += ctx.measureText(subLab).width;
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.fillText(rest, cx, labY);
}

const vya = x =&gt; 1 - x/L;   // F_yA 影响线
const vyb = x =&gt; x/L;       // F_yB 影响线

/* ================= 状态更新 ================= */
const slider = document.getElementById('slider');
const xVal = document.getElementById('xVal');
const fyAval = document.getElementById('fyAval');
const fyBval = document.getElementById('fyBval');
const sumval = document.getElementById('sumval');
const ilaVal = document.getElementById('ilaVal');
const ilbVal = document.getElementById('ilbVal');

function updateReadouts(){
  const fya = 1 - xp/L, fyb = xp/L;
  xVal.textContent = 'x = ' + xp.toFixed(2) + ' m';
  fyAval.textContent = fya.toFixed(3);
  fyBval.textContent = fyb.toFixed(3);
  sumval.textContent = (fya + fyb).toFixed(3);
  ilaVal.textContent = fya.toFixed(3);
  ilbVal.textContent = fyb.toFixed(3);
}

function setX(x){
  xp = Math.max(0, Math.min(L, x));
  slider.value = xp;
  updateReadouts();
  drawBeam();
  drawIL(ilaEl, BLUE, vya, 'F', 'yA');
  drawIL(ilbEl, ORANGE, vyb, 'F', 'yB');
}

/* ================= 交互：滑块 / 拖动 / 点击 ================= */
slider.addEventListener('input', () =&gt; setX(parseFloat(slider.value)));

let dragCv = null;
function clientXOf(e){ return e.touches &amp;&amp; e.touches[0] ? e.touches[0].clientX : e.clientX; }
function applyX(cv, clientX){
  const r = cv.getBoundingClientRect();
  const lx = (clientX - r.left) * (cv._logicalW / r.width);
  let x;
  if (cv === beamEl) x = (lx - 130) / (880 - 130) * L;
  else x = (lx - 58) / (cv._logicalW - 58 - 24) * L;
  setX(x);
}
[beamEl, ilaEl, ilbEl].forEach(cv =&gt; {
  cv.addEventListener('mousedown', e =&gt; { dragCv = cv; applyX(cv, e.clientX); });
  cv.addEventListener('mousemove', e =&gt; { if (dragCv === cv) applyX(cv, e.clientX); });
  cv.addEventListener('touchstart', e =&gt; { e.preventDefault(); dragCv = cv; applyX(cv, clientXOf(e)); }, {passive:false});
  cv.addEventListener('touchmove',  e =&gt; { e.preventDefault(); if (dragCv === cv) applyX(cv, clientXOf(e)); }, {passive:false});
});
window.addEventListener('mouseup', () =&gt; { dragCv = null; });
window.addEventListener('touchend', () =&gt; { dragCv = null; });

/* ================= 自动演示 ================= */
let playing = false, dir = 1;
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
function togglePlay(){
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 暂停' : '▶ 自动演示';
  if (playing) requestAnimationFrame(loop);
}
function loop(){
  if (!playing) return;
  xp += dir * 0.04;
  if (xp &gt;= L){ xp = L; dir = -1; }
  if (xp &lt;= 0){ xp = 0; dir = 1; }
  setX(xp);
  requestAnimationFrame(loop);
}
playBtn.addEventListener('click', togglePlay);
resetBtn.addEventListener('click', () =&gt; { playing = false; playBtn.textContent = '▶ 自动演示'; setX(2.0); });

/* ================= 初始化 ================= */
setX(2.0);

&lt;div class=&quot;wrap&quot;&gt;

  &lt;h1&gt;简支梁截面内力影响线 &lt;span class=&quot;badge&quot;&gt;结构力学 · 影响线&lt;/span&gt;&lt;/h1&gt;
  &lt;p class=&quot;sub&quot;&gt;横向简支梁：左端 A 铰支座、右端 B 滚动支座，跨长 &lt;b&gt;l = 8 m&lt;/b&gt;。可自行设定&lt;b&gt;截面 C&lt;/b&gt;的位置 a，单位移动荷载 F&lt;sub&gt;P&lt;/sub&gt; = 1 沿梁移动，
  实时绘制截面 C 处的&lt;b&gt;剪力 V&lt;sub&gt;C&lt;/sub&gt;&lt;/b&gt; 与&lt;b&gt;弯矩 M&lt;sub&gt;C&lt;/sub&gt;&lt;/b&gt; 影响线。拖动梁上的绿色截面手柄可改截面位置，拖动红色荷载圆点可移动荷载。&lt;/p&gt;

  &lt;!-- 梁体 + 截面 + 移动荷载 --&gt;

      &lt;div class=&quot;stat mc&quot;&gt;&lt;span class=&quot;k&quot;&gt;截面弯矩 M&lt;sub&gt;C&lt;/sub&gt; (m)&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;mcVal&quot;&gt;1.250&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;stat sa&quot;&gt;&lt;span class=&quot;k&quot;&gt;截面位置 a&lt;/span&gt;&lt;span class=&quot;v&quot; id=&quot;aStat&quot;&gt;3.00 m&lt;/span&gt;&lt;/div&gt;

    &lt;div class=&quot;chart-card&quot;&gt;
      &lt;div class=&quot;chart-head&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#ea580c;&quot;&gt;&lt;/span&gt;截面弯矩 M&lt;sub&gt;C&lt;/sub&gt; 的影响线&lt;/div&gt;
      &lt;canvas id=&quot;mCanvas&quot;&gt;&lt;/canvas&gt;
      &lt;div class=&quot;chart-val&quot;&gt;当前纵标 &lt;b id=&quot;mVal&quot; style=&quot;color:#ea580c;&quot;&gt;1.250 m&lt;/b&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 说明 --&gt;
  &lt;div class=&quot;card note&quot;&gt;
    &lt;strong&gt;说明：&lt;/strong&gt;
    ① 剪力影响线 V&lt;sub&gt;C&lt;/sub&gt; 为两条平行斜直线，在截面 x = a 处&lt;b&gt;突变&lt;/b&gt;，突变量恒等于 1（即单位荷载值）；荷载越靠近 A、B 支座，V&lt;sub&gt;C&lt;/sub&gt; 绝对值越小。
    ② 弯矩影响线 M&lt;sub&gt;C&lt;/sub&gt; 为&lt;b&gt;三角形&lt;/b&gt;，顶点在截面 x = a 处，峰值 a(l−a)/l；截面越靠近跨中，峰值越大，截面在中点（a=4 m）时峰值最大 = l/4 = 2 m。按结构力学惯例，弯矩图绘制在&lt;b&gt;杆件受拉侧&lt;/b&gt;——简支梁正弯矩下缘受拉，故弯矩影响线画在&lt;b&gt;横坐标（梁轴线）下侧&lt;/b&gt;，纵标不区分正负。
    ③ 绿色虚线表示截面位置，红色虚线表示当前荷载位置；图中剪力纵标为无量纲比值，弯矩纵标为长度（单位 m）。
  &lt;/div&gt;

&lt;script&gt;
&quot;use strict&quot;;

/* ================= 常量 ================= */
const FONT = '&quot;Microsoft YaHei&quot;,&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,sans-serif';
const L = 8;                 // 梁跨长 (m)
let a = 3.0;                // 截面 C 位置 (m)
let xp = 2.0;               // 荷载位置 (m)
const BLUE = '#2563eb', ORANGE = '#ea580c', RED = '#dc2626', GREEN = '#16a34a';

/* ================= Canvas ================= */
const beamEl = document.getElementById('beamCanvas');
const vEl = document.getElementById('vCanvas');
const mEl = document.getElementById('mCanvas');
const BEAM_W = 960, BEAM_H = 320;
const IL_W = 480, IL_H = 340;

function setupCanvas(cv, W, H){
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width = '100%';
  cv.style.height = 'auto';
  cv._dpr = dpr; cv._logicalW = W; cv._logicalH = H;
}
setupCanvas(beamEl, BEAM_W, BEAM_H);
setupCanvas(vEl, IL_W, IL_H);
setupCanvas(mEl, IL_W, IL_H);

/* ================= 绘图工具 ================= */
function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function textW(ctx, s, size){ ctx.font = 'bold '+size+'px '+FONT; return ctx.measureText(s).width; }
function subText(ctx, base, sub, x, y, size, color){
  ctx.fillStyle = color; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.font = 'bold '+size+'px '+FONT;
  ctx.fillText(base, x, y);
  const w = ctx.measureText(base).width;
  ctx.font = Math.round(size*0.7)+'px '+FONT;
  ctx.fillText(sub, x + w, y + size*0.16);
  return w + ctx.measureText(sub).width;
}
function subWidth(ctx, base, sub, size){
  ctx.font = 'bold '+size+'px '+FONT;
  const w = ctx.measureText(base).width;
  ctx.font = Math.round(size*0.7)+'px '+FONT;
  return w + ctx.measureText(sub).width;
}

/* ================= 截面内力函数 ================= */
const Vneg = () =&gt; -a/L;              // x→a⁻ 剪力左极限
const Vpos = () =&gt; (L-a)/L;           // x→a⁺ 剪力右极限
const Vat = x =&gt; (x &lt; a ? -x/L : (L-x)/L);
const Mat = x =&gt; (x &lt;= a ? x*(L-a)/L : a*(L-x)/L);
const Mmax = () =&gt; a*(L-a)/L;

/* ================= 梁体绘制 ================= */
function drawBeam(){
  const ctx = beamEl.getContext('2d');
  const dpr = beamEl._dpr, W = beamEl._logicalW, H = beamEl._logicalH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const xA = 130, xB = 880, beamY = 100;
  const bx = x =&gt; xA + (x/L)*(xB-xA);
  const xa = bx(a), xx = bx(xp);

  /* --- 地面 --- */
  const gY = beamY + 24;
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(xA-46, gY); ctx.lineTo(xB+46, gY); ctx.stroke();
  ctx.lineWidth = 1;
  for (let x = xA-46; x &lt;= xB+46; x += 8){
    ctx.beginPath(); ctx.moveTo(x, gY); ctx.lineTo(x-7, gY+9); ctx.stroke();
  }

  /* --- 支座 --- */
  ctx.fillStyle = '#334155';
  ctx.beginPath(); ctx.moveTo(xA-15, beamY+16); ctx.lineTo(xA+15, beamY+16); ctx.lineTo(xA, beamY); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(xB-15, beamY+11); ctx.lineTo(xB+15, beamY+11); ctx.lineTo(xB, beamY); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#475569';
  ctx.beginPath(); ctx.arc(xB-7, beamY+17.5, 5.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(xB+7, beamY+17.5, 5.2, 0, Math.PI*2); ctx.fill();

  /* --- 梁体 --- */
  ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(xA, beamY); ctx.lineTo(xB, beamY); ctx.stroke();

  /* --- 节点标注 --- */
  ctx.fillStyle = '#1e293b'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font = 'bold 15px '+FONT;
  ctx.fillText('A', xA, beamY-22);
  ctx.fillText('B', xB, beamY-22);

  /* --- 截面 C：绿色虚线切开梁 + 手柄 + 标注 --- */
  ctx.setLineDash([6,4]); ctx.strokeStyle = GREEN; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(xa, beamY-30); ctx.lineTo(xa, beamY+18); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = GREEN;
  ctx.fillRect(xa-7, beamY-37, 14, 14);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(xa-7, beamY-37, 14, 14);
  ctx.fillStyle = GREEN; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.font = 'bold 15px '+FONT;
  ctx.fillText('C', xa, beamY-45);

  /* --- 移动荷载 F_P = 1 --- */
  const top = beamY - 66;
  ctx.setLineDash([4,4]); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(xx, beamY-6); ctx.lineTo(xx, top); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = RED; ctx.fillStyle = RED; ctx.lineWidth = 3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(xx, top+9); ctx.lineTo(xx, beamY-7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(xx-7, beamY-15); ctx.lineTo(xx, beamY-7); ctx.lineTo(xx+7, beamY-15); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(xx, top, 8.5, 0, Math.PI*2);
  ctx.fillStyle = RED; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  const wF = subWidth(ctx,'F','P',15);
  const lw = xx + 14;
  subText(ctx,'F','P', lw, top-1, 15, RED);
  ctx.font = 'bold 15px '+FONT; ctx.fillStyle=RED; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText(' = 1', lw + wF, top-1);

  /* --- 尺寸标注 --- */
  dimBetween(ctx, xA, xa, beamY+52, 'a = '+a.toFixed(2)+' m');
  dimBetween(ctx, xa, xB, beamY+52, 'l−a = '+(L-a).toFixed(2)+' m');
  dimLine(ctx, xA, xB, beamY+82, 'l = 8 m', 'center');
}

function dimLine(ctx, x1, x2, y, label, align){
  ctx.strokeStyle = '#64748b'; ctx.fillStyle = '#475569'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y-4); ctx.lineTo(x1, y+4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y-4); ctx.lineTo(x2, y+4); ctx.stroke();
  ctx.font = '13px '+FONT; ctx.textBaseline = 'middle';
  if (align === 'left'){ ctx.textAlign='left'; ctx.fillText(label, x2+10, y); }
  else { ctx.textAlign='center'; ctx.fillText(label, (x1+x2)/2, y+15); }
}
function dimBetween(ctx, x1, x2, y, label){
  if (x2 - x1 &lt; 4) return;
  ctx.strokeStyle = '#64748b'; ctx.fillStyle = '#475569'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y-4); ctx.lineTo(x1, y+4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2, y-4); ctx.lineTo(x2, y+4); ctx.stroke();
  ctx.font = '13px '+FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
  if (x2 - x1 &gt;= 44) ctx.fillText(label, (x1+x2)/2, y+15);
  else ctx.fillText(label, (x1+x2)/2, y-10);
}

/* ================= 影响线绘制 ================= */
function drawVIL(){
  const ctx = vEl.getContext('2d');
  const dpr = vEl._dpr, W = vEl._logicalW, H = vEl._logicalH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const ml = 58, mr = 24, mt = 18, mb = 56;
  const pw = W - ml - mr, ph = H - mt - mb;
  const ox = ml, oy0 = mt + ph/2;               // V=0 中线
  const X = x =&gt; ox + (x/L)*pw;
  const Y = v =&gt; oy0 - v*(ph/2);                // v ∈ [-1,1]

  ctx.fillStyle = '#fbfcfe'; ctx.fillRect(ox, mt, pw, ph);

  /* 网格 */
  ctx.lineWidth = 1;
  for (let x = 0; x &lt;= L; x += 1){
    ctx.strokeStyle = '#edf2f7';
    ctx.beginPath(); ctx.moveTo(X(x), mt); ctx.lineTo(X(x), mt+ph); ctx.stroke();
  }
  for (let v = -1; v &lt;= 1.0001; v += 0.5){
    ctx.strokeStyle = (v === 0) ? '#cbd5e1' : '#edf2f7';
    ctx.beginPath(); ctx.moveTo(ox, Y(v)); ctx.lineTo(ox+pw, Y(v)); ctx.stroke();
  }

  /* 坐标轴 */
  ctx.strokeStyle = '#94a3b8'; ctx.fillStyle = '#94a3b8'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(ox, oy0); ctx.lineTo(ox+pw+8, oy0); ctx.stroke();   // x 轴（V=0）
  ctx.beginPath(); ctx.moveTo(ox, mt-8); ctx.lineTo(ox, mt+ph); ctx.stroke();      // y 轴
  ctx.beginPath(); ctx.moveTo(ox+pw+12, oy0); ctx.lineTo(ox+pw+2, oy0-4); ctx.lineTo(ox+pw+2, oy0+4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox, mt-12); ctx.lineTo(ox-4, mt-2); ctx.lineTo(ox+4, mt-2); ctx.closePath(); ctx.fill();

  /* 刻度 */
  ctx.font = '12px '+FONT; ctx.fillStyle = '#475569';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let x = 0; x &lt;= L; x += 2) ctx.fillText(String(x), X(x), oy0 + 6);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('-1', ox-6, Y(-1));
  ctx.fillText('-0.5', ox-6, Y(-0.5));
  ctx.fillText('0', ox-6, oy0);
  ctx.fillText('0.5', ox-6, Y(0.5));
  ctx.fillText('1', ox-6, Y(1));

  /* 轴标题 */
  ctx.fillStyle = '#334155'; ctx.font = '13px '+FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('荷载位置 x (m)', ox + pw/2, mt + ph + 36);
  ctx.save();
  ctx.translate(15, mt + ph/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('V_C 影响线纵标', 0, 0);
  ctx.restore();

  /* 截面位置参考线（绿色虚线） */
  ctx.setLineDash([5,4]); ctx.strokeStyle = GREEN; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(a), mt); ctx.lineTo(X(a), mt+ph); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = GREEN; ctx.font = 'bold 12px '+FONT; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('截面 C', X(a)+5, mt+2);

  /* 剪力影响线：两段 + 突变 */
  const vL = Vneg(), vR = Vpos();
  ctx.strokeStyle = BLUE; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(a), Y(vL)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(a), Y(vR)); ctx.lineTo(X(L), Y(0)); ctx.stroke();
  // 突变竖虚线
  ctx.setLineDash([3,3]); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(X(a), Y(vL)); ctx.lineTo(X(a), Y(vR)); ctx.stroke();
  ctx.setLineDash([]);
  // 左段终点空心圆、右段起点实心圆
  ctx.fillStyle = '#fff'; ctx.strokeStyle = BLUE; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(X(a), Y(vL), 4.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = BLUE;
  ctx.beginPath(); ctx.arc(X(a), Y(vR), 4.5, 0, Math.PI*2); ctx.fill();
  // 突变标注
  ctx.fillStyle = BLUE; ctx.font = 'bold 12px '+FONT; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('ΔV_C = 1', X(a)+7, (Y(vL)+Y(vR))/2);

  /* 当前荷载位置：红虚线 + 高亮点 */
  const curX = X(xp);
  ctx.setLineDash([5,4]); ctx.strokeStyle = RED; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(curX, Y(vR)+4); ctx.lineTo(curX, oy0); ctx.stroke();
  ctx.setLineDash([]);
  const nearCut = Math.abs(xp - a) &lt; 0.02;
  if (nearCut){
    ctx.fillStyle = BLUE;
    ctx.beginPath(); ctx.arc(curX, Y(vL), 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(curX, Y(vR), 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.stroke();
  } else {
    const cv = Vat(xp), cy = Y(cv);
    ctx.beginPath(); ctx.arc(curX, cy, 7, 0, Math.PI*2);
    ctx.fillStyle = BLUE; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    // 标注 V_C = 值
    const rest = ' = ' + cv.toFixed(3);
    const total = subWidth(ctx,'V','C',13) + textW(ctx, rest, 13);
    let sx = curX + 12; if (sx + total &gt; ox+pw) sx = curX - 12 - total;
    const labY = cy - 14 &lt; mt ? cy + 20 : cy - 14;
    let cx = sx;
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.font = 'bold 13px '+FONT; ctx.fillStyle = BLUE;
    ctx.fillText('V', cx, labY); cx += ctx.measureText('V').width;
    ctx.font = Math.round(13*0.7)+'px '+FONT; ctx.fillText('C', cx, labY + 13*0.18); cx += ctx.measureText('C').width;
    ctx.font = 'bold 13px '+FONT; ctx.fillText(rest, cx, labY);
  }
}

function drawMIL(){
  const ctx = mEl.getContext('2d');
  const dpr = mEl._dpr, W = mEl._logicalW, H = mEl._logicalH;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const ml = 58, mr = 24, mt = 34, mb = 56;
  const pw = W - ml - mr, ph = H - mt - mb;
  const ox = ml, oy = mt;                       // 横坐标（M=0 基线）在顶部
  const Mref = L/4;                             // 固定纵轴 0~2 m
  const X = x =&gt; ox + (x/L)*pw;
  const Y = m =&gt; oy + (m/Mref)*ph;              // 正值向下 → 弯矩图画在横坐标下侧（受拉侧）

  ctx.fillStyle = '#fbfcfe'; ctx.fillRect(ox, mt, pw, ph);

  /* 网格 */
  ctx.lineWidth = 1;
  for (let x = 0; x &lt;= L; x += 1){
    ctx.strokeStyle = '#edf2f7';
    ctx.beginPath(); ctx.moveTo(X(x), mt); ctx.lineTo(X(x), mt+ph); ctx.stroke();
  }
  for (let m = 0; m &lt;= Mref + 0.0001; m += 0.5){
    ctx.strokeStyle = (m === 0) ? '#cbd5e1' : '#edf2f7';
    ctx.beginPath(); ctx.moveTo(ox, Y(m)); ctx.lineTo(ox+pw, Y(m)); ctx.stroke();
  }

  /* 坐标轴 */
  ctx.strokeStyle = '#94a3b8'; ctx.fillStyle = '#94a3b8'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox+pw+8, oy); ctx.stroke();   // x 轴（M=0 基线）
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy+ph); ctx.stroke();      // y 轴（朝下）
  ctx.beginPath(); ctx.moveTo(ox+pw+12, oy); ctx.lineTo(ox+pw+2, oy-4); ctx.lineTo(ox+pw+2, oy+4); ctx.closePath(); ctx.fill();  // x 轴箭头
  ctx.beginPath(); ctx.moveTo(ox, oy+ph+6); ctx.lineTo(ox-4, oy+ph-2); ctx.lineTo(ox+4, oy+ph-2); ctx.closePath(); ctx.fill();    // y 轴箭头（朝下）

  /* 刻度 */
  ctx.font = '12px '+FONT; ctx.fillStyle = '#475569';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  for (let x = 0; x &lt;= L; x += 2) ctx.fillText(String(x), X(x), oy - 6);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let m = 0; m &lt;= Mref; m += 0.5) ctx.fillText(String(m), ox-6, Y(m));

  /* 轴标题 */
  ctx.fillStyle = '#334155'; ctx.font = '13px '+FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('荷载位置 x (m)', ox + pw/2, mt + ph + 36);
  ctx.save();
  ctx.translate(15, mt + ph/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('M_C 影响线纵标 (m)', 0, 0);
  ctx.restore();

  /* 截面位置参考线（绿色虚线） */
  ctx.setLineDash([5,4]); ctx.strokeStyle = GREEN; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(X(a), mt); ctx.lineTo(X(a), mt+ph); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = GREEN; ctx.font = 'bold 12px '+FONT; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('截面 C', X(a)+5, mt+2);

  /* 弯矩影响线：三角形（画在横坐标下侧＝受拉侧，纵标不区分正负） */
  const mmax = Mmax();
  ctx.beginPath();
  ctx.moveTo(X(0), oy); ctx.lineTo(X(a), Y(mmax)); ctx.lineTo(X(L), oy);
  ctx.closePath();
  ctx.fillStyle = hexA(ORANGE, 0.12); ctx.fill();
  ctx.strokeStyle = ORANGE; ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(a), Y(mmax)); ctx.lineTo(X(L), Y(0)); ctx.stroke();
  // 顶点
  ctx.fillStyle = ORANGE;
  ctx.beginPath(); ctx.arc(X(a), Y(mmax), 4.5, 0, Math.PI*2); ctx.fill();
  // 顶点标注
  const restM = ' = ' + mmax.toFixed(3);
  const totalM = subWidth(ctx,'M','C,max',12) + textW(ctx, restM, 12);
  let sxM = X(a) + 12; if (sxM + totalM &gt; ox+pw) sxM = X(a) - 12 - totalM;
  let cxM = sxM, lyM = Y(mmax) + 16; if (lyM &gt; mt+ph - 4) lyM = Y(mmax) - 12;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font = 'bold 12px '+FONT; ctx.fillStyle = ORANGE;
  ctx.fillText('M', cxM, lyM); cxM += ctx.measureText('M').width;
  ctx.font = Math.round(12*0.7)+'px '+FONT; ctx.fillText('C,max', cxM, lyM + 12*0.18); cxM += ctx.measureText('C,max').width;
  ctx.font = 'bold 12px '+FONT; ctx.fillText(restM, cxM, lyM);

  /* 当前荷载位置：红虚线 + 高亮点 */
  const curM = Mat(xp), curX = X(xp), curY = Y(curM);
  ctx.setLineDash([5,4]); ctx.strokeStyle = RED; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(curX, curY); ctx.lineTo(curX, oy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(curX, curY, 7, 0, Math.PI*2);
  ctx.fillStyle = ORANGE; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  const rest2 = ' = ' + curM.toFixed(3);
  const total2 = subWidth(ctx,'M','C',13) + textW(ctx, rest2, 13);
  let sx2 = curX + 12; if (sx2 + total2 &gt; ox+pw) sx2 = curX - 12 - total2;
  let labY2 = curY + 16; if (labY2 &gt; mt+ph) labY2 = curY - 14;
  let cx2 = sx2;
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font = 'bold 13px '+FONT; ctx.fillStyle = ORANGE;
  ctx.fillText('M', cx2, labY2); cx2 += ctx.measureText('M').width;
  ctx.font = Math.round(13*0.7)+'px '+FONT; ctx.fillText('C', cx2, labY2 + 13*0.18); cx2 += ctx.measureText('C').width;
  ctx.font = 'bold 13px '+FONT; ctx.fillText(rest2, cx2, labY2);
}

/* ================= 读数更新 ================= */
const secSlider = document.getElementById('secSlider');
const loadSlider = document.getElementById('loadSlider');
const aVal = document.getElementById('aVal');
const xVal = document.getElementById('xVal');
const vcVal = document.getElementById('vcVal');
const mcVal = document.getElementById('mcVal');
const aStat = document.getElementById('aStat');
const mmaxStat = document.getElementById('mmaxStat');
const fMmax = document.getElementById('fMmax');
const vVal = document.getElementById('vVal');
const mVal = document.getElementById('mVal');

function updateReadouts(){
  const aTxt = a.toFixed(2) + ' m';
  aVal.textContent = 'a = ' + aTxt;
  xVal.textContent = 'x = ' + xp.toFixed(2) + ' m';
  aStat.textContent = aTxt;
  mmaxStat.textContent = Mmax().toFixed(3);
  fMmax.textContent = Mmax().toFixed(3);
  mcVal.textContent = Mat(xp).toFixed(3);
  mVal.textContent = Mat(xp).toFixed(3) + ' m';
  if (Math.abs(xp - a) &lt; 0.02){
    vcVal.textContent = Vneg().toFixed(3) + ' / ' + Vpos().toFixed(3);
    vVal.textContent = '突变 ΔV_C = 1';
  } else {
    vcVal.textContent = Vat(xp).toFixed(3);
    vVal.textContent = Vat(xp).toFixed(3);
  }
}

/* ================= 状态设置 ================= */
function setA(v){
  a = Math.max(0.5, Math.min(7.5, v));
  secSlider.value = a;
  refresh();
}
function setX(v){
  xp = Math.max(0, Math.min(L, v));
  loadSlider.value = xp;
  refresh();
}
function refresh(){
  updateReadouts();
  drawBeam();
  drawVIL();
  drawMIL();
}

/* ================= 交互 ================= */
secSlider.addEventListener('input', () =&gt; setA(parseFloat(secSlider.value)));
loadSlider.addEventListener('input', () =&gt; setX(parseFloat(loadSlider.value)));

let dragCv = null, dragMode = null;   // dragMode: 'load' | 'sec'
function beamStart(clientX, clientY){
  const r = beamEl.getBoundingClientRect();
  const mx = (clientX - r.left) * (BEAM_W / r.width);
  const my = (clientY - r.top) * (BEAM_H / r.height);
  const xA = 130, xB = 880, beamY = 100;
  const bx = x =&gt; xA + (x/L)*(xB-xA);
  const dL = Math.hypot(mx - bx(xp), my - (beamY-66));
  const dS = Math.hypot(mx - bx(a),  my - (beamY-30));
  if (dL &lt;= dS &amp;&amp; dL &lt; 42) dragMode = 'load';
  else if (dS &lt; 42) dragMode = 'sec';
  else dragMode = null;
}
function onDown(cv, clientX, clientY){
  dragCv = cv;
  if (cv === beamEl) beamStart(clientX, clientY);
  else dragMode = 'load';
  if (dragMode) applyDrag(cv, clientX);
}
function applyDrag(cv, clientX){
  const r = cv.getBoundingClientRect();
  const lx = (clientX - r.left) * (cv._logicalW / r.width);
  let x;
  if (cv === beamEl) x = (lx - 130) / (880 - 130) * L;
  else x = (lx - 58) / (cv._logicalW - 58 - 24) * L;
  if (dragMode === 'sec') setA(x); else setX(x);
}
[beamEl, vEl, mEl].forEach(cv =&gt; {
  cv.addEventListener('mousedown', e =&gt; onDown(cv, e.clientX, e.clientY));
  cv.addEventListener('mousemove', e =&gt; { if (dragCv === cv &amp;&amp; dragMode) applyDrag(cv, e.clientX); });
  cv.addEventListener('touchstart', e =&gt; { e.preventDefault(); const t = e.touches[0]; onDown(cv, t.clientX, t.clientY); }, {passive:false});
  cv.addEventListener('touchmove',  e =&gt; { e.preventDefault(); if (dragCv === cv &amp;&amp; dragMode){ const t = e.touches[0]; applyDrag(cv, t.clientX); } }, {passive:false});
});
window.addEventListener('mouseup', () =&gt; { dragCv = null; dragMode = null; });
window.addEventListener('touchend', () =&gt; { dragCv = null; dragMode = null; });

/* ================= 自动演示 ================= */
let playing = false, dir = 1;
const playBtn = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');
function togglePlay(){
  playing = !playing;
  playBtn.textContent = playing ? '⏸ 暂停' : '▶ 自动演示';
  if (playing) requestAnimationFrame(loop);
}
function loop(){
  if (!playing) return;
  xp += dir * 0.04;
  if (xp &gt;= L){ xp = L; dir = -1; }
  if (xp &lt;= 0){ xp = 0; dir = 1; }
  setX(xp);
  requestAnimationFrame(loop);
}
playBtn.addEventListener('click', togglePlay);
resetBtn.addEventListener('click', () =&gt; {
  playing = false; playBtn.textContent = '▶ 自动演示';
  a = 3.0; xp = 2.0; secSlider.value = a; loadSlider.value = xp;
  refresh();
});

/* ================= 初始化 ================= */
refresh();
&lt;/script&gt;
&lt;/body&gt;

"></iframe>
  <div class="foot">两个模块均为自包含单文件，无需外部依赖。</div>

<script>
"use strict";
(function(){
  var tabs = document.querySelectorAll('.tab');
  var frames = { '1': document.getElementById('frame1'), '2': document.getElementById('frame2') };
  var activeT = '1';
  function fit(frame){
    try{
      var d = frame.contentDocument;
      if(!d) return;
      var h = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
      if(h > 0) frame.style.height = h + 'px';
    }catch(e){}
  }
  function show(t){
    activeT = t;
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].getAttribute('data-t') === t);
    frames['1'].classList.toggle('hidden', t !== '1');
    frames['2'].classList.toggle('hidden', t !== '2');
    fit(frames[t]);
  }
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener('click', function(){ show(this.getAttribute('data-t')); });
  }
  window.addEventListener('resize', function(){ fit(frames[activeT]); });
  document.getElementById('frame1').addEventListener('load', function(){
    if(document.querySelector('.tab.active').getAttribute('data-t') === '1') fit(frames['1']);
  });
  document.getElementById('frame2').addEventListener('load', function(){
    if(document.querySelector('.tab.active').getAttribute('data-t') === '2') fit(frames['2']);
  });
  show('1');
})();
</script>
