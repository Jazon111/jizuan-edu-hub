<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题闯关数据监控大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: #0a1628;
    color: #e0e6ed;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 顶部标题栏 */
  .header {
    background: linear-gradient(180deg, #0d2137 0%, #0a1628 100%);
    border-bottom: 1px solid #1e3a5f;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 600;
    background: linear-gradient(90deg, #00d4ff, #00ffaa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 13px;
  }
  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 10px #00ff88;
    animation: pulse 2s infinite;
  }
  .status-dot.error {
    background: #ff4444;
    box-shadow: 0 0 10px #ff4444;
  }
  .status-dot.refreshing {
    background: #ffaa00;
    box-shadow: 0 0 10px #ffaa00;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .countdown {
    font-family: 'Consolas', monospace;
    color: #00d4ff;
    min-width: 60px;
  }
  .last-update { color: #8899aa; }

  /* 主体布局 */
  .main {
    padding: 20px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  /* KPI 卡片 */
  .kpi-row {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
  .kpi-card {
    background: linear-gradient(135deg, #0f2847 0%, #0a1e35 100%);
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 20px 24px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #00d4ff, #00ffaa);
  }
  .kpi-label {
    font-size: 13px;
    color: #8899aa;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .kpi-value {
    font-size: 36px;
    font-weight: 700;
    font-family: 'Consolas', monospace;
    color: #00d4ff;
    transition: color 0.3s;
  }
  .kpi-value.flash {
    color: #00ffaa;
  }
  .kpi-unit {
    font-size: 14px;
    color: #8899aa;
    margin-left: 4px;
  }

  /* 图表卡片 */
  .chart-card {
    background: linear-gradient(135deg, #0f2847 0%, #0a1e35 100%);
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 16px;
  }
  .chart-title {
    font-size: 14px;
    color: #aabbcc;
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid #00d4ff;
    letter-spacing: 1px;
  }
  .chart-container {
    width: 100%;
    height: 260px;
  }

  /* 表格区域 */
  .table-section {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #0f2847 0%, #0a1e35 100%);
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 16px;
  }
  .table-wrapper {
    overflow-x: auto;
    max-height: 400px;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead th {
    background: #132d4f;
    color: #00d4ff;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    position: sticky;
    top: 0;
    z-index: 1;
    white-space: nowrap;
    border-bottom: 2px solid #1e3a5f;
  }
  tbody td {
    padding: 10px 12px;
    border-bottom: 1px solid #162a45;
    color: #c0cdd9;
    white-space: nowrap;
  }
  tbody tr:hover {
    background: rgba(0, 212, 255, 0.05);
  }
  .score-high { color: #00ff88; font-weight: 600; }
  .score-mid { color: #ffaa00; font-weight: 600; }
  .score-low { color: #ff6666; font-weight: 600; }
  .status-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 12px;
    background: rgba(0, 255, 136, 0.15);
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.3);
  }

  /* 错误提示 */
  .error-banner {
    position: fixed;
    top: 70px;
    right: 24px;
    background: rgba(255, 68, 68, 0.15);
    border: 1px solid #ff4444;
    color: #ff8888;
    padding: 12px 20px;
    border-radius: 6px;
    font-size: 13px;
    z-index: 1000;
    display: none;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* 底部状态栏 */
  .footer {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: #556677;
    border-top: 1px solid #1e3a5f;
  }
  .footer.error { color: #ff6666; }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0a1628; }
  ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #2a5080; }

  @media (max-width: 1200px) {
    .main { grid-template-columns: 1fr 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>答题闯关数据监控大屏</h1>
  <div class="header-right">
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">实时监控中</span>
    </div>
    <div>下次刷新: <span class="countdown" id="countdown">10</span>s</div>
    <div class="last-update" id="lastUpdate">--</div>
  </div>
</div>

<div class="error-banner" id="errorBanner">
  ⚠ 数据获取失败，将在 10 秒后自动重试...
</div>

<div class="main">
  <!-- KPI 卡片 -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-label">总提交数</div>
      <div class="kpi-value" id="kpiTotal">0<span class="kpi-unit">次</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">平均得分</div>
      <div class="kpi-value" id="kpiAvgScore">0<span class="kpi-unit">分</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">平均正确率</div>
      <div class="kpi-value" id="kpiAvgAccuracy">0<span class="kpi-unit">%</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">平均用时</div>
      <div class="kpi-value" id="kpiAvgDuration">0<span class="kpi-unit">秒</span></div>
    </div>
  </div>

  <!-- 得分分布 -->
  <div class="chart-card">
    <div class="chart-title">得分分布</div>
    <div class="chart-container" id="scoreChart"></div>
  </div>

  <!-- 正确率分布 -->
  <div class="chart-card">
    <div class="chart-title">正确率分布</div>
    <div class="chart-container" id="accuracyChart"></div>
  </div>

  <!-- 课程统计 -->
  <div class="chart-card">
    <div class="chart-title">课程提交统计</div>
    <div class="chart-container" id="courseChart"></div>
  </div>

  <!-- 数据表格 -->
  <div class="table-section">
    <div class="chart-title">提交记录明细</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>序号</th>
            <th>学生姓名</th>
            <th>学号</th>
            <th>课程</th>
            <th>得分</th>
            <th>正确率</th>
            <th>用时</th>
            <th>答题详情</th>
            <th>状态</th>
            <th>完成时间</th>
            <th>IP地址</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="11" style="text-align:center;color:#556677;padding:30px;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="footer" id="footer">
  数据来源: quickform.cn API | 自动刷新间隔: 10秒
</div>

<script>
const API_URL = 'https://quickform.cn/api/6ivostlhav/all';
const REFRESH_INTERVAL = 10; // 秒
let countdown = REFRESH_INTERVAL;
let timer = null;
let scoreChart, accuracyChart, courseChart;

// 初始化图表
function initCharts() {
  scoreChart = echarts.init(document.getElementById('scoreChart'));
  accuracyChart = echarts.init(document.getElementById('accuracyChart'));
  courseChart = echarts.init(document.getElementById('courseChart'));
  window.addEventListener('resize', () => {
    scoreChart.resize();
    accuracyChart.resize();
    courseChart.resize();
  });
}

// 获取数据
async function fetchData() {
  setStatus('refreshing');
  try {
    const response = await fetch(API_URL, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    processData(data);
    setStatus('ok');
    hideError();
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch (err) {
    console.error('数据获取失败:', err);
    setStatus('error');
    showError();
  }
}

// 处理数据
function processData(data) {
  const submissions = data.submissions || [];
  // 过滤有效记录（至少有 name 或 studentId 或 score）
  const valid = submissions.filter(s => s.name || s.studentId || (s.score !== undefined));

  // KPI
  const total = data.total_submissions || valid.length;
  const avgScore = valid.length ? (valid.reduce((s, r) => s + (r.score || 0), 0) / valid.length).toFixed(1) : 0;
  const avgAccuracy = valid.length ? (valid.reduce((s, r) => s + (r.accuracy || 0), 0) / valid.length).toFixed(1) : 0;
  const avgDuration = valid.length ? Math.round(valid.reduce((s, r) => s + (r.durationSec || 0), 0) / valid.length) : 0;

  updateKPI('kpiTotal', total);
  updateKPI('kpiAvgScore', avgScore);
  updateKPI('kpiAvgAccuracy', avgAccuracy);
  updateKPI('kpiAvgDuration', avgDuration);

  // 渲染图表
  renderScoreChart(valid);
  renderAccuracyChart(valid);
  renderCourseChart(valid);

  // 渲染表格
  renderTable(valid);
}

// KPI 更新带闪烁
function updateKPI(id, value) {
  const el = document.getElementById(id);
  const unit = el.querySelector('.kpi-unit')?.outerHTML || '';
  el.innerHTML = value + unit;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 600);
}

// 得分分布柱状图
function renderScoreChart(data) {
  const buckets = [
    { name: '0-20', min: 0, max: 20, count: 0 },
    { name: '20-40', min: 20, max: 40, count: 0 },
    { name: '40-60', min: 40, max: 60, count: 0 },
    { name: '60-80', min: 60, max: 80, count: 0 },
    { name: '80-100', min: 80, max: 100, count: 0 },
  ];
  data.forEach(r => {
    const s = r.score || 0;
    for (const b of buckets) {
      if (s >= b.min && s < b.max) { b.count++; break; }
    }
    if (s >= 100) buckets[4].count++;
  });

  scoreChart.setOption({
    tooltip: { trigger: 'axis', backgroundColor: '#0f2847', borderColor: '#1e3a5f', textStyle: { color: '#e0e6ed' } },
    grid: { left: '10%', right: '5%', top: '10%', bottom: '15%' },
    xAxis: {
      type: 'category',
      data: buckets.map(b => b.name),
      axisLine: { lineStyle: { color: '#1e3a5f' } },
      axisLabel: { color: '#8899aa' }
    },
    yAxis: {
      type: 'value',
      axisLine: { lineStyle: { color: '#1e3a5f' } },
      axisLabel: { color: '#8899aa' },
      splitLine: { lineStyle: { color: '#162a45' } }
    },
    series: [{
      type: 'bar',
      data: buckets.map((b, i) => ({
        value: b.count,
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: ['#00ff88', '#ffaa00', '#ff6666', '#00d4ff', '#00ffaa'][i] },
            { offset: 1, color: '#0a1e35' }
          ]),
          borderRadius: [4, 4, 0, 0]
        }
      })),
      barWidth: '50%',
      label: { show: true, position: 'top', color: '#aabbcc', fontSize: 11 }
    }]
  });
}

// 正确率分布环形图
function renderAccuracyChart(data) {
  const buckets = [
    { name: '0-20%', count: 0 },
    { name: '20-40%', count: 0 },
    { name: '40-60%', count: 0 },
    { name: '60-80%', count: 0 },
    { name: '80-100%', count: 0 },
  ];
  data.forEach(r => {
    const a = r.accuracy || 0;
    if (a < 20) buckets[0].count++;
    else if (a < 40) buckets[1].count++;
    else if (a < 60) buckets[2].count++;
    else if (a < 80) buckets[3].count++;
    else buckets[4].count++;
  });

  const colors = ['#ff6666', '#ff9944', '#ffaa00', '#00d4ff', '#00ff88'];
  accuracyChart.setOption({
    tooltip: { trigger: 'item', backgroundColor: '#0f2847', borderColor: '#1e3a5f', textStyle: { color: '#e0e6ed' } },
    legend: { bottom: 0, textStyle: { color: '#8899aa', fontSize: 11 }, itemWidth: 10, itemHeight: 10 },
    series: [{
      type: 'pie',
      radius: ['40%', '65%'],
      center: ['50%', '45%'],
      avoidLabelOverlap: true,
      itemStyle: { borderColor: '#0a1e35', borderWidth: 2 },
      label: { color: '#aabbcc', fontSize: 11, formatter: '{b}: {c}' },
      data: buckets.map((b, i) => ({ name: b.name, value: b.count, itemStyle: { color: colors[i] } }))
    }]
  });
}

// 课程统计双轴图
function renderCourseChart(data) {
  const courseMap = {};
  data.forEach(r => {
    const c = r.course || '未知课程';
    if (!courseMap[c]) courseMap[c] = { count: 0, scoreSum: 0 };
    courseMap[c].count++;
    courseMap[c].scoreSum += r.score || 0;
  });
  const courses = Object.keys(courseMap);
  const counts = courses.map(c => courseMap[c].count);
  const avgScores = courses.map(c => (courseMap[c].scoreSum / courseMap[c].count).toFixed(1));

  courseChart.setOption({
    tooltip: { trigger: 'axis', backgroundColor: '#0f2847', borderColor: '#1e3a5f', textStyle: { color: '#e0e6ed' } },
    legend: { data: ['提交数', '平均分'], top: 0, textStyle: { color: '#8899aa', fontSize: 11 } },
    grid: { left: '10%', right: '10%', top: '20%', bottom: '20%' },
    xAxis: {
      type: 'category',
      data: courses.map(c => c.length > 8 ? c.slice(0, 8) + '...' : c),
      axisLine: { lineStyle: { color: '#1e3a5f' } },
      axisLabel: { color: '#8899aa', fontSize: 10, interval: 0, rotate: courses.length > 3 ? 20 : 0 }
    },
    yAxis: [
      {
        type: 'value', name: '提交数', nameTextStyle: { color: '#8899aa', fontSize: 10 },
        axisLine: { lineStyle: { color: '#1e3a5f' } },
        axisLabel: { color: '#8899aa' },
        splitLine: { lineStyle: { color: '#162a45' } }
      },
      {
        type: 'value', name: '平均分', nameTextStyle: { color: '#8899aa', fontSize: 10 },
        axisLine: { lineStyle: { color: '#1e3a5f' } },
        axisLabel: { color: '#8899aa' },
        splitLine: { show: false }
      }
    ],
    series: [
      {
        name: '提交数', type: 'bar', data: counts, barWidth: '30%',
        itemStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: '#00d4ff' }, { offset: 1, color: '#0a1e35' }
          ]),
          borderRadius: [4, 4, 0, 0]
        }
      },
      {
        name: '平均分', type: 'line', yAxisIndex: 1, data: avgScores,
        smooth: true, symbol: 'circle', symbolSize: 8,
        lineStyle: { color: '#00ff88', width: 2 },
        itemStyle: { color: '#00ff88' }
      }
    ]
  });
}

// 渲染表格
function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#556677;padding:30px;">暂无有效数据</td></tr>';
    return;
  }
  // 按完成时间倒序
  const sorted = [...data].sort((a, b) => {
    const ta = a.finishedAt ? new Date(a.finishedAt).getTime() : 0;
    const tb = b.finishedAt ? new Date(b.finishedAt).getTime() : 0;
    return tb - ta;
  });

  tbody.innerHTML = sorted.map((r, i) => {
    const score = r.score || 0;
    const scoreClass = score >= 80 ? 'score-high' : score >= 60 ? 'score-mid' : 'score-low';
    const duration = r.durationSec ? `${r.durationSec}秒` : '-';
    return `<tr>
      <td>${i + 1}</td>
      <td>${r.name || '-'}</td>
      <td>${r.studentId || '-'}</td>
      <td title="${r.course || ''}">${r.course || '-'}</td>
      <td class="${scoreClass}">${r.score !== undefined ? r.score : '-'}</td>
      <td>${r.accuracy !== undefined ? r.accuracy + '%' : '-'}</td>
      <td>${duration}</td>
      <td>${r.detail || '-'}</td>
      <td><span class="status-tag">${r.status || '-'}</span></td>
      <td>${r.finishedAt || '-'}</td>
      <td style="font-family:Consolas,monospace;font-size:12px;">${r._ip || '-'}</td>
    </tr>`;
  }).join('');
}

// 状态管理
function setStatus(type) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const footer = document.getElementById('footer');
  dot.className = 'status-dot ' + (type === 'error' ? 'error' : type === 'refreshing' ? 'refreshing' : '');
  if (type === 'error') {
    text.textContent = '连接异常';
    footer.classList.add('error');
  } else if (type === 'refreshing') {
    text.textContent = '数据刷新中...';
    footer.classList.remove('error');
  } else {
    text.textContent = '实时监控中';
    footer.classList.remove('error');
  }
}

function showError() {
  document.getElementById('errorBanner').style.display = 'block';
}
function hideError() {
  document.getElementById('errorBanner').style.display = 'none';
}

// 倒计时
function startCountdown() {
  timer = setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) {
      countdown = REFRESH_INTERVAL;
      fetchData();
    }
  }, 1000);
}

// 启动
initCharts();
fetchData();
startCountdown();
</script>
</body>
</html>
