<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弯矩叠加法 · 闯关互动课件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "Segoe UI", sans-serif; background: #f2f4f7; color: #1f2933; min-height: 100vh; }

  /* 顶栏 */
  .topbar { background: linear-gradient(90deg, #14213d, #1d4ed8); color: #fff; padding: 18px 32px; }
  .topbar h1 { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  .topbar .sub { font-size: 12px; color: #bcd0f5; margin-top: 5px; letter-spacing: 2px; }

  /* 关卡标签 */
  .tabs { display: flex; gap: 8px; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 32px; flex-wrap: wrap; }
  .tab { padding: 15px 22px; cursor: pointer; font-size: 15px; font-weight: 600; color: #64748b; border-bottom: 3px solid transparent; background: none; border-top: none; border-left: none; border-right: none; transition: all .15s; }
  .tab:hover { color: #1d4ed8; }
  .tab.active { color: #1d4ed8; border-bottom-color: #1d4ed8; }
  .tab .k { display: block; font-size: 11px; font-weight: 400; color: #94a3b8; }

  main { max-width: 1180px; margin: 0 auto; padding: 22px 32px 40px; }

  /* 关卡标题 */
  .lv-head { margin-bottom: 16px; }
  .lv-head h2 { font-size: 19px; color: #14213d; }
  .lv-head .desc { font-size: 13.5px; color: #475569; margin-top: 7px; line-height: 1.9; background: #fff; border-left: 4px solid #1d4ed8; padding: 12px 16px; border-radius: 8px; }

  /* 演示区 */
  .demo { display: flex; gap: 16px; align-items: stretch; }
  .canvas-box { flex: 1; position: relative; background: radial-gradient(circle at 50% 50%, #1b2433 0%, #0a0e16 75%); border-radius: 12px; overflow: hidden; height: 480px; }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .side { width: 300px; display: flex; flex-direction: column; gap: 14px; }

  .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
  .panel h3 { font-size: 13px; color: #1d4ed8; margin-bottom: 11px; padding-left: 8px; border-left: 3px solid #1d4ed8; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: #64748b; margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: "Consolas", monospace; color: #1f2933; }
  .field input:focus { outline: none; border-color: #1d4ed8; }
  .hint-line { font-size: 11px; color: #94a3b8; margin-top: 8px; line-height: 1.6; }

  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 10px 0; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all .15s; }
  .btn-play { background: #1d4ed8; color: #fff; }
  .btn-play:hover { background: #1e40af; }
  .btn-step { background: #e8eefb; color: #1d4ed8; }
  .btn-step:hover { background: #dbe7fa; }
  .btn-reset { background: #f1f5f9; color: #64748b; }
  .btn-reset:hover { background: #e2e8f0; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .steps { display: flex; gap: 7px; justify-content: center; margin-top: 10px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #cbd5e1; transition: all .2s; }
  .dot.on { background: #1d4ed8; box-shadow: 0 0 0 3px #dbeafe; }
  .step-caption { text-align: center; font-size: 12px; color: #64748b; margin-top: 7px; min-height: 16px; }

  .result { font-size: 12.5px; line-height: 1.9; color: #334155; }
  .result b { color: #14213d; }
  .result .formula { background: #f1f5f9; padding: 6px 10px; border-radius: 6px; font-family: "Consolas", monospace; font-size: 12px; color: #0f766e; margin: 6px 0; }
  .result .note { color: #b45309; font-size: 12px; margin-top: 4px; }

  /* 三张卡片 */
  .cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-left: 4px solid #1d4ed8; border-radius: 10px; padding: 15px; }
  .card .t { font-size: 13px; font-weight: 700; color: #1d4ed8; margin-bottom: 7px; }
  .card .c { font-size: 12.5px; color: #475569; line-height: 1.85; }

  /* 习题 */
  .quiz { margin-top: 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; }
  .quiz h3 { font-size: 16px; color: #14213d; margin-bottom: 16px; padding-left: 10px; border-left: 4px solid #1d4ed8; }
  .q-item { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px dashed #e2e8f0; }
  .q-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .q-stem { font-size: 14.5px; font-weight: 600; margin-bottom: 12px; line-height: 1.7; }
  .q-stem .tag { display: inline-block; background: #eef2ff; color: #1d4ed8; font-size: 11px; padding: 2px 9px; border-radius: 10px; margin-right: 8px; font-weight: 700; }
  .opt { display: block; padding: 10px 13px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 7px; cursor: pointer; font-size: 13.5px; transition: all .12s; }
  .opt:hover { border-color: #1d4ed8; background: #f8faff; }
  .opt.sel { border-color: #1d4ed8; background: #eef2ff; }
  .opt.right { border-color: #16a34a; background: #f0fdf4; }
  .opt.wrong { border-color: #dc2626; background: #fef2f2; }
  .check { margin-top: 10px; }
  .check .btn { width: auto; padding: 8px 24px; flex: none; }
  .feedback { margin-top: 11px; font-size: 13px; padding: 11px 13px; border-radius: 8px; display: none; line-height: 1.8; }
  .feedback.ok { background: #f0fdf4; color: #15803d; display: block; }
  .feedback.bad { background: #fef2f2; color: #b91c1c; display: block; }
  .feedback .exp { color: #475569; margin-top: 4px; }
  .hint { color: #dc2626; font-size: 12px; margin-left: 10px; }

  /* 进入下一关 */
  .next-box { margin-top: 20px; text-align: center; }
  .next-btn { display: inline-block; padding: 12px 38px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all .15s; box-shadow: 0 3px 10px rgba(22,163,74,.28); }
  .next-btn:hover { background: #15803d; transform: translateY(-1px); }
  .next-btn-wait { background: #d97706; box-shadow: 0 3px 10px rgba(217,119,6,.28); }
  .next-btn-wait:hover { background: #b45309; }
  .next-hint { font-size: 12.5px; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 16px; line-height: 1.7; }

  footer { text-align: center; font-size: 12px; color: #94a3b8; padding: 16px 0 30px; }

  /* 顶栏用户信息 */
  .userbar { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .user-chip { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); padding: 5px 13px; border-radius: 20px; font-size: 12.5px; color: #e6edf3; }
  .user-chip b { color: #fff; }
  .admin-badge { background: #f59e0b; color: #1f2937; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; margin-left: 4px; }
  .tb-btn { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.32); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; transition: all .15s; }
  .tb-btn:hover { background: rgba(255,255,255,.26); }

  /* 关卡锁定标签 */
  .tab { position: relative; }
  .tab .lock { display: none; margin-left: 7px; font-size: 10px; color: #94a3b8; background: #eef2f7; padding: 1px 8px; border-radius: 9px; vertical-align: middle; }
  .tab.locked { opacity: .45; cursor: not-allowed; }
  .tab.locked:hover { color: #64748b; }
  .tab.locked .lock { display: inline-block; }

  /* 学习状态提示 */
  .learn-status { font-size: 12px; text-align: center; margin-top: 9px; padding: 7px; border-radius: 7px; line-height: 1.6; }
  .learn-status.no { background: #fef2f2; color: #b91c1c; }
  .learn-status.yes { background: #f0fdf4; color: #15803d; }

  /* 登录弹窗 */
  .login-mask { position: fixed; inset: 0; background: rgba(10,14,22,.85); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: #fff; width: 400px; max-width: 94vw; border-radius: 16px; padding: 36px 32px; box-shadow: 0 22px 60px rgba(0,0,0,.55); }
  .login-box h2 { font-size: 20px; color: #14213d; text-align: center; }
  .login-box .sub2 { font-size: 12.5px; color: #64748b; text-align: center; margin: 9px 0 22px; line-height: 1.7; }
  .login-box .field { margin-bottom: 16px; }
  .login-box .field label { display: block; font-size: 13px; color: #334155; margin-bottom: 7px; font-weight: 600; }
  .login-box .field input { width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
  .login-box .field input:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 3px #dbeafe; }
  .login-btn { width: 100%; padding: 12px 0; background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-btn:hover { background: #1e40af; }
  .login-err { color: #dc2626; font-size: 12.5px; text-align: center; min-height: 18px; margin-bottom: 2px; }

  /* 提示 toast */
  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #14213d; color: #fff; padding: 11px 22px; border-radius: 8px; font-size: 13.5px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .3s; box-shadow: 0 8px 30px rgba(0,0,0,.35); max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }

  /* 排行榜弹窗 */
  .rank-mask { position: fixed; inset: 0; background: rgba(10,14,22,.85); z-index: 150; display: none; align-items: flex-start; justify-content: center; overflow: auto; padding: 40px 16px; }
  .rank-mask.show { display: flex; }
  .rank-box { background: #fff; width: 780px; max-width: 96vw; border-radius: 16px; padding: 30px 28px; overflow: auto; }
  .rank-box h2 { font-size: 20px; color: #14213d; text-align: center; }
  .rank-box .rsub { text-align: center; font-size: 12.5px; color: #64748b; margin: 8px 0 20px; }
  .rank-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 560px; }
  .rank-table th, .rank-table td { padding: 10px 10px; text-align: center; border-bottom: 1px solid #eef2f7; }
  .rank-table th { background: #14213d; color: #fff; font-weight: 600; }
  .rank-table tr:nth-child(even) td { background: #f8fafc; }
  .rank-table tr.me td { background: #eef2ff !important; font-weight: 700; }
  .rank-table td.top1 { color: #d97706; font-weight: 800; }
  .rank-table td.op { width: 90px; }
  .del-btn { padding: 5px 13px; border: 1px solid #dc2626; color: #dc2626; background: #fff; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .12s; white-space: nowrap; }
  .del-btn:hover { background: #fef2f2; }
  .del-btn.armed { background: #dc2626; color: #fff; border-color: #dc2626; font-weight: 700; }
  .unfinished-title { margin-top: 26px; font-size: 14px; font-weight: 700; color: #475569; padding-left: 10px; border-left: 4px solid #64748b; }
  .unfinished-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
  .unfinished-table th, .unfinished-table td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #eef2f7; }
  .unfinished-table th { background: #475569; color: #fff; font-weight: 600; }
  .rank-empty { text-align: center; color: #94a3b8; padding: 30px 0; font-size: 13.5px; }
  .wrong-title { margin-top: 26px; font-size: 15px; font-weight: 700; color: #14213d; padding-left: 10px; border-left: 4px solid #dc2626; }
  .wrong-item { margin-top: 12px; padding: 13px 15px; background: #fef2f2; border-radius: 8px; font-size: 13px; line-height: 1.8; }
  .wrong-item .wname { color: #b91c1c; font-weight: 700; }
  .wrong-item .wstem { color: #334155; margin: 5px 0; }
  .wrong-item .wans { color: #64748b; }
  .wrong-item .wans b.c { color: #15803d; }
  .wrong-item .wans b.w { color: #dc2626; }
  .rank-close { display: block; margin: 24px auto 0; padding: 10px 34px; background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .rank-close:hover { background: #1e40af; }

  @media (max-width: 900px) {
    .demo { flex-direction: column; }
    .side { width: 100%; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <h1>弯矩叠加法 · 闯关互动课件</h1>
    <div class="sub">SUPERPOSITION METHOD &nbsp;·&nbsp; 固端弯矩基线 + 典型荷载叠加演示</div>
    <div class="userbar">
      <span class="user-chip" id="user-chip">未登录</span>
      <span class="user-chip" id="progress-chip" style="display:none"></span>
      <button class="tb-btn" id="btn-rank" style="display:none">查看排行榜</button>
      <button class="tb-btn" id="btn-full" style="display:none">投屏</button>
      <button class="tb-btn" id="btn-logout" style="display:none">退出</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-level="1">第一关<span class="k">固端弯矩 + 集中力</span><span class="lock">未解锁</span></button>
    <button class="tab locked" data-level="2">第二关<span class="k">固端弯矩 + 均布荷载</span><span class="lock">未解锁</span></button>
    <button class="tab locked" data-level="3">第三关<span class="k">固端弯矩 + 集中力偶</span><span class="lock">未解锁</span></button>
  </nav>

  <main>
    <section class="lv-head">
      <h2 id="lv-title"></h2>
      <div class="desc" id="lv-desc"></div>
    </section>

    <section class="demo">
      <div class="canvas-box"><canvas id="scene"></canvas></div>
      <div class="side">
        <div class="panel">
          <h3>自定义荷载参数</h3>
          <div id="params-box"></div>
          <div class="hint-line">修改参数后，点击「播放动画」或「单步」查看对应弯矩图。</div>
        </div>
        <div class="panel">
          <h3>叠加演示</h3>
          <div class="btns">
            <button class="btn btn-play" id="btn-play">▶ 播放动画</button>
            <button class="btn btn-step" id="btn-step">单步</button>
            <button class="btn btn-reset" id="btn-reset">重置</button>
          </div>
          <div class="steps" id="step-dots">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
          <div class="step-caption" id="step-caption"></div>
          <div class="learn-status no" id="learn-status">本关学习：未完成（播放完整动画后即视为完成）</div>
        </div>
        <div class="panel">
          <h3>计算结果</h3>
          <div class="result" id="result-box"></div>
        </div>
      </div>
    </section>

    <section class="cards" id="cards-box"></section>

    <section class="quiz">
      <h3>本关闯关习题（2 题）</h3>
      <div id="quiz-box"></div>
      <div id="next-level-box"></div>
    </section>
  </main>

  <footer>弯矩叠加法 · 闯关互动课件 &nbsp;|&nbsp; 逐级解锁 · 完成学习与习题后进入下一关</footer>

  <!-- 身份登录弹窗 -->
  <div class="login-mask" id="login-mask">
    <div class="login-box">
      <h2>弯矩叠加法 · 闯关课件</h2>
      <div class="sub2">请填写身份信息后开始学习，答题记录与分数将绑定到你的学号</div>
      <div class="login-err" id="login-err"></div>
      <div class="field"><label>姓名</label><input id="inp-name" type="text" placeholder="请输入姓名" autocomplete="off" value=""></div>
      <div class="field"><label>学号</label><input id="inp-id" type="text" placeholder="请输入学号" autocomplete="off" value=""></div>
      <button class="login-btn" id="login-btn">进入课件</button>
    </div>
  </div>

  <!-- 班级排行榜弹窗 -->
  <div class="rank-mask" id="rank-mask">
    <div class="rank-box">
      <h2>班级得分排行榜</h2>
      <div class="rsub" id="rank-sub">加载中…</div>
      <div id="rank-body"></div>
      <button class="rank-close" id="rank-close">关闭</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// localStorage 同步到父窗口（解决 blob URL iframe 与父页面 localStorage 分区不同的问题）
(function(){try{if(window.parent&&window.parent!==window){var p=window.parent.localStorage;var s=localStorage.setItem.bind(localStorage);var r=localStorage.removeItem.bind(localStorage);localStorage.setItem=function(k,v){s(k,v);try{p.setItem(k,v)}catch(e){}};localStorage.removeItem=function(k){r(k);try{p.removeItem(k)}catch(e){}}}}catch(e){}})();
// ============================================================
//  弯矩叠加法 · 闯关课件核心逻辑
//  复用自「弯矩叠加法.html」的 Canvas 绘图引擎
// ============================================================

// ---------- 全局参数 ----------
const L = 6;                       // 梁长 (m)
let currentLevel = 1;              // 当前关卡
let step = 0;                      // 0=未开始, 1..4
let curveProgress = 0;             // 弯矩图逐点绘制进度 0..1
let playing = false;

// 各关卡荷载参数
const params = {
  1: { P: 20, a: 3 },              // 集中力 P(kN) @ a(m)
  2: { q: 5 },                     // 均布 q(kN/m) 满跨
  3: { M0: 20, a: 3 },             // 集中力偶 M0(kN·m) @ a(m)
};

// 梁端初始固端弯矩（各关共用）：A 端 = 20，B 端 = 10 (kN·m)，正 = 下侧受拉
const endMoments = { MA: 20, MB: 10 };

// 关卡元信息
const LEVEL_META = {
  1: {
    title: '第一关 · 固端弯矩基线 + 集中力',
    canvasTitle: '叠加原理 · 固端弯矩基线 + 集中力',
    formula: 'M(x) = M₁(x) + M₂(x) = 固端弯矩斜直线 + M_P(x)',
    desc: '梁两端存在初始固端弯矩 M_A、M_B（A 端 20、B 端 10），构成一条斜直线基线 M₁。在此基础上叠加集中力 P 的简支梁弯矩 M₂，得到最终弯矩图：端弯矩斜直线 + 分段线性折线（折点在集中力作用处）。',
    cards: {
      key: '叠加法：M = M₁(固端弯矩斜直线) + M₂(集中力)',
      cond: '集中力作用处剪力突变、弯矩图为折线转折（尖角）',
      result: '最终弯矩 = 端弯矩斜直线 + 分段线性折线，端点弯矩即 M_A、M_B',
    },
    stepNames: ['画梁与支座', '施加集中力', '分量弯矩图', '叠加合成'],
  },
  2: {
    title: '第二关 · 固端弯矩基线 + 均布荷载',
    canvasTitle: '叠加原理 · 固端弯矩基线 + 均布荷载',
    formula: 'M(x) = M₁(x) + M₂(x) = 固端弯矩斜直线 + M_q(x)',
    desc: '从固端弯矩斜直线基线 M₁ 出发，叠加满跨均布荷载 q 的简支梁弯矩 M₂（二次抛物线），得到最终弯矩图：端弯矩斜直线 + 二次抛物线。',
    cards: {
      key: '叠加法：M = M₁(固端弯矩斜直线) + M₂(均布荷载)',
      cond: '均布荷载作用段：剪力为斜直线，弯矩为二次抛物线',
      result: '最终弯矩 = 端弯矩斜直线 + 二次抛物线，端点弯矩即 M_A、M_B',
    },
    stepNames: ['画梁与支座', '施加均布荷载', '分量弯矩图', '叠加合成'],
  },
  3: {
    title: '第三关 · 固端弯矩基线 + 集中力偶',

    formula: 'M(x) = M₁(x) + M₂(x) = 固端弯矩斜直线 + M_M₀(x)',
    desc: '从固端弯矩斜直线基线 M₁ 出发，叠加集中力偶 M₀ 的简支梁弯矩 M₂（左右异号直线 + 突变），得到最终弯矩图：端弯矩斜直线 + 直线突变。',
    cards: {
      key: '叠加法：M = M₁(固端弯矩斜直线) + M₂(集中力偶)',
      cond: '集中力偶作用处弯矩图突变，突变量等于力偶矩 M₀',
      result: '最终弯矩 = 端弯矩斜直线 + 两段直线（左右异号 + 突变）',
    },
    stepNames: ['画梁与支座', '施加集中力偶', '分量弯矩图', '叠加合成'],
  },
};

// ---------- 弯矩函数 ----------
// 集中力 P @ a
function M_point(x, P, a) {
  const RA = P * (L - a) / L;
  return x <= a ? RA * x : RA * x - P * (x - a);
}
// 均布 q 满跨
function M_udl(x, q) {
  return q * x * (L - x) / 2;
}
// 集中力偶 M0 @ a（顺时针为正）
function M_couple(x, M0, a) {
  return x < a ? -M0 * x / L : -M0 * x / L + M0;
}
// 固端弯矩基线 M₁：A、B 端弯矩连成的斜直线（正 = 下侧受拉）
function M1(x) {
  return endMoments.MA + (endMoments.MB - endMoments.MA) * x / L;
}
// 当前关卡的荷载弯矩分量 M₂（简支梁荷载单独作用，两端为 0）
function loadFn(x) {
  const p = params[currentLevel];
  if (currentLevel === 1) return M_point(x, p.P, p.a);
  if (currentLevel === 2) return M_udl(x, p.q);
  if (currentLevel === 3) return M_couple(x, p.M0, p.a);
  return 0;
}
function totalFn(x) { return M1(x) + loadFn(x); }   // M = M₁(固端弯矩斜直线) + M₂(荷载)

// ---------- Canvas ----------
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H, beamY, beamX0, SCALE, mScale;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.floor(rect.width));
  H = Math.max(1, Math.floor(rect.height));
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  SCALE = Math.min(80, Math.max(40, (W - 160) / L));
  beamY = H * 0.52;
  beamX0 = (W - L * SCALE) / 2;
  mScale = computeScale();
  render();
}
window.addEventListener('resize', resize);

function toSx(xm) { return beamX0 + xm * SCALE; }

function maxAbsMoment() {
  let m = 0;
  for (let i = 0; i <= 200; i++) {
    const x = i / 200 * L;
    const v = Math.abs(totalFn(x));
    if (v > m) m = v;
  }
  return m;
}
function computeScale() {
  if (!(W > 0) || !(H > 0)) return 4;
  const maxM = maxAbsMoment();
  if (maxM < 1e-6) return 4;
  const avail = Math.max(40, beamY - 130);
  return Math.max(2, Math.min(60, avail / maxM));
}

// ---------- 绘图工具（复用自弯矩叠加法.html） ----------
function drawGrid() {
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#1c2230';
  ctx.beginPath();
  for (let x = beamX0 % 40; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
}

function drawBeam() {
  const sx0 = toSx(0), sx1 = toSx(L);
  const beamH = 16;
  ctx.fillStyle = '#30363d';
  ctx.fillRect(sx0, beamY - beamH/2, sx1 - sx0, beamH);
  ctx.strokeStyle = '#58a6ff';
  ctx.lineWidth = 2;
  ctx.strokeRect(sx0, beamY - beamH/2, sx1 - sx0, beamH);
  ctx.beginPath();
  ctx.strokeStyle = '#58a6ff55';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  ctx.moveTo(sx0, beamY); ctx.lineTo(sx1, beamY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#8b949e';
  ctx.font = '11px "Consolas", monospace';
  ctx.textAlign = 'center';
  ctx.strokeStyle = '#484f58';
  ctx.lineWidth = 1;
  for (let i = 0; i <= L; i++) {
    const sx = toSx(i);
    ctx.beginPath();
    ctx.moveTo(sx, beamY + beamH/2);
    ctx.lineTo(sx, beamY + beamH/2 + (i % 2 === 0 ? 8 : 4));
    ctx.stroke();
    if (i % 2 === 0) ctx.fillText(i + 'm', sx, beamY + beamH/2 + 22);
  }
}

function drawSupports() {
  const drawTri = (sx, label) => {
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.moveTo(sx, beamY + 8);
    ctx.lineTo(sx - 14, beamY + 30);
    ctx.lineTo(sx + 14, beamY + 30);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sx, beamY + 8, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#0d1117'; ctx.fill();
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#58a6ff';
    ctx.font = 'bold 12px "Segoe UI"';
    ctx.textAlign = 'center';
    ctx.fillText(label, sx, beamY + 48);
  };
  drawTri(toSx(0), 'A');
  drawTri(toSx(L), 'B');
  ctx.strokeStyle = '#58a6ff44';
  ctx.lineWidth = 1;
  const gy = beamY + 34;
  ctx.beginPath();
  ctx.moveTo(toSx(0) - 30, gy); ctx.lineTo(toSx(L) + 30, gy);
  ctx.stroke();
  ctx.strokeStyle = '#58a6ff33';
  for (let x = toSx(0) - 25; x <= toSx(L) + 25; x += 8) {
    ctx.beginPath();
    ctx.moveTo(x, gy); ctx.lineTo(x - 6, gy + 8);
    ctx.stroke();
  }
}

// 端弯矩箭头（弯曲箭头，正弯矩顺时针）
function drawEndMomentArrow(sx, Mval, label) {
  const r = 18, cy = beamY - 26;
  const isClockwise = Mval >= 0;
  ctx.strokeStyle = '#f0883e'; ctx.fillStyle = '#f0883e'; ctx.lineWidth = 2.5;
  let startAng, endAng, anticlockwise;
  if (isClockwise) { startAng = -Math.PI / 2; endAng = Math.PI / 2; anticlockwise = false; }
  else { startAng = Math.PI / 2; endAng = -Math.PI / 2; anticlockwise = true; }
  ctx.beginPath(); ctx.arc(sx, cy, r, startAng, endAng, anticlockwise); ctx.stroke();
  const tipX = sx + r * Math.cos(endAng);
  const tipY = cy + r * Math.sin(endAng);
  const tangentAng = anticlockwise ? endAng - Math.PI / 2 : endAng + Math.PI / 2;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - 7 * Math.cos(tangentAng - 0.4), tipY - 7 * Math.sin(tangentAng - 0.4));
  ctx.lineTo(tipX - 7 * Math.cos(tangentAng + 0.4), tipY - 7 * Math.sin(tangentAng + 0.4));
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 12px "Consolas", monospace'; ctx.textAlign = 'center';
  ctx.fillText(label, sx, cy - r - 10);
}

// 固端弯矩基线 M₁：A、B 端弯矩连成的斜直线 + 端弯矩箭头
function drawFixedEndBaseline() {
  const sx0 = toSx(0), sx1 = toSx(L);
  const mA = endMoments.MA, mB = endMoments.MB;
  const syA = beamY + mA * mScale;
  const syB = beamY + mB * mScale;
  // 斜直线基线
  ctx.strokeStyle = '#f0883e';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(sx0 - 24, syA); ctx.lineTo(sx1 + 24, syB); ctx.stroke();
  ctx.setLineDash([]);
  // 端点实心点
  ctx.fillStyle = '#f0883e';
  ctx.beginPath(); ctx.arc(sx0, syA, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx1, syB, 4, 0, Math.PI * 2); ctx.fill();
  // 端弯矩箭头
  drawEndMomentArrow(sx0, mA, 'M_A = ' + mA);
  drawEndMomentArrow(sx1, mB, 'M_B = ' + mB);
  // 基线图例
  ctx.fillStyle = '#f0883e';
  ctx.font = 'bold 12px "Segoe UI"';
  ctx.textAlign = 'left';
  ctx.fillText('固端弯矩基线  M₁（斜直线）', 18, 68);
}

// 集中力
function drawPointLoad(P, a) {
  const sx = toSx(a);
  const sy0 = beamY - 72, sy1 = beamY - 10;
  ctx.strokeStyle = '#ffd700'; ctx.fillStyle = '#ffd700'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(sx, sy0); ctx.lineTo(sx, sy1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(sx, sy1 + 5); ctx.lineTo(sx - 7, sy1 - 5); ctx.lineTo(sx + 7, sy1 - 5); ctx.closePath(); ctx.fill();
  ctx.font = 'bold 13px "Consolas", monospace'; ctx.textAlign = 'center';
  ctx.fillText('P = ' + P + ' kN', sx, sy0 - 8);
  ctx.fillStyle = '#8b949e'; ctx.font = '11px "Consolas", monospace';
  ctx.fillText('a = ' + a + ' m', sx, beamY + 40);
}

// 均布荷载（满跨）
function drawUDL(q) {
  const sx0 = toSx(0), sx1 = toSx(L);
  const n = 20, arrowLen = 18;
  ctx.strokeStyle = '#ffd700'; ctx.fillStyle = '#ffd700'; ctx.lineWidth = 1.5;
  for (let i = 0; i <= n; i++) {
    const t = i / n, sx = sx0 + t * (sx1 - sx0), sy = beamY - 22;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + arrowLen); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx, sy + arrowLen + 4); ctx.lineTo(sx - 4, sy + arrowLen - 3); ctx.lineTo(sx + 4, sy + arrowLen - 3); ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.moveTo(sx0 - 10, beamY - 22); ctx.lineTo(sx1 + 10, beamY - 22);
  ctx.strokeStyle = '#ffd70088'; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#ffd700'; ctx.font = 'bold 13px "Segoe UI"'; ctx.textAlign = 'center';
  ctx.fillText('q = ' + q + ' kN/m', (sx0 + sx1) / 2, beamY - 30);
}

// 集中力偶（弯曲箭头）
function drawCoupleAt(M0, a) {
  const sx = toSx(a);
  const r = 18, cy = beamY - 28;
  const isClockwise = M0 >= 0;
  ctx.strokeStyle = '#f85149'; ctx.fillStyle = '#f85149'; ctx.lineWidth = 2.5;
  let startAng, endAng, anticlockwise;
  if (isClockwise) { startAng = -Math.PI / 2; endAng = Math.PI / 2; anticlockwise = false; }
  else { startAng = Math.PI / 2; endAng = -Math.PI / 2; anticlockwise = true; }
  ctx.beginPath(); ctx.arc(sx, cy, r, startAng, endAng, anticlockwise); ctx.stroke();
  const tipX = sx + r * Math.cos(endAng);
  const tipY = cy + r * Math.sin(endAng);
  const tangentAng = anticlockwise ? endAng - Math.PI / 2 : endAng + Math.PI / 2;
  ctx.beginPath(); ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - 8 * Math.cos(tangentAng - 0.4), tipY - 8 * Math.sin(tangentAng - 0.4));
  ctx.lineTo(tipX - 8 * Math.cos(tangentAng + 0.4), tipY - 8 * Math.sin(tangentAng + 0.4));
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold 12px "Consolas", monospace'; ctx.textAlign = 'center';
  ctx.fillText('M₀ = ' + M0 + ' kN·m', sx, cy - r - 8);
  ctx.fillStyle = '#8b949e'; ctx.font = '11px "Consolas", monospace';
  ctx.fillText('a = ' + a + ' m', sx, beamY + 40);
}

function drawLoad() {
  const p = params[currentLevel];
  if (currentLevel === 1) drawPointLoad(p.P, p.a);
  else if (currentLevel === 2) drawUDL(p.q);
  else drawCoupleAt(p.M0, p.a);
}

function roundRect(c, x, y, w, h, r) {
  if (typeof c.roundRect === 'function') { c.beginPath(); c.roundRect(x, y, w, h, r); return; }
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

// 弯矩图（支持逐点进度绘制）
function drawMomentDiagram(opts) {
  opts = opts || {};
  const fn = opts.fn || loadFn;
  const color = opts.color || '#3fb950';
  const dashed = opts.dashed || false;
  const fill = opts.fill !== false && !dashed;
  const lineW = opts.lineW || 3;
  const progress = (opts.progress === undefined) ? 1 : opts.progress;
  const label = opts.label;
  const showValues = opts.showValues !== false;
  const showExtremum = opts.showExtremum !== false;
  const done = progress >= 0.999;
  const N = 200;
  const Ndraw = Math.max(1, Math.round(N * progress));
  const pts = [];
  for (let i = 0; i <= Ndraw; i++) {
    const x = (i / N) * L;
    const m = fn(x);
    pts.push({ sx: toSx(x), sy: beamY + m * mScale, m });
  }

  if (fill && done) {
    ctx.beginPath();
    ctx.moveTo(pts[0].sx, beamY);
    pts.forEach(p => ctx.lineTo(p.sx, p.sy));
    ctx.lineTo(pts[pts.length - 1].sx, beamY);
    ctx.closePath();
    ctx.fillStyle = color + '33';
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = color + '44';
    ctx.lineWidth = 0.8;
    for (let sx = beamX0 - 50; sx < W + 50; sx += 8) {
      ctx.beginPath();
      ctx.moveTo(sx, beamY - 200);
      ctx.lineTo(sx + 400, beamY + 400);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.beginPath();
  pts.forEach((p, i) => { if (i === 0) ctx.moveTo(p.sx, p.sy); else ctx.lineTo(p.sx, p.sy); });
  ctx.strokeStyle = color;
  ctx.lineWidth = lineW;
  if (dashed) ctx.setLineDash([8, 5]);
  if (!dashed) { ctx.shadowColor = color; ctx.shadowBlur = 6; }
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  if (showValues && done) {
    ctx.font = 'bold 12px "Consolas", monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    const pA = pts[0], pB = pts[pts.length - 1];
    ctx.fillText(pA.m.toFixed(1), pA.sx, pA.sy + (pA.m >= 0 ? 16 : -10));
    ctx.fillText(pB.m.toFixed(1), pB.sx, pB.sy + (pB.m >= 0 ? 16 : -10));
  }

  if (showExtremum && done) {
    let maxIdx = 0, maxAbs = 0;
    pts.forEach((p, i) => { if (Math.abs(p.m) > maxAbs) { maxAbs = Math.abs(p.m); maxIdx = i; } });
    const mp = pts[maxIdx];
    const labelY = mp.sy + (mp.m >= 0 ? 28 : -20);
    ctx.font = 'bold 14px "Consolas", monospace';
    const labelTxt = 'M = ' + mp.m.toFixed(1) + ' kN·m';
    const tw = ctx.measureText(labelTxt).width;
    ctx.fillStyle = 'rgba(13,17,23,0.95)';
    roundRect(ctx, mp.sx - tw / 2 - 10, labelY - 14, tw + 20, 24, 4);
    ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    roundRect(ctx, mp.sx - tw / 2 - 10, labelY - 14, tw + 20, 24, 4);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.fillText(labelTxt, mp.sx, labelY + 4);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(mp.sx, mp.sy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0d1117';
    ctx.beginPath(); ctx.arc(mp.sx, mp.sy, 2.5, 0, Math.PI * 2); ctx.fill();
  }

  if (label && done) {
    ctx.fillStyle = color;
    ctx.font = 'bold 13px "Segoe UI"';
    ctx.textAlign = 'left';
    ctx.fillText(label, toSx(0) + 20, beamY + 84);
  }
}

// 集中力偶的突变标注
function drawJumpLabel(M0, a) {
  const sx = toSx(a);
  const base = M1(a);                       // 固端弯矩基线在 a 处的值
  const mL = base + (-M0 * a / L);
  const mR = base + (M0 * (L - a) / L);
  const syL = beamY + mL * mScale;
  const syR = beamY + mR * mScale;
  ctx.fillStyle = '#3fb950';
  ctx.beginPath(); ctx.arc(sx, syL, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx, syR, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(sx, syL); ctx.lineTo(sx, syR); ctx.stroke();
  ctx.setLineDash([]);
  const midY = (syL + syR) / 2;
  ctx.font = 'bold 13px "Consolas", monospace';
  const txt = 'ΔM = M₀ = ' + M0 + ' kN·m';
  const tw = ctx.measureText(txt).width;
  let lx = sx + 12;
  if (lx + tw + 24 > W - 8) lx = sx - tw - 36;
  if (lx < 8) lx = 8;
  ctx.fillStyle = 'rgba(13,17,23,0.95)';
  roundRect(ctx, lx, midY - 12, tw + 16, 24, 4); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1.5;
  roundRect(ctx, lx, midY - 12, tw + 16, 24, 4); ctx.stroke();
  ctx.fillStyle = '#ffd700'; ctx.textAlign = 'left';
  ctx.fillText(txt, lx + 8, midY + 4);
}

function drawTitle() {
  const meta = LEVEL_META[currentLevel];
  ctx.fillStyle = '#e6edf3';
  ctx.font = 'bold 15px "Segoe UI"';
  ctx.textAlign = 'center';
  ctx.fillText(meta.canvasTitle, W / 2, 26);
  ctx.fillStyle = '#8b949e';
  ctx.font = '12px "Consolas", monospace';
  ctx.fillText(meta.formula, W / 2, 46);
}

// ---------- 主渲染 ----------
function render() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  if (step >= 1) {
    drawSupports();
    drawBeam();
    drawFixedEndBaseline();
  }
  if (step >= 2) drawLoad();
  if (step >= 3) {
    drawMomentDiagram({
      fn: loadFn, color: '#f85149', dashed: true, fill: false, lineW: 2.5,
      progress: (step === 3) ? curveProgress : 1,
      showValues: false, showExtremum: false,
      label: (step === 3) ? 'M₂：荷载单独作用的弯矩（虚线）' : null,
    });
  }
  if (step >= 4) {
    drawMomentDiagram({
      fn: totalFn, color: '#3fb950', dashed: false, fill: true, lineW: 3,
      progress: curveProgress,
      showValues: true, showExtremum: (currentLevel !== 3),
      label: 'M = M₁ + M₂：叠加合成弯矩图（实线）',
    });
    if (currentLevel === 3) drawJumpLabel(params[3].M0, params[3].a);
  }
  drawTitle();
}

// ---------- 动画控制 ----------
const STEP_CAPTIONS = ['', '第 1 步 · 画梁与支座（固端弯矩基线 M₁）', '第 2 步 · 施加荷载', '第 3 步 · 荷载分量弯矩图 M₂', '第 4 步 · 叠加合成 M = M₁ + M₂'];

function updateUI() {
  const dots = document.querySelectorAll('#step-dots .dot');
  dots.forEach((d, i) => d.classList.toggle('on', i < step));
  document.getElementById('step-caption').textContent = STEP_CAPTIONS[step] || '';
  document.getElementById('btn-play').disabled = playing;
}

function stopPlay() { playing = false; }

function goStep(s) {
  stopPlay();
  step = Math.max(0, Math.min(4, s));
  curveProgress = (step >= 1) ? 1 : 0;
  render();
  updateUI();
  if (step === 4) markLearnDone(currentLevel);
}

function resetDemo() {
  goStep(0);
}

function play() {
  if (playing) return;
  if (!identity) return;
  playing = true;
  step = 0; curveProgress = 0;
  render(); updateUI();
  let t0 = performance.now();
  function frame(now) {
    if (!playing) return;
    const dt = now - t0;
    if (step === 0) { step = 1; render(); updateUI(); t0 = now; }
    else if (step === 1 && dt >= 700) { step = 2; render(); updateUI(); t0 = now; }
    else if (step === 2 && dt >= 700) { step = 3; curveProgress = 0; render(); updateUI(); t0 = now; }
    else if (step === 3) {
      curveProgress = Math.min(1, dt / 1400);
      render();
      if (curveProgress >= 1) { step = 4; curveProgress = 0; render(); updateUI(); t0 = now; }
    }
    else if (step === 4) {
      curveProgress = Math.min(1, dt / 1400);
      render();
      if (curveProgress >= 1) { playing = false; curveProgress = 1; render(); updateUI(); markLearnDone(currentLevel); return; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ---------- 参数面板 ----------
function fieldHTML(key, label, value) {
  return '<div class="field"><label>' + label + '</label><input type="number" data-key="' + key + '" value="' + value + '" step="1"></div>';
}
function syncParamInputs() {
  const box = document.getElementById('params-box');
  const p = params[currentLevel];
  let html = '';
  html += '<div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">固端弯矩（梁端初始弯矩 · 各关共用）</div>';
  html += fieldHTML('MA', 'A 端弯矩 M_A (kN·m)', endMoments.MA);
  html += fieldHTML('MB', 'B 端弯矩 M_B (kN·m)', endMoments.MB);
  html += '<div style="font-size:11px;color:#94a3b8;margin:12px 0 8px;">本关荷载参数</div>';
  if (currentLevel === 1) {
    html += fieldHTML('P', '集中力 P (kN)', p.P) + fieldHTML('a', '作用位置 a (m)', p.a);
  } else if (currentLevel === 2) {
    html += fieldHTML('q', '均布荷载 q (kN/m)', p.q);
  } else {
    html += fieldHTML('M0', '集中力偶 M₀ (kN·m)', p.M0) + fieldHTML('a', '作用位置 a (m)', p.a);
  }
  box.innerHTML = html;
  box.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      if (!identity) return;
      const v = parseFloat(inp.value) || 0;
      const key = inp.dataset.key;
      if (key === 'MA' || key === 'MB') { endMoments[key] = v; }
      else if (key === 'a') params[currentLevel].a = Math.min(L - 0.2, Math.max(0.2, v));
      else params[currentLevel][key] = v;
      mScale = computeScale();
      updateResultUI();
      render();
    });
  });
}

// ---------- 结果面板 ----------
function updateResultUI() {
  const box = document.getElementById('result-box');
  const p = params[currentLevel];
  const MA = endMoments.MA, MB = endMoments.MB;
  let html = '<b>固端弯矩</b>：M<sub>A</sub> = ' + MA + ' kN·m，M<sub>B</sub> = ' + MB + ' kN·m'
    + '<div class="formula">M₁(x) = M<sub>A</sub> + (M<sub>B</sub>−M<sub>A</sub>)·x/L</div>';
  if (currentLevel === 1) {
    const RA = p.P * (L - p.a) / L, RB = p.P * p.a / L;
    const Mmax = p.P * p.a * (L - p.a) / L;
    html += '<b>荷载分量支座反力</b>：R<sub>A</sub> = ' + RA.toFixed(1) + ' kN，R<sub>B</sub> = ' + RB.toFixed(1) + ' kN'
      + '<div class="formula">M₂(x) = P·(L−a)·x/L &nbsp;（x ≤ a）</div>'
      + '<div class="formula">M₂(x) = P·a·(L−x)/L &nbsp;（x ≥ a）</div>'
      + '<b>荷载分量峰值</b>：M₂<sub>max</sub> = P·a·(L−a)/L = ' + Mmax.toFixed(1) + ' kN·m（x = ' + p.a + ' m）'
      + '<p class="note">最终 M = M₁ + M₂ = 固端弯矩斜直线 + 分段线性折线</p>';
  } else if (currentLevel === 2) {
    const RA = p.q * L / 2, Mmax = p.q * L * L / 8;
    html += '<b>荷载分量支座反力</b>：R<sub>A</sub> = R<sub>B</sub> = qL/2 = ' + RA.toFixed(1) + ' kN'
      + '<div class="formula">M₂(x) = q·x·(L−x)/2</div>'
      + '<b>荷载分量跨中峰值</b>：M₂<sub>max</sub> = qL²/8 = ' + Mmax.toFixed(1) + ' kN·m'
      + '<p class="note">最终 M = M₁ + M₂ = 固端弯矩斜直线 + 二次抛物线</p>';
  } else {
    const M0 = p.M0, a = p.a;
    html += '<b>荷载分量支座反力</b>：R<sub>A</sub> = −M₀/L = ' + (-M0 / L).toFixed(2) + ' kN，R<sub>B</sub> = M₀/L = ' + (M0 / L).toFixed(2) + ' kN'
      + '<div class="formula">M₂(x) = −M₀·x/L &nbsp;（x ＜ a）</div>'
      + '<div class="formula">M₂(x) = M₀·(L−x)/L &nbsp;（x ＞ a）</div>'
      + '<b>弯矩突变</b>：ΔM = M₀ = ' + M0.toFixed(1) + ' kN·m（x = ' + a + ' m）'
      + '<p class="note">最终 M = M₁ + M₂ = 固端弯矩斜直线 + 直线突变</p>';
  }
  box.innerHTML = html;
}

// ============================================================
//  身份登录 + 学情记录（绑定学号）+ 闯关解锁 + 排行榜
// ============================================================
const LS_ID = 'sm_sp_identity_v1';      // 当前登录身份 { name, id }
const LS_RANK = 'sm_sp_rank_v1';        // 学情排行榜 { [id]: record }
const POINTS_PER_Q = 10;                // 每题分值
const TOTAL_LEVELS = 3;

let identity = null;    // { name, id }
let rankMap = {};       // { [id]: record }
let record = null;      // 当前学生的记录（rankMap[identity.id] 的引用）

// 管理员账号：姓名 + 学号 都为 "1" 才算管理员
const ADMIN = { id: '1', name: '1' };
function isAdmin() { return !!identity && String(identity.id) === ADMIN.id && String(identity.name) === ADMIN.name; }

function loadIdentity() { try { identity = JSON.parse(localStorage.getItem(LS_ID)) || null; } catch (e) { identity = null; } }
function saveIdentity() { try { localStorage.setItem(LS_ID, JSON.stringify(identity)); } catch (e) {} }
function loadRank() {
  try { rankMap = JSON.parse(localStorage.getItem(LS_RANK)) || {}; } catch (e) { rankMap = {}; }
}
function saveRank() {
  try { localStorage.setItem(LS_RANK, JSON.stringify(rankMap)); } catch (e) {}
}

function newRecord(name, id) {
  return { name, id, startAt: Date.now(), endAt: null, learnDone: {}, answers: {} };
}
function allQuestions() {
  const arr = [];
  for (let lv = 1; lv <= TOTAL_LEVELS; lv++) {
    QUESTIONS[lv].forEach((q, qi) => arr.push({ level: lv, qi, gid: 'lv' + lv + 'q' + qi, q }));
  }
  return arr;
}

// ---------- 学习 / 答题完成判定 ----------
function levelLearnDone(lv) { return !!(record && record.learnDone[lv]); }
function levelQuizDone(lv) {
  if (!record) return false;
  return QUESTIONS[lv].every((q, qi) => record.answers['lv' + lv + 'q' + qi] !== undefined);
}
function levelComplete(lv) { return levelLearnDone(lv) && levelQuizDone(lv); }
function isUnlocked(lv) {
  if (!identity) return false;
  if (isAdmin()) return true;
  return lv === 1 || levelComplete(lv - 1);
}
function firstIncompleteLevel() {
  for (let lv = 1; lv <= TOTAL_LEVELS; lv++) if (!levelComplete(lv)) return lv;
  return TOTAL_LEVELS;
}

function markLearnDone(lv) {
  if (!record) return;
  if (!record.learnDone[lv]) {
    record.learnDone[lv] = true;
    saveRank();
    renderNav();
    updateLearnStatus();
    checkFinish();
  }
}

function computeStats(rec) {
  const all = allQuestions();
  let correct = 0, answered = 0;
  const wrongList = [];
  all.forEach(item => {
    const pick = rec.answers[item.gid];
    if (pick === undefined) return;
    answered++;
    if (pick === item.q.answer) correct++;
    else wrongList.push({ level: item.level, qi: item.qi, type: item.q.type, stem: item.q.stem, options: item.q.options, pick, answer: item.q.answer });
  });
  const total = all.length;
  return { correct, answered, total, score: correct * POINTS_PER_Q, correctRate: total ? Math.round(correct / total * 100) : 0, wrongList };
}

function checkFinish() {
  if (!record) return;
  const done = [1, 2, 3].every(lv => levelComplete(lv));
  if (done && !record.endAt) {
    record.endAt = Date.now();
    saveRank();
    showLeaderboard();
  }
}

// ---------- 导航 / 状态 ----------
function renderNav() {
  document.querySelectorAll('.tab').forEach(tab => {
    const lv = parseInt(tab.dataset.level);
    tab.classList.toggle('locked', !isUnlocked(lv));
  });
  updateProgress();
}
function updateLearnStatus() {
  const el = document.getElementById('learn-status');
  if (!el) return;
  if (levelLearnDone(currentLevel)) {
    el.className = 'learn-status yes';
    el.textContent = '本关学习：已完成 ✔（可进入习题，完成后解锁下一关）';
  } else {
    el.className = 'learn-status no';
    el.textContent = '本关学习：未完成（播放完整动画后即视为完成）';
  }
  updateNextLevelButton();
}
function updateNextLevelButton() {
  const box = document.getElementById('next-level-box');
  if (!box) return;
  if (!identity || !record) { box.innerHTML = ''; return; }
  const learnOk = levelLearnDone(currentLevel);
  const quizOk = levelQuizDone(currentLevel);
  if (!quizOk) { box.innerHTML = ''; return; }
  if (learnOk) {
    if (currentLevel < TOTAL_LEVELS) {
      box.innerHTML = '<button class="next-btn" id="btn-next">本关完成，进入第' + (currentLevel + 1) + '关 →</button>';
      document.getElementById('btn-next').addEventListener('click', () => setLevel(currentLevel + 1));
    } else {
      box.innerHTML = '<button class="next-btn" id="btn-next">全部完成，查看排行榜 →</button>';
      document.getElementById('btn-next').addEventListener('click', showLeaderboard);
    }
  } else {
    box.innerHTML = '<button class="next-btn next-btn-wait" id="btn-next">本关习题已完成，点击补完「动画学习」→</button>';
    document.getElementById('btn-next').addEventListener('click', () => {
      toast('请先点击上方「播放动画」完整播放到第 4 步');
      document.querySelector('.demo').scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }
}
function updateProgress() {
  const el = document.getElementById('progress-chip');
  if (!el) return;
  if (!identity || !record) { el.style.display = 'none'; return; }
  el.style.display = '';
  const st = computeStats(record);
  const unlockedCount = [1, 2, 3].filter(lv => isUnlocked(lv)).length;
  el.textContent = '进度 ' + st.answered + '/' + st.total + ' 题 · 得分 ' + st.score + '/' + (POINTS_PER_Q * st.total) + ' · 解锁 ' + unlockedCount + '/3 关';
}

// ---------- 登录 ----------
function showLogin() { document.getElementById('login-mask').style.display = 'flex'; }
function hideLogin() { document.getElementById('login-mask').style.display = 'none'; }
function renderStudentBar() {
  const chip = document.getElementById('user-chip');
  const btnRank = document.getElementById('btn-rank');
  const btnFull = document.getElementById('btn-full');
  const btnLogout = document.getElementById('btn-logout');
  if (identity) {
    chip.innerHTML = '姓名 <b>' + esc(identity.name) + '</b> · 学号 <b>' + esc(identity.id) + '</b>' +
      (isAdmin() ? ' <span class="admin-badge">管理员</span>' : '');
    btnRank.style.display = ''; btnFull.style.display = ''; btnLogout.style.display = '';
  } else {
    chip.textContent = '未登录';
    btnRank.style.display = 'none'; btnFull.style.display = 'none'; btnLogout.style.display = 'none';
  }
  updateProgress();
}
function postLogin() {
  hideLogin();
  renderStudentBar();
  renderNav();
  setLevel(firstIncompleteLevel());
  updateLearnStatus();
  if (record && record.endAt) showLeaderboard();
}
function doLogin() {
  const name = document.getElementById('inp-name').value.trim();
  const id = document.getElementById('inp-id').value.trim();
  const errEl = document.getElementById('login-err');
  if (!name) { errEl.textContent = '请输入姓名'; return; }
  if (!id) { errEl.textContent = '请输入学号'; return; }
  errEl.textContent = '';
  identity = { name, id };
  if (isAdmin()) {
    record = newRecord(name, id);
  } else {
    if (!rankMap[id]) { rankMap[id] = newRecord(name, id); saveRank(); }
    else { rankMap[id].name = name; saveRank(); }
    record = rankMap[id];
  }
  saveIdentity();
  postLogin();
  toast(isAdmin() ? '管理员 ' + name + ' 已登录，可在排行榜中删除学生成绩' : '欢迎，' + name + '！逐级闯关，完成学习与习题后解锁下一关');
}
function doLogout() {
  saveRank();
  identity = null; record = null;
  saveIdentity();
  resetDemo();
  showLogin();
  const inpN = document.getElementById('inp-name'); if (inpN) inpN.value = '';
  const inpI = document.getElementById('inp-id');   if (inpI) inpI.value = '';
  renderStudentBar();
  renderNav();
}

// ---------- 排行榜 ----------
function fmtDuration(sec) {
  if (sec == null || isNaN(sec)) return '—';
  const m = Math.floor(sec / 60), s = sec % 60;
  return (m > 0 ? m + '分' : '') + s + '秒';
}
function getFinishedRecords() {
  return Object.values(rankMap)
    .filter(r => r.endAt && !(r.name === ADMIN.name && String(r.id) === String(ADMIN.id)))
    .map(r => {
      const st = computeStats(r);
      return {
        name: r.name, id: r.id, score: st.score, correctRate: st.correctRate,
        durationSec: Math.max(0, Math.round((r.endAt - r.startAt) / 1000)), wrongList: st.wrongList,
      };
    })
    .sort((a, b) => (b.score - a.score) || (a.durationSec - b.durationSec));
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function deleteStudent(id, btn) {
  if (!isAdmin()) { toast('无删除权限：仅管理员可删除'); return; }
  if (!btn.dataset.armed) {
    btn.dataset.armed = '1';
    btn.textContent = '确认删除？';
    btn.classList.add('armed');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = '删除'; btn.classList.remove('armed'); }, 3000);
    return;
  }
  clearTimeout(btn._t);
  delete rankMap[id];
  saveRank();
  const isSelf = identity && identity.id === id;
  if (isSelf) {
    identity = null; record = null;
    saveIdentity();
    resetDemo();
    hideLeaderboard();
    showLogin();
    const inpN = document.getElementById('inp-name'); if (inpN) inpN.value = '';
    const inpI = document.getElementById('inp-id');   if (inpI) inpI.value = '';
    renderStudentBar();
    renderNav();
    toast('已删除本人答题记录，请重新登录');
  } else {
    toast('已删除「' + esc(id) + '」的答题记录');
    showLeaderboard();
  }
}
function showLeaderboard() {
  const list = getFinishedRecords();
  const admin = isAdmin();
  const totalQ = allQuestions().length, fullScore = POINTS_PER_Q * totalQ;
  const sub = document.getElementById('rank-sub');
  sub.textContent = '共 ' + list.length + ' 名同学完成闯关 · 满分 ' + fullScore + ' 分（' + totalQ + ' 题）' +
    (admin ? '　·　管理员可删除任意记录' : '　·　删除功能仅管理员可用');
  const body = document.getElementById('rank-body');
  let html = '';

  // 已完成榜单
  if (!list.length) {
    html += '<div class="rank-empty">暂无已完成闯关的记录</div>';
  } else {
    html += '<table class="rank-table"><thead><tr><th>排名</th><th>姓名</th><th>学号</th><th>总分</th><th>正确率</th><th>完成用时</th>';
    if (admin) html += '<th>操作</th>';
    html += '</tr></thead><tbody>';
    list.forEach((r, i) => {
      const isMe = identity && r.id === identity.id;
      html += '<tr' + (isMe ? ' class="me"' : '') + '><td' + (i === 0 ? ' class="top1"' : '') + '>' + (i + 1) + '</td>' +
        '<td>' + esc(r.name) + '</td><td>' + esc(r.id) + '</td><td>' + r.score + '</td><td>' + r.correctRate + '%</td><td>' + fmtDuration(r.durationSec) + '</td>';
      if (admin) html += '<td class="op"><button class="del-btn" data-id="' + esc(r.id) + '">删除</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  // 进行中 / 未完成记录（同样支持管理员删除）
  const unfinished = Object.values(rankMap).filter(r => !r.endAt);
  if (unfinished.length) {
    html += '<div class="unfinished-title">进行中 / 未完成记录（' + unfinished.length + ' 人）</div>' +
      '<table class="unfinished-table"><thead><tr><th>姓名</th><th>学号</th><th>已答题</th><th>当前得分</th>';
    if (admin) html += '<th>操作</th>';
    html += '</tr></thead><tbody>';
    unfinished.forEach(r => {
      const st = computeStats(r);
      html += '<tr><td>' + esc(r.name) + '</td><td>' + esc(r.id) + '</td><td>' + st.answered + '/' + st.total + '</td><td>' + st.score + '</td>';
      if (admin) html += '<td class="op"><button class="del-btn" data-id="' + esc(r.id) + '">删除</button></td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
  }

  // 学情错题记录
  const wrongAll = [];
  list.forEach(r => r.wrongList.forEach(w => wrongAll.push({ name: r.name, id: r.id, ...w })));
  if (wrongAll.length) {
    html += '<div class="wrong-title">学情错题记录（' + wrongAll.length + ' 题）</div>';
    wrongAll.forEach(w => {
      html += '<div class="wrong-item">' +
        '<div class="wname">' + esc(w.name) + '（' + esc(w.id) + '） · 第' + w.level + '关 · ' + w.type + '</div>' +
        '<div class="wstem">' + esc(w.stem) + '</div>' +
        '<div class="wans">作答：<b class="w">' + esc(w.options[w.pick]) + '</b>　正确答案：<b class="c">' + esc(w.options[w.answer]) + '</b></div>' +
        '</div>';
    });
  }

  // 一次性写入 DOM，再绑定删除事件（避免 innerHTML += 清空已绑定事件）
  body.innerHTML = html;
  if (admin) {
    body.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteStudent(btn.dataset.id, btn));
    });
  }
  document.getElementById('rank-mask').classList.add('show');
}
function hideLeaderboard() { document.getElementById('rank-mask').classList.remove('show'); }

  box.innerHTML = '';

      '<div class="q-stem"><span class="tag">' + q.type + '</span>' + q.stem + '</div>' +
      '<div>' + optHTML + '</div>' +
      '<div class="check"><button class="btn btn-play submit" disabled>提交答案</button><span class="hint"></span></div>' +
      '<div class="feedback"></div>';
    box.appendChild(item);

    const opts = item.querySelectorAll('.opt');
    const submit = item.querySelector('.submit');
    const fb = item.querySelector('.feedback');
    const hint = item.querySelector('.hint');

    // 恢复已答状态（绑定当前学号）
    const saved = record ? record.answers[gid] : undefined;
    if (saved !== undefined) {
      const ok = saved === q.answer;
      opts.forEach((el, oi) => {
        if (oi === q.answer) el.classList.add('right');
        if (oi === saved && !ok) el.classList.add('wrong');
        if (oi === saved) el.classList.add('sel');
      });
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = (ok ? '✔ 回答正确！' : '✘ 回答错误。') + '<div class="exp">解析：' + q.exp + '</div>';
      submit.disabled = true;
      return;
    }

    opts.forEach((el, oi) => {
      el.addEventListener('click', () => {
        opts.forEach(e => e.classList.remove('sel'));
        el.classList.add('sel');
        item.dataset.pick = oi;
        submit.disabled = false;
      });
    });
    submit.addEventListener('click', () => {
      if (!record) return;
      const pick = parseInt(item.dataset.pick);
      if (isNaN(pick)) return;
      record.answers[gid] = pick;
      saveRank();
      const ok = pick === q.answer;
      opts.forEach((el, oi) => {
        if (oi === q.answer) el.classList.add('right');
        if (oi === pick && !ok) el.classList.add('wrong');
      });
      fb.className = 'feedback ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = (ok ? '✔ 回答正确！' : '✘ 回答错误。') + '<div class="exp">解析：' + q.exp + '</div>';
      submit.disabled = true;
      renderNav();
      updateLearnStatus();
      checkFinish();
    });
  });
}

// ---------- 关卡切换 ----------
function setLevel(lv) {
  if (!identity) return;
  if (!isUnlocked(lv)) { toast('请先完成上一关的「学习 + 习题」再进入本关'); return; }
  currentLevel = lv;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', parseInt(t.dataset.level) === lv));
  renderHead();
  syncParamInputs();
  updateResultUI();
  mScale = computeScale();
  resetDemo();
  renderQuiz();
  updateLearnStatus();
}

// ---------- 事件绑定 ----------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => setLevel(parseInt(tab.dataset.level)));
});
document.getElementById('btn-play').addEventListener('click', play);
document.getElementById('btn-step').addEventListener('click', () => { if (!identity) return; if (step < 4) goStep(step + 1); });
document.getElementById('btn-reset').addEventListener('click', () => { if (!identity) return; resetDemo(); });
document.getElementById('login-btn').addEventListener('click', doLogin);
document.getElementById('inp-name').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('inp-id').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('btn-rank').addEventListener('click', showLeaderboard);
document.getElementById('btn-full').addEventListener('click', goFullscreen);
document.getElementById('btn-logout').addEventListener('click', doLogout);
document.getElementById('rank-close').addEventListener('click', hideLeaderboard);
document.getElementById('rank-mask').addEventListener('click', e => { if (e.target === e.currentTarget) hideLeaderboard(); });

// ---------- 初始化 ----------
loadRank();
resize();
// 始终显示登录页面，要求用户输入姓名和学号才能进入
identity = null; record = null;
localStorage.removeItem(LS_ID);
showLogin();
const inpN0 = document.getElementById('inp-name'); if (inpN0) inpN0.value = '';
const inpI0 = document.getElementById('inp-id');   if (inpI0) inpI0.value = '';
renderStudentBar();
renderNav();
</script>
