<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结构力学 · 知识果树</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", -apple-system, sans-serif; }
body { background: linear-gradient(180deg, #87ceeb 0%, #b8e0f5 60%, #d6f0c8 100%); color: #2d3a4a; user-select: none; }

/* ====== 背景画布 ====== */
#scene-canvas { position: fixed; inset: 0; z-index: 0; display: block; }

/* ====== 顶部信息条 ====== */
.top-bar {
  position: fixed; top: 16px; left: 16px; right: 16px; z-index: 10;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  pointer-events: none;
}
.top-bar > * { pointer-events: auto; }
.user-card {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
  border-radius: 14px; padding: 8px 16px;
  box-shadow: 0 4px 16px rgba(0, 80, 60, 0.12);
  border: 1px solid rgba(120, 200, 160, 0.4);
  font-size: 14px;
}
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, #6fcf97, #4a9d6f);
  color: white; display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px;
}
.user-info { display: flex; flex-direction: column; line-height: 1.3; }
.user-name { font-weight: 600; color: #2d3a4a; }
.user-id { font-size: 11px; color: #6c7a8a; }
.admin-badge {
  background: linear-gradient(135deg, #ffb84a, #ff8c42);
  color: white; font-size: 10px; padding: 2px 6px; border-radius: 6px;
  font-weight: 600; margin-left: 6px;
}

.action-bar { display: flex; gap: 8px; }
.action-btn {
  background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
  border: 1px solid rgba(120, 200, 160, 0.4); border-radius: 12px;
  padding: 8px 14px; font-size: 13px; color: #2d3a4a;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
  box-shadow: 0 4px 12px rgba(0, 80, 60, 0.08);
}
.action-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 80, 60, 0.15); background: rgba(255, 255, 255, 0.95); }
.action-btn.danger { color: #d63a4a; border-color: rgba(255, 100, 120, 0.4); }
.action-btn.danger:hover { background: rgba(255, 100, 120, 0.08); }
.action-btn.primary { background: linear-gradient(135deg, #6fcf97, #4a9d6f); color: white; border: none; }
.action-btn.primary:hover { background: linear-gradient(135deg, #7fdfa7, #5aad7f); }

/* ====== 统计条 ====== */
.stat-bar {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10;
  background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
  border-radius: 14px; padding: 10px 20px;
  display: flex; gap: 24px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0, 80, 60, 0.12);
  border: 1px solid rgba(120, 200, 160, 0.4);
}
.stat-item { display: flex; align-items: center; gap: 6px; color: #4a5a6a; }
.stat-num { font-size: 18px; font-weight: 700; color: #4a9d6f; }
.stat-num.gold { color: #d4a017; }
.stat-num.blue { color: #4488dd; }

/* ====== 登录界面 ====== */
.login-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: linear-gradient(135deg, rgba(135, 206, 235, 0.95) 0%, rgba(214, 240, 200, 0.95) 100%);
  backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.5s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.login-card {
  background: white; border-radius: 24px;
  padding: 40px 36px; width: 400px; max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0, 80, 60, 0.2);
  text-align: center;
  position: relative;
  overflow: hidden;
}
.login-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
  background: linear-gradient(90deg, #6fcf97, #4a9d6f, #2d8a55);
}
.login-icon { font-size: 56px; margin-bottom: 12px; }
.login-title { font-size: 24px; font-weight: 700; color: #2d3a4a; margin-bottom: 6px; }
.login-subtitle { font-size: 13px; color: #6c7a8a; margin-bottom: 28px; }

.login-field { margin-bottom: 16px; text-align: left; }
.login-field label {
  display: block; font-size: 12px; color: #6c7a8a;
  margin-bottom: 6px; font-weight: 500;
}
.login-input {
  width: 100%; padding: 12px 14px; font-size: 14px;
  border: 2px solid #e2eaf0; border-radius: 10px;
  outline: none; transition: all 0.2s; font-family: inherit;
  background: #f8fbf9;
}
.login-input:focus { border-color: #6fcf97; background: white; box-shadow: 0 0 0 3px rgba(111, 207, 151, 0.15); }
.login-input.error { border-color: #ff6b7a; background: rgba(255, 107, 122, 0.05); }

.login-error {
  color: #d63a4a; font-size: 12px; margin-top: 6px;
  min-height: 16px; text-align: left;
}

.login-btn {
  width: 100%; padding: 14px; margin-top: 8px;
  background: linear-gradient(135deg, #6fcf97, #4a9d6f);
  color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; font-family: inherit;
  box-shadow: 0 4px 12px rgba(74, 157, 111, 0.3);
}
.login-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(74, 157, 111, 0.4); }
.login-btn:active { transform: translateY(0); }

.login-hint {
  margin-top: 16px; font-size: 11px; color: #8a98a8;
  padding: 8px 12px; background: #f0f7f3; border-radius: 8px;
  line-height: 1.5;
}

/* ====== 果实 ====== */
.fruit-layer {
  position: fixed; inset: 0; z-index: 5;
  pointer-events: none;
}
.fruit {
  position: absolute; transform: translate(-50%, -50%);
  pointer-events: auto; cursor: pointer;
  transition: filter 0.3s, transform 0.2s;
  animation: fruitSway 4s ease-in-out infinite;
  animation-delay: var(--sway-delay, 0s);
}
@keyframes fruitSway {
  0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
  50% { transform: translate(-50%, -50%) rotate(2deg); }
}

.fruit:hover { filter: brightness(1.1); }

.fruit-body {
  width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ff8a4a, #d63a4a 60%, #8a1a2a);
  box-shadow:
    inset -6px -6px 12px rgba(0, 0, 0, 0.25),
    inset 4px 4px 8px rgba(255, 255, 255, 0.4),
    0 4px 12px rgba(214, 58, 74, 0.4);
  position: relative;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: white;
  text-align: center; padding: 8px; line-height: 1.2;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

.fruit-stem {
  position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
  width: 8px; height: 14px; background: #6d4226;
  border-radius: 4px 4px 0 0;
}
.fruit-leaf {
  position: absolute; top: -10px; right: -6px;
  width: 22px; height: 14px;
  background: radial-gradient(ellipse at 30% 50%, #7fcf6f, #4a9d3f);
  border-radius: 0 50% 50% 0;
  transform: rotate(35deg);
  box-shadow: inset -1px -1px 2px rgba(0, 0, 0, 0.15);
}

/* 状态颜色 */
.fruit[data-state="ripe"] .fruit-body {
  background: radial-gradient(circle at 30% 30%, #ffb88a, #ff7a3a 60%, #c54a1a);
}
.fruit[data-state="picked"] .fruit-body {
  background: radial-gradient(circle at 30% 30%, #ffe28a, #ffc14a 50%, #b87a1a);
  box-shadow:
    inset -6px -6px 12px rgba(0, 0, 0, 0.25),
    inset 4px 4px 8px rgba(255, 255, 255, 0.5),
    0 4px 18px rgba(255, 193, 74, 0.6),
    0 0 30px rgba(255, 220, 100, 0.5);
}
.fruit[data-state="picked"] .fruit-body::before {
  content: '★';
  position: absolute; top: -10px; right: -10px;
  font-size: 22px; color: #ffd700;
  text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
  animation: starSpin 3s linear infinite;
}
@keyframes starSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.fruit[data-state="picking"] .fruit-body {
  animation: fruitGlow 1.5s ease-in-out infinite;
}
@keyframes fruitGlow {
  0%, 100% { box-shadow:
    inset -6px -6px 12px rgba(0, 0, 0, 0.25),
    inset 4px 4px 8px rgba(255, 255, 255, 0.4),
    0 4px 12px rgba(214, 58, 74, 0.4),
    0 0 20px rgba(255, 200, 100, 0.4); }
  50% { box-shadow:
    inset -6px -6px 12px rgba(0, 0, 0, 0.25),
    inset 4px 4px 8px rgba(255, 255, 255, 0.4),
    0 4px 18px rgba(255, 200, 100, 0.7),
    0 0 40px rgba(255, 200, 100, 0.7); }
}

.fruit-label {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  margin-top: 6px;
  background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(8px);
  padding: 4px 10px; border-radius: 8px; font-size: 11px;
  color: #2d3a4a; font-weight: 600; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(120, 200, 160, 0.3);
}
.fruit-score {
  display: inline-block; margin-left: 4px;
  font-size: 10px; color: #4a9d6f; font-weight: 700;
}

/* ====== 通用模态框 ====== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0, 30, 20, 0.55); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  animation: fadeIn 0.25s ease;
}
.modal-overlay.show { display: flex; }

.modal {
  background: white; border-radius: 20px;
  width: 540px; max-width: 92vw; max-height: 88vh;
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 50, 30, 0.35);
  animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.modal-header {
  padding: 20px 24px; border-bottom: 1px solid #e8eef0;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(135deg, #f0f7f3, #e8f3ed);
}
.modal-title { font-size: 18px; font-weight: 700; color: #2d3a4a; }
.modal-subtitle { font-size: 12px; color: #6c7a8a; margin-top: 4px; }
.modal-close {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0, 0, 0, 0.05); border: none; cursor: pointer;
  font-size: 18px; color: #6c7a8a;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close:hover { background: rgba(214, 58, 74, 0.15); color: #d63a4a; }

.modal-body { padding: 24px; overflow-y: auto; flex: 1; }

/* ====== 练习弹窗 ====== */
.practice-progress {
  display: flex; gap: 4px; margin-bottom: 16px;
}
.progress-dot {
  flex: 1; height: 4px; border-radius: 2px;
  background: #e8eef0; transition: all 0.3s;
}
.progress-dot.done { background: #6fcf97; }
.progress-dot.current { background: #4a9d6f; height: 6px; }
.progress-dot.wrong { background: #d63a4a; }

.practice-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 12px; font-size: 13px; color: #6c7a8a;
}
.practice-counter { font-weight: 600; color: #4a9d6f; font-size: 16px; }

.question-card {
  background: #f8fbf9; border-radius: 14px;
  padding: 20px; border: 1px solid #e8eef0;
  margin-bottom: 16px;
}
.question-type {
  display: inline-block; padding: 2px 10px; border-radius: 6px;
  font-size: 11px; font-weight: 600; margin-bottom: 10px;
}
.question-type.choice { background: #e8f3ed; color: #4a9d6f; }
.question-type.judge { background: #fff3e0; color: #ff8c42; }
.question-type.fill { background: #e8eef5; color: #4488dd; }

.question-text {
  font-size: 15px; color: #2d3a4a; line-height: 1.6;
  font-weight: 500;
}

.options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.option {
  padding: 12px 16px; background: white;
  border: 2px solid #e8eef0; border-radius: 12px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; color: #2d3a4a;
}
.option:hover { border-color: #6fcf97; background: #f8fbf9; }
.option.selected { border-color: #6fcf97; background: #f0f7f3; }
.option.correct { border-color: #6fcf97; background: #e8f3ed; }
.option.wrong { border-color: #d63a4a; background: #fce8eb; }
.option-letter {
  width: 28px; height: 28px; border-radius: 50%;
  background: #e8eef0; color: #6c7a8a;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.option.selected .option-letter { background: #6fcf97; color: white; }
.option.correct .option-letter { background: #4a9d6f; color: white; }
.option.wrong .option-letter { background: #d63a4a; color: white; }

.fill-input {
  width: 100%; padding: 12px 14px; font-size: 15px;
  border: 2px solid #e8eef0; border-radius: 10px;
  outline: none; margin-top: 14px; font-family: inherit;
  transition: all 0.2s;
}
.fill-input:focus { border-color: #6fcf97; box-shadow: 0 0 0 3px rgba(111, 207, 151, 0.15); }

.feedback {
  margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  font-size: 13px; line-height: 1.5;
  display: none; animation: fadeIn 0.3s ease;
}
.feedback.show { display: block; }
.feedback.correct { background: #e8f3ed; color: #2d8a55; border-left: 4px solid #6fcf97; }
.feedback.wrong { background: #fce8eb; color: #b8323a; border-left: 4px solid #d63a4a; }
.feedback-title { font-weight: 700; margin-bottom: 4px; }

.practice-actions {
  display: flex; gap: 10px; margin-top: 18px;
}
.practice-btn {
  flex: 1; padding: 12px; border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; border: none; font-family: inherit;
}
.practice-btn.primary { background: linear-gradient(135deg, #6fcf97, #4a9d6f); color: white; }
.practice-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(74, 157, 111, 0.3); }
.practice-btn.primary:disabled { background: #d4dde4; cursor: not-allowed; transform: none; box-shadow: none; }
.practice-btn.secondary { background: #f0f4f6; color: #4a5a6a; }
.practice-btn.secondary:hover { background: #e8eef0; }

/* ====== 完成结果 ====== */
.result-card {
  text-align: center; padding: 16px 0;
}
.result-icon { font-size: 64px; margin-bottom: 12px; }
.result-title { font-size: 22px; font-weight: 700; color: #2d3a4a; margin-bottom: 6px; }
.result-score { font-size: 48px; font-weight: 800; margin: 14px 0; }
.result-score.full { color: #d4a017; text-shadow: 0 0 20px rgba(212, 160, 23, 0.4); }
.result-score.partial { color: #4a9d6f; }
.result-score.low { color: #d63a4a; }
.result-desc { font-size: 14px; color: #6c7a8a; margin-bottom: 18px; line-height: 1.6; }

.result-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin: 20px 0; padding: 16px; background: #f8fbf9; border-radius: 12px;
}
.result-stat-item { text-align: center; }
.result-stat-num { font-size: 22px; font-weight: 700; color: #4a9d6f; }
.result-stat-num.err { color: #d63a4a; }
.result-stat-label { font-size: 11px; color: #6c7a8a; margin-top: 2px; }

.result-actions { display: flex; gap: 10px; }

/* ====== 管理员面板 ====== */
.admin-empty {
  text-align: center; padding: 40px 20px; color: #8a98a8;
}
.admin-empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }

.student-record {
  background: #f8fbf9; border: 1px solid #e8eef0; border-radius: 12px;
  padding: 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
}
.student-record-info { flex: 1; }
.student-record-name { font-weight: 600; color: #2d3a4a; font-size: 14px; }
.student-record-id { font-size: 11px; color: #6c7a8a; margin-top: 2px; }
.student-record-stats { display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: #6c7a8a; }
.student-record-stats span { display: inline-flex; align-items: center; gap: 3px; }
.student-record-stats .v { color: #4a9d6f; font-weight: 600; }
.record-del-btn {
  background: rgba(214, 58, 74, 0.1); color: #d63a4a;
  border: 1px solid rgba(214, 58, 74, 0.3); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; cursor: pointer;
  transition: all 0.2s; font-family: inherit;
}
.record-del-btn:hover { background: #d63a4a; color: white; }

/* ====== Toast ====== */
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
  z-index: 300; padding: 12px 22px; border-radius: 12px;
  font-size: 14px; color: white; font-weight: 500;
  background: rgba(45, 58, 74, 0.95); backdrop-filter: blur(10px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
  opacity: 0; transition: all 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: linear-gradient(135deg, #4a9d6f, #2d8a55); }
.toast.error { background: linear-gradient(135deg, #d63a4a, #b8323a); }
.toast.info { background: linear-gradient(135deg, #4488dd, #2266bb); }

/* ====== 庆祝特效 ====== */
.celebration {
  position: fixed; inset: 0; z-index: 250; pointer-events: none;
  overflow: hidden;
}
.confetti-piece {
  position: absolute; width: 10px; height: 14px;
  background: #ffb84a; top: -20px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ====== 提示卡 ====== */
.tip {
  position: fixed; bottom: 80px; left: 16px; z-index: 10;
  background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
  border-radius: 12px; padding: 10px 14px;
  font-size: 12px; color: #4a5a6a; line-height: 1.6;
  box-shadow: 0 4px 12px rgba(0, 80, 60, 0.08);
  border: 1px solid rgba(120, 200, 160, 0.3);
  max-width: 220px;
}
.tip strong { color: #4a9d6f; }

/* ====== 滚动条 ====== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(74, 157, 111, 0.3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(74, 157, 111, 0.5); }

@media (max-width: 600px) {
  .login-card { padding: 32px 24px; }
  .fruit-body { width: 70px; height: 70px; font-size: 10px; }
  .top-bar { flex-wrap: wrap; }
  .user-card { padding: 6px 12px; font-size: 12px; }
  .stat-bar { gap: 14px; padding: 8px 14px; }
  .tip { display: none; }
}
</style>
</head>
<body>

<!-- 背景画布 -->
<canvas id="scene-canvas"></canvas>

<!-- 登录界面 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <div class="login-icon">🌳</div>
    <div class="login-title">结构力学 · 知识果树</div>
    <div class="login-subtitle">登入学习，开启你的知识果实之旅</div>

    <div class="login-field">
      <label>学号</label>
      <input type="text" class="login-input" id="login-id" placeholder="请输入学号" autocomplete="off" maxlength="20" value="">
    </div>
    <div class="login-field">
      <label>姓名</label>
      <input type="text" class="login-input" id="login-name" placeholder="请输入姓名" autocomplete="off" maxlength="20" value="">
    </div>
    <div class="login-error" id="login-error"></div>

    <button class="login-btn" id="login-btn">进入知识果树</button>

    <div class="login-hint">
      管理员账号：姓名 <strong>1</strong>，学号 <strong>1</strong><br>
      管理员登录后可见【管理后台】按钮，可在管理后台删除任一学生的记录（含本人）
    </div>
  </div>
</div>

<!-- 顶部信息条 -->
<div class="top-bar" id="top-bar" style="display:none">
  <div class="user-card">
    <div class="user-avatar" id="user-avatar">学</div>
    <div class="user-info">
      <div><span class="user-name" id="user-name"></span><span class="admin-badge" id="admin-badge" style="display:none">管理员</span></div>
      <div class="user-id" id="user-id"></div>
    </div>

const ADMIN_ID = '1';
const ADMIN_NAME = '1';
const STORAGE_KEY_RECORD = 'fruit_tree_user_records_v1';
const STORAGE_KEY_CURRENT = 'fruit_tree_current_user_v1';

let currentUser = null;          // {id, name, isAdmin}
let userRecords = {};            // 学号 -> {name, scores: {ch1: bestScore, ...}, picked: {ch1: bool, ...}, attempts: {...}}
let currentFruit = null;
let practiceState = null;        // {questions, current, answers, score}

// ============================================================
// 4. Canvas 场景绘制（果树 + 背景）
// ============================================================
const canvas = document.getElementById('scene-canvas');
const ctx = canvas.getContext('2d');
let clouds = [];
let time = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  initClouds();
  computeFruitPositions();
  renderFruits();
}

function initClouds() {
  clouds = [];
  const count = Math.max(3, Math.floor(canvas.width / 300));
  for (let i = 0; i < count; i++) {
    clouds.push({
      x: Math.random() * canvas.width,
      y: 40 + Math.random() * (canvas.height * 0.25),
      r: 20 + Math.random() * 30,
      v: 0.1 + Math.random() * 0.2
    });
  }
}

function drawSky() {
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, '#87ceeb');
  sky.addColorStop(0.6, '#b8e0f5');
  sky.addColorStop(0.85, '#d6f0c8');
  sky.addColorStop(1, '#a8d68f');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 太阳
  const sunX = canvas.width - 120;
  const sunY = 110;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 80);
  sunGrad.addColorStop(0, 'rgba(255, 240, 180, 0.9)');
  sunGrad.addColorStop(0.3, 'rgba(255, 220, 120, 0.5)');
  sunGrad.addColorStop(1, 'rgba(255, 200, 80, 0)');
  ctx.fillStyle = sunGrad;
  ctx.beginPath();
  ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff5b8';
  ctx.beginPath();
  ctx.arc(sunX, sunY, 38, 0, Math.PI * 2);
  ctx.fill();

  // 云朵
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  clouds.forEach(c => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.8, c.y + 5, c.r * 0.7, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.8, c.y + 5, c.r * 0.7, 0, Math.PI * 2);
    ctx.arc(c.x + c.r * 0.4, c.y - c.r * 0.4, c.r * 0.6, 0, Math.PI * 2);
    ctx.arc(c.x - c.r * 0.4, c.y - c.r * 0.3, c.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
  });

  // 远山
  ctx.fillStyle = 'rgba(120, 160, 130, 0.4)';
  ctx.beginPath();
  ctx.moveTo(0, canvas.height * 0.78);
  for (let x = 0; x <= canvas.width; x += 80) {
    const y = canvas.height * 0.78 - Math.abs(Math.sin(x * 0.005)) * 60 - 20;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();
  ctx.fill();

  // 草地
  const grass = ctx.createLinearGradient(0, canvas.height * 0.82, 0, canvas.height);
  grass.addColorStop(0, '#8fbc6f');
  grass.addColorStop(1, '#5a8f3f');
  ctx.fillStyle = grass;
  ctx.fillRect(0, canvas.height * 0.82, canvas.width, canvas.height * 0.18);

  // 草地纹理
  ctx.fillStyle = 'rgba(74, 130, 60, 0.4)';
  for (let i = 0; i < 80; i++) {
    const gx = Math.random() * canvas.width;
    const gy = canvas.height * 0.85 + Math.random() * canvas.height * 0.12;
    ctx.fillRect(gx, gy, 2, 6);
  }
}

function drawTree() {
  const cx = canvas.width / 2;
  const groundY = canvas.height * 0.85;
  const trunkBaseY = groundY;
  const trunkTopY = canvas.height * 0.32;

  // 树干
  const trunkWidth = canvas.width * 0.07;
  const trunkGrad = ctx.createLinearGradient(cx - trunkWidth/2, 0, cx + trunkWidth/2, 0);
  trunkGrad.addColorStop(0, '#6d4226');
  trunkGrad.addColorStop(0.5, '#9c6840');
  trunkGrad.addColorStop(1, '#5a3620');
  ctx.fillStyle = trunkGrad;
  ctx.beginPath();
  ctx.moveTo(cx - trunkWidth/2 - 8, trunkBaseY);
  ctx.bezierCurveTo(
    cx - trunkWidth/2, trunkBaseY - 60,
    cx - trunkWidth/2 + 5, trunkTopY + 80,
    cx - trunkWidth * 0.3, trunkTopY
  );
  ctx.lineTo(cx + trunkWidth * 0.3, trunkTopY);
  ctx.bezierCurveTo(
    cx + trunkWidth/2 - 5, trunkTopY + 80,
    cx + trunkWidth/2, trunkBaseY - 60,
    cx + trunkWidth/2 + 8, trunkBaseY
  );
  ctx.closePath();
  ctx.fill();

  // 树干纹理
  ctx.strokeStyle = 'rgba(60, 35, 18, 0.4)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    const y1 = trunkBaseY - 20 - i * 30;
    ctx.moveTo(cx - trunkWidth/2 + 4, y1);
    ctx.bezierCurveTo(
      cx - 5, y1 - 10,
      cx + 5, y1 - 20,
      cx + trunkWidth/2 - 4, y1 - 8
    );
    ctx.stroke();
  }

  // 主分叉点（树枝从此处向四周展开）
  const branchY = trunkTopY + 20;
  const branchSpread = canvas.width * 0.36;

  // 树枝（在果实位置前绘制）
  const branches = [
    // 左下分支
    { x1: cx, y1: branchY + 30, x2: cx - branchSpread * 0.55, y2: branchY + 90, w: 16 },
    // 右下分支
    { x1: cx, y1: branchY + 30, x2: cx + branchSpread * 0.55, y2: branchY + 90, w: 16 },
    // 左中分支
    { x1: cx, y1: branchY, x2: cx - branchSpread * 0.85, y2: branchY - 30, w: 18 },
    // 右中分支
    { x1: cx, y1: branchY, x2: cx + branchSpread * 0.85, y2: branchY - 30, w: 18 },
    // 左上分支
    { x1: cx, y1: branchY - 10, x2: cx - branchSpread * 0.45, y2: branchY - 90, w: 14 },
    // 右上分支
    { x1: cx, y1: branchY - 10, x2: cx + branchSpread * 0.45, y2: branchY - 90, w: 14 },
    // 顶部直立分支
    { x1: cx, y1: branchY - 20, x2: cx, y2: branchY - 130, w: 12 },
    // 左前分支（短）
    { x1: cx - branchSpread * 0.3, y1: branchY - 20, x2: cx - branchSpread * 0.95, y2: branchY + 20, w: 12 },
    // 右前分支（短）
    { x1: cx + branchSpread * 0.3, y1: branchY - 20, x2: cx + branchSpread * 0.95, y2: branchY + 20, w: 12 }
  ];

  ctx.strokeStyle = '#8a5a36';
  ctx.lineCap = 'round';
  branches.forEach(b => {
    const grad = ctx.createLinearGradient(b.x1, b.y1, b.x2, b.y2);
    grad.addColorStop(0, '#9c6840');
    grad.addColorStop(1, '#7a4a26');
    ctx.strokeStyle = grad;
    ctx.lineWidth = b.w;
    ctx.beginPath();
    ctx.moveTo(b.x1, b.y1);
    ctx.quadraticCurveTo(
      (b.x1 + b.x2) / 2 + (b.y1 - b.y2) * 0.1,
      (b.y1 + b.y2) / 2 - 20,
      b.x2, b.y2
    );
    ctx.stroke();
  });

  // 树冠（叶丛）
  drawCanopy(cx, branchY, branchSpread);

  // 树根
  ctx.fillStyle = '#6d4226';
  ctx.beginPath();
  ctx.ellipse(cx, trunkBaseY + 5, trunkWidth * 1.2, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  // 树根两侧小根
  ctx.fillStyle = '#8a5a36';
  ctx.beginPath();
  ctx.ellipse(cx - trunkWidth * 0.7, trunkBaseY - 5, 18, 8, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx + trunkWidth * 0.7, trunkBaseY - 5, 18, 8, 0.3, 0, Math.PI * 2);
  ctx.fill();
}

function drawCanopy(cx, branchY, branchSpread) {
  // 叶丛：用多个半透明圆形模拟茂密树冠
  const leaves = [
    { x: cx, y: branchY - 50, r: 80 },
    { x: cx - branchSpread * 0.4, y: branchY - 30, r: 70 },
    { x: cx + branchSpread * 0.4, y: branchY - 30, r: 70 },
    { x: cx - branchSpread * 0.7, y: branchY - 50, r: 60 },
    { x: cx + branchSpread * 0.7, y: branchY - 50, r: 60 },
    { x: cx, y: branchY - 130, r: 50 },
    { x: cx - branchSpread * 0.25, y: branchY - 90, r: 55 },
    { x: cx + branchSpread * 0.25, y: branchY - 90, r: 55 },
    { x: cx - branchSpread * 0.6, y: branchY - 90, r: 50 },
    { x: cx + branchSpread * 0.6, y: branchY - 90, r: 50 }
  ];

  leaves.forEach(l => {
    const sway = Math.sin(time * 0.001 + l.x * 0.005) * 2;
    const grad = ctx.createRadialGradient(l.x + sway, l.y, 0, l.x + sway, l.y, l.r);
    grad.addColorStop(0, 'rgba(74, 157, 90, 0.8)');
    grad.addColorStop(0.6, 'rgba(94, 167, 100, 0.7)');
    grad.addColorStop(1, 'rgba(74, 157, 90, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(l.x + sway, l.y, l.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawGroundDetails() {
  const groundY = canvas.height * 0.85;
  // 散落的小花
  const flowers = [
    { x: canvas.width * 0.08, y: groundY + 30, c: '#ffb84a' },
    { x: canvas.width * 0.15, y: groundY + 60, c: '#ff6b7a' },
    { x: canvas.width * 0.92, y: groundY + 40, c: '#ffb84a' },
    { x: canvas.width * 0.85, y: groundY + 70, c: '#fff' },
    { x: canvas.width * 0.05, y: groundY + 80, c: '#a8e6cf' }
  ];
  flowers.forEach(f => {
    ctx.fillStyle = f.c;
    ctx.beginPath();
    ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(f.x, f.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

function animateScene() {
  time++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawSky();
  drawTree();
  drawGroundDetails();

  // 云朵移动
  clouds.forEach(c => {
    c.x += c.v;
    if (c.x > canvas.width + 100) c.x = -100;
  });

  requestAnimationFrame(animateScene);
}

// 5. 果实定位与渲染
// ============================================================
const FRUIT_POS = [];

function computeFruitPositions() {
  const cx = canvas.width / 2;
  const baseY = canvas.height * 0.32 + 20;  // 树枝分叉点
  const spread = canvas.width * 0.36;

  // 8 个果实分布在树冠四周，避开中心
  FRUIT_POS.length = 0;
  FRUITS.forEach((f, i) => {
    let x, y;
    // 在树周围做环形分布，但留出中心让树冠透出
    const angle = (-Math.PI / 2) + (i - 3.5) * 0.42;
    const r = Math.min(canvas.width, canvas.height) * 0.32;
    x = cx + Math.cos(angle) * r;
    y = baseY + Math.sin(angle) * r * 0.55 - 20;

    FRUIT_POS.push({ x, y });
  });
}

function renderFruits() {
  const layer = document.getElementById('fruit-layer');
  layer.innerHTML = '';
  if (!currentUser) return;

  const record = getRecord(currentUser.id);

  FRUITS.forEach((f, i) => {
    const pos = FRUIT_POS[i];
    if (!pos) return;
    const state = getFruitState(record, f.id);

    const el = document.createElement('div');
    el.className = 'fruit';
    el.dataset.fruitId = f.id;
    el.dataset.state = state;
    el.style.left = pos.x + 'px';
    el.style.top = pos.y + 'px';
    el.style.setProperty('--sway-delay', (i * 0.3) + 's');

    const best = record.scores[f.id] || 0;
    const labelText = `${f.topic}`;
    const scoreText = state === 'picked' ? `★${best}分` : (best > 0 ? `${best}分` : '');
    const colorStyle = state === 'picked' ? 'color:#b87a1a;' : `color:${f.color};`;

    el.innerHTML = `
      <div class="fruit-stem"></div>
      <div class="fruit-leaf"></div>
      <div class="fruit-body" style="background:radial-gradient(circle at 30% 30%, ${lightenColor(f.color, 40)}, ${f.color} 60%, ${darkenColor(f.color, 30)});">
        ${f.name}
      </div>
      <div class="fruit-label">
        <span style="${colorStyle}">${labelText}</span>
        <span class="fruit-score">${scoreText}</span>
      </div>
    `;

    el.addEventListener('click', () => openPractice(f));
    layer.appendChild(el);
  });
}

function getFruitState(record, fruitId) {
  if (record.picked && record.picked[fruitId]) return 'picked';
  if (record.scoring && record.scoring[fruitId]) return 'picking';
  return 'unpicked';
}

function lightenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((num >> 16) & 0xff) + amount);
  const g = Math.min(255, ((num >> 8) & 0xff) + amount);
  const b = Math.min(255, (num & 0xff) + amount);
  return `rgb(${r},${g},${b})`;
}
function darkenColor(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((num >> 16) & 0xff) - amount);
  const g = Math.max(0, ((num >> 8) & 0xff) - amount);
  const b = Math.max(0, (num & 0xff) - amount);
  return `rgb(${r},${g},${b})`;
}

// ============================================================
// 6. 登录 / 身份验证
// ============================================================
function initLogin() {
  const idInput = document.getElementById('login-id');
  const nameInput = document.getElementById('login-name');
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  function clearError() {
    errorEl.textContent = '';
    idInput.classList.remove('error');
    nameInput.classList.remove('error');
  }

  function tryLogin() {
    const id = idInput.value.trim();
    const name = nameInput.value.trim();
    clearError();

    if (!id) {
      errorEl.textContent = '请输入学号';
      idInput.classList.add('error');
      idInput.focus();
      return;
    }
    if (!name) {
      errorEl.textContent = '请输入姓名';
      nameInput.classList.add('error');
      nameInput.focus();
      return;
    }

    currentUser = {
      id,
      name,
      isAdmin: (id === ADMIN_ID && name === ADMIN_NAME)
    };

    localStorage.setItem(STORAGE_KEY_CURRENT, JSON.stringify(currentUser));
    enterApp();
  }

  btn.addEventListener('click', tryLogin);
  [idInput, nameInput].forEach(inp => {
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') tryLogin();
    });
    inp.addEventListener('input', clearError);
  });

  // 强制显示登录页面，必须输入学号和姓名才能进入
  localStorage.removeItem(STORAGE_KEY_CURRENT);
  document.getElementById('login-id').focus();
}

function enterApp() {
  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('top-bar').style.display = 'flex';
  document.getElementById('stat-bar').style.display = 'flex';
  document.getElementById('tip').style.display = 'block';
  document.getElementById('fruit-layer').style.display = 'block';

  document.getElementById('user-name').textContent = currentUser.name;
  document.getElementById('user-id').textContent = '学号：' + currentUser.id;
  document.getElementById('user-avatar').textContent = currentUser.name.charAt(0);
  document.getElementById('admin-badge').style.display = currentUser.isAdmin ? 'inline-block' : 'none';
  document.getElementById('btn-admin').style.display = currentUser.isAdmin ? 'inline-block' : 'none';

  updateStats();
  renderFruits();
}

function logout() {
  if (!confirm('确定要退出登录吗？\n（不会删除答题记录）')) return;
  currentUser = null;
  localStorage.removeItem(STORAGE_KEY_CURRENT);
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('top-bar').style.display = 'none';
  document.getElementById('stat-bar').style.display = 'none';
  document.getElementById('tip').style.display = 'none';
  document.getElementById('fruit-layer').style.display = 'none';
  document.getElementById('login-id').value = '';
  document.getElementById('login-name').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-id').focus();
}

function resetOwnData() {
  if (!currentUser) return;
  if (!confirm('确定要重置你的所有果实练习记录吗？\n包括已摘取的果实和得分。')) return;
  const rec = getRecord(currentUser.id);
  rec.scores = {};
  rec.picked = {};
  rec.attempts = {};
  rec.scoring = {};
  saveRecords();
  renderFruits();
  updateStats();
  showToast('已重置你的果实记录', 'success');
}

// ============================================================
// 7. 本地存储管理
// ============================================================
function loadRecords() {
  const saved = localStorage.getItem(STORAGE_KEY_RECORD);
  if (saved) {
    try { userRecords = JSON.parse(saved); return; } catch(e) {}
  }
  userRecords = {};
}

function saveRecords() {
  localStorage.setItem(STORAGE_KEY_RECORD, JSON.stringify(userRecords));
}

function getRecord(userId) {
  if (userId === ADMIN_ID) {
    return { name: ADMIN_NAME, scores: {}, picked: {}, attempts: {}, scoring: {} };
  }
  if (!userRecords[userId]) {
    userRecords[userId] = {
      name: '',
      scores: {},
      picked: {},
      attempts: {},
      scoring: {}
    };
  }
  const r = userRecords[userId];
  if (!r.scores) r.scores = {};
  if (!r.picked) r.picked = {};
  if (!r.attempts) r.attempts = {};
  if (!r.scoring) r.scoring = {};
  if (currentUser && !r.name) r.name = currentUser.name;
  return r;
}

function updateStats() {
  if (!currentUser) return;
  const r = getRecord(currentUser.id);
  const picked = Object.values(r.picked).filter(Boolean).length;
  const totalScore = Object.values(r.scores).reduce((a, b) => a + b, 0);
  const totalAttempts = Object.values(r.attempts).reduce((a, b) => a + b, 0);
  document.getElementById('stat-picked').textContent = picked;
  document.getElementById('stat-score').textContent = totalScore;
  document.getElementById('stat-attempts').textContent = totalAttempts;
}

// ============================================================
// 8. 练习弹窗
// ============================================================
function openPractice(fruit) {
  currentFruit = fruit;
  const r = getRecord(currentUser.id);
  r.scoring[fruit.id] = true;
  saveRecords();
  renderFruits();

  // 抽 10 题
  const bank = QUESTION_BANK[fruit.id];
  const shuffled = shuffle([...bank]);
  const questions = shuffled.slice(0, Math.min(10, shuffled.length));

  practiceState = {
    fruit,
    questions,
    current: 0,
    answers: new Array(questions.length).fill(null),
    score: 0
  };

  document.getElementById('practice-title').textContent = `${fruit.name} · ${fruit.topic}`;
  document.getElementById('practice-subtitle').textContent = `共 10 道题 · 答对全部即可摘取果实`;
  document.getElementById('practice-overlay').classList.add('show');
  renderQuestion();
}

function renderQuestion() {
  const body = document.getElementById('practice-body');
  const { questions, current } = practiceState;
  const q = questions[current];

  const progressHtml = questions.map((_, i) => {
    let cls = 'progress-dot';
    if (i < current) {
      cls += practiceState.answers[i]?.correct ? ' done' : ' wrong';
    } else if (i === current) {
      cls += ' current';
    }
    return `<div class="${cls}"></div>`;
  }).join('');

  let typeLabel = '选择题';
  if (q.type === 'judge') typeLabel = '判断题';
  else if (q.type === 'fill') typeLabel = '填空题';

  let optsHtml = '';
  if (q.type === 'choice') {
    const letters = ['A', 'B', 'C', 'D'];
    optsHtml = `<div class="options">${q.opts.map((o, i) => `
      <div class="option" data-letter="${letters[i]}" onclick="selectOption(this, '${letters[i]}')">
        <span class="option-letter">${letters[i]}</span>
        <span>${o}</span>
      </div>
    `).join('')}</div>`;
  } else if (q.type === 'judge') {
    optsHtml = `<div class="options">
      <div class="option" data-letter="正确" onclick="selectOption(this, '正确')">
        <span class="option-letter">✓</span>
        <span>正确</span>
      </div>
      <div class="option" data-letter="错误" onclick="selectOption(this, '错误')">
        <span class="option-letter">✗</span>
        <span>错误</span>
      </div>
    </div>`;
  } else if (q.type === 'fill') {
    optsHtml = `<input type="text" class="fill-input" id="fill-input" placeholder="请输入答案" maxlength="50">`;
  }

  body.innerHTML = `
    <div class="practice-progress">${progressHtml}</div>
    <div class="practice-meta">
      <span class="practice-counter">第 ${current + 1} / ${questions.length} 题</span>
      <span>当前得分：${practiceState.score}</span>
    </div>
    <div class="question-card">
      <span class="question-type ${q.type}">${typeLabel}</span>
      <div class="question-text">${q.q}</div>
      ${optsHtml}
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="practice-actions">
      <button class="practice-btn secondary" onclick="closePractice()">退出练习</button>
      <button class="practice-btn primary" id="submit-btn" onclick="submitAnswer()" disabled>提交答案</button>
    </div>
  `;

  if (q.type === 'fill') {
    const input = document.getElementById('fill-input');
    input.addEventListener('input', () => {
      document.getElementById('submit-btn').disabled = !input.value.trim();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && input.value.trim()) submitAnswer();
    });
    input.focus();
  }
}

function selectOption(el, letter) {
  if (practiceState.answers[practiceState.current] !== null) return;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  practiceState.selected = letter;
  document.getElementById('submit-btn').disabled = false;
}

function submitAnswer() {
  const { questions, current } = practiceState;
  const q = questions[current];
  let userAns;

  if (q.type === 'choice' || q.type === 'judge') {
    userAns = practiceState.selected;
    if (!userAns) return;
  } else if (q.type === 'fill') {
    const input = document.getElementById('fill-input');
    userAns = input.value.trim();
    if (!userAns) return;
  }

  // 判分
  let correct = false;
  if (q.type === 'fill') {
    correct = userAns === q.a;
  } else {
    correct = userAns === q.a;
  }

  practiceState.answers[current] = { userAns, correct, q };

  // 显示反馈
  const feedback = document.getElementById('feedback');
  if (correct) {
    practiceState.score++;
    feedback.className = 'feedback correct show';
    feedback.innerHTML = `<div class="feedback-title">✓ 回答正确</div><div>${q.e || ''}</div>`;
  } else {
    feedback.className = 'feedback wrong show';
    feedback.innerHTML = `<div class="feedback-title">✗ 回答错误</div>
      <div>正确答案：<strong>${q.a}</strong>${q.type === 'fill' ? '' : (q.type === 'choice' ? '' : '')}</div>
      <div style="margin-top:6px">${q.e || ''}</div>`;
  }

  // 高亮选项
  if (q.type === 'choice' || q.type === 'judge') {
    document.querySelectorAll('.option').forEach(o => {
      const l = o.dataset.letter;
      if (l === q.a) o.classList.add('correct');
      else if (l === userAns && !correct) o.classList.add('wrong');
    });
  }

  // 切换按钮
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.textContent = current === practiceState.questions.length - 1 ? '查看结果' : '下一题';
  submitBtn.disabled = false;
  submitBtn.onclick = nextQuestion;

  // 禁用选项
  if (q.type === 'choice' || q.type === 'judge') {
    document.querySelectorAll('.option').forEach(o => o.style.pointerEvents = 'none');
  }
  if (q.type === 'fill') {
    const input = document.getElementById('fill-input');
    input.disabled = true;
  }
}

function nextQuestion() {
  const { questions, current } = practiceState;
  if (current < questions.length - 1) {
    practiceState.current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const { fruit, score, questions } = practiceState;
  const total = questions.length;
  const full = score === total;
  const body = document.getElementById('practice-body');

  // 更新记录
  const r = getRecord(currentUser.id);
  r.attempts[fruit.id] = (r.attempts[fruit.id] || 0) + 1;
  const prev = r.scores[fruit.id] || 0;
  if (score > prev) r.scores[fruit.id] = score;
  if (full) r.picked[fruit.id] = true;
  delete r.scoring[fruit.id];
  saveRecords();
  renderFruits();
  updateStats();

  let resultClass = 'partial';
  let icon = '🌟';
  let title = '再接再厉！';
  let desc = `本章已记录 ${score} 分，多练几次巩固知识。`;
  if (score >= total * 0.8) {
    resultClass = 'partial';
    icon = '🌟';
    title = '表现不错！';
    desc = `本章已记录 ${score} 分${full ? '，恭喜摘取果实！' : '。'}`;
  }
  if (full) {
    resultClass = 'full';
    icon = '🏆';
    title = '满分通过！';
    desc = '本章知识点已完全掌握，可以摘取果实了！';
    triggerCelebration();
  }

  body.innerHTML = `
    <div class="result-card">
      <div class="result-icon">${icon}</div>
      <div class="result-title">${title}</div>
      <div class="result-score ${resultClass}">${score} / ${total}</div>
      <div class="result-desc">${desc}</div>
      <div class="result-stats">
        <div class="result-stat-item">
          <div class="result-stat-num">${score}</div>
          <div class="result-stat-label">答对</div>
        </div>
        <div class="result-stat-item">
          <div class="result-stat-num err">${total - score}</div>
          <div class="result-stat-label">答错</div>
        </div>
        <div class="result-stat-item">
          <div class="result-stat-num">${full ? '★' : '-'}</div>
          <div class="result-stat-label">${full ? '已摘取' : '未摘取'}</div>
        </div>
      </div>
      <div class="result-actions">
        <button class="practice-btn secondary" onclick="closePractice()">关闭</button>
        <button class="practice-btn primary" onclick="openPractice(currentFruit)">再来一组</button>
      </div>
    </div>
  `;
}

function triggerCelebration() {
  const colors = ['#ffb84a', '#ff6b7a', '#6fcf97', '#4dabf7', '#9775fa', '#ffd43b'];
  const layer = document.createElement('div');
  layer.className = 'celebration';
  document.body.appendChild(layer);

  for (let i = 0; i < 50; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(piece);
  }

  setTimeout(() => layer.remove(), 4500);
}

function closePractice() {
  if (practiceState && currentFruit) {
    const r = getRecord(currentUser.id);
    delete r.scoring[currentFruit.id];
    saveRecords();
    renderFruits();
  }
  document.getElementById('practice-overlay').classList.remove('show');
  practiceState = null;
  currentFruit = null;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============================================================
// 9. 管理员面板
// ============================================================
function openAdmin() {
  if (!currentUser || !currentUser.isAdmin) return;
  document.getElementById('admin-overlay').classList.add('show');
  renderAdminList();
}

function closeAdmin() {
  document.getElementById('admin-overlay').classList.remove('show');
}

function renderAdminList() {
  const body = document.getElementById('admin-body');
  const entries = Object.entries(userRecords).filter(([k]) => k !== ADMIN_ID);

  if (entries.length === 0) {
    body.innerHTML = `
      <div class="admin-empty">
        <div class="admin-empty-icon">📋</div>
        <div>暂无学生答题记录</div>
      </div>
    `;
    return;
  }

  body.innerHTML = `
    <div style="font-size:12px;color:#6c7a8a;margin-bottom:14px">
      共 <strong>${entries.length}</strong> 位学生记录，可单独删除任一学生的记录。
    </div>
    ${entries.map(([id, r]) => {
      const picked = Object.values(r.picked || {}).filter(Boolean).length;
      const totalScore = Object.values(r.scores || {}).reduce((a, b) => a + b, 0);
      const totalAttempts = Object.values(r.attempts || {}).reduce((a, b) => a + b, 0);
      const isAdminSelf = id === ADMIN_ID;
      return `
        <div class="student-record">
          <div class="student-record-info">
            <div class="student-record-name">
              ${escapeHtml(r.name || '(未填姓名)')}
              ${isAdminSelf ? '<span class="admin-badge" style="margin-left:6px">管理员</span>' : ''}
            </div>
            <div class="student-record-id">学号：${id}</div>
            <div class="student-record-stats">
              <span><span class="v">${picked}</span>/8 已摘取</span>
              <span><span class="v">${totalScore}</span> 总分</span>
              <span><span class="v">${totalAttempts}</span> 练习次数</span>
            </div>
          </div>
          <button class="record-del-btn" onclick="deleteStudentRecord('${id}')">删除</button>
        </div>
      `;
    }).join('')}
  `;
}

function deleteStudentRecord(userId) {
  if (!currentUser || !currentUser.isAdmin) {
    showToast('无删除权限：仅管理员可删除', 'error');
    return;
  }
  const r = userRecords[userId];
  if (!r) return;
  const name = r.name || '(未填姓名)';
  const isSelf = currentUser.id === userId;
  const confirmMsg = isSelf
    ? `确定要删除本人（学号「${userId}」）的所有答题记录吗？\n删除后您将被退出登录，此操作不可恢复！`
    : `确定要删除学生【${name} / ${userId}】的所有答题记录吗？\n此操作不可恢复！`;
  if (!confirm(confirmMsg)) return;
  delete userRecords[userId];
  saveRecords();
  if (isSelf) {
    // 管理员本人被删 → 退到登录界面
    currentUser = null;
    localStorage.removeItem('fruit_tree_user_session_v1');
    location.reload();
    return;
  }
  renderAdminList();
  // 如果删除的是当前用户（普通用户视角的当前），重新渲染果实
  showToast(`已删除 ${name} 的记录`, 'success');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// ============================================================
// 10. Toast 提示
// ============================================================
let toastTimer = null;
function showToast(msg, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============================================================
window.addEventListener('resize', () => {
  resizeCanvas();
});

loadRecords();
resizeCanvas();
animateScene();
initLogin();
