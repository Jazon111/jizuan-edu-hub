<style>
:root {
  --bg-deep: #030310;
  --bg-mid: #0a0a24;
  --glass: rgba(15, 15, 45, 0.72);
  --glass-border: rgba(120, 130, 255, 0.18);
  --text-main: #e8e8ff;
  --text-dim: #8888bb;
  --text-bright: #ffffff;
  --gold: #ffd700;
  --cyan: #00e0ff;
  --purple: #9d6bff;
  --orange: #ff8c42;
  --green: #42ffaa;
  --red: #ff5577;
  --blue: #4488ff;
  --pink: #ff6ec7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
body { background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 70%); color: var(--text-main); }

#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#graph-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#graph-svg { width: 100%; height: 100%; cursor: grab; }
#graph-svg:active { cursor: grabbing; }

/* Toolbar */
.toolbar {
  position: fixed; top: 16px; left: 16px; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03) inset;
  max-width: 520px;
}
.toolbar-title {
  font-size: 15px; font-weight: 600; color: var(--text-bright);
  margin-right: 8px; white-space: nowrap;
  text-shadow: 0 0 12px rgba(120,130,255,0.5);
}
.tb-btn {
  background: rgba(60, 60, 120, 0.3); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; padding: 6px 14px;
  font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  font-family: inherit;
}
.tb-btn:hover { background: rgba(80, 80, 160, 0.5); border-color: rgba(120,130,255,0.5); box-shadow: 0 0 12px rgba(100,110,255,0.3); }
.tb-btn:active { transform: scale(0.95); }
.tb-search {
  background: rgba(30, 30, 60, 0.6); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; padding: 6px 12px;
  font-size: 13px; width: 140px; outline: none; font-family: inherit;
  transition: all 0.2s;
}
.tb-search:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,224,255,0.2); width: 180px; }
.tb-search::placeholder { color: var(--text-dim); }
.tb-divider { width: 1px; height: 24px; background: rgba(120,130,255,0.15); margin: 0 4px; }
.tb-level-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.tb-level {
  padding: 4px 10px; font-size: 12px; font-weight: 600; min-width: 36px;
  text-align: center; border-radius: 6px;
  border: 1px solid rgba(120,130,255,0.3);
}
.tb-level.active {
  background: rgba(80, 100, 255, 0.25);
  color: var(--cyan);
  border-color: rgba(0, 224, 255, 0.4);
  box-shadow: 0 0 8px rgba(0,224,255,0.15);
}
.tb-level:not(.active) {
  background: rgba(40, 40, 60, 0.3);
  color: var(--text-dim);
  border-color: rgba(120,130,255,0.1);
  opacity: 0.5;
}

/* Legend */
.legend {
  position: fixed; bottom: 16px; left: 16px; z-index: 10;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  font-size: 12px; min-width: 180px;
}
.legend-title { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--text-dim); }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.legend-line { width: 20px; height: 2px; flex-shrink: 0; }

/* Stats */
.stats {
  position: fixed; bottom: 16px; right: 16px; z-index: 10;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 10px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  font-size: 12px; color: var(--text-dim);
  display: flex; gap: 16px;
}
.stats span { color: var(--cyan); font-weight: 600; }

/* Detail Panel */
.detail-panel {
  position: fixed; top: 0; right: 0; width: 380px; height: 100%; z-index: 20;
  background: var(--glass); backdrop-filter: blur(20px);
  border-left: 1px solid var(--glass-border);
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
  transform: translateX(100%); transition: transform 0.3s ease;
  overflow-y: auto; padding: 20px;
}
.detail-panel.open { transform: translateX(0); }
.detail-close {
  position: absolute; top: 16px; right: 16px;
  background: rgba(60,60,120,0.3); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; width: 30px; height: 30px;
  font-size: 16px; cursor: pointer; transition: all 0.2s;
}
.detail-close:hover { background: rgba(255,87,119,0.3); }
.detail-section { margin-bottom: 16px; }
.detail-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.detail-value { font-size: 14px; color: var(--text-main); line-height: 1.6; }
.detail-name { font-size: 20px; font-weight: 600; color: var(--text-bright); line-height: 1.3; margin-bottom: 4px; }
.detail-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.badge {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  font-weight: 500; white-space: nowrap;
}
.badge-zhongdian { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid rgba(255,215,0,0.3); }
.badge-nandian { background: rgba(255,87,119,0.15); color: var(--red); border: 1px solid rgba(255,87,119,0.3); }
.badge-kaodian { background: rgba(0,224,255,0.15); color: var(--cyan); border: 1px solid rgba(0,224,255,0.3); }
.badge-sizheng { background: rgba(255,110,199,0.15); color: var(--pink); border: 1px solid rgba(255,110,199,0.3); }
.badge-custom { background: rgba(157,107,255,0.15); color: var(--purple); border: 1px solid rgba(157,107,255,0.3); }
.badge-type-cat { background: rgba(68,136,255,0.15); color: var(--blue); border: 1px solid rgba(68,136,255,0.3); }
.badge-type-kp { background: rgba(66,255,170,0.15); color: var(--green); border: 1px solid rgba(66,255,170,0.3); }

.detail-input, .detail-textarea, .detail-select {
  width: 100%; background: rgba(20,20,50,0.6); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; padding: 8px 12px;
  font-size: 13px; font-family: inherit; outline: none; transition: all 0.2s;
}
.detail-input:focus, .detail-textarea:focus, .detail-select:focus {
  border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,224,255,0.15);
}
.detail-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.detail-select option { background: var(--bg-mid); }

.rel-list { margin-top: 8px; }
.rel-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin: 4px 0;
  background: rgba(30,30,60,0.4); border-radius: 8px; border: 1px solid rgba(120,130,255,0.1);
  font-size: 13px;
}
.rel-type { font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
.rel-del {
  margin-left: auto; background: none; border: none; color: var(--red);
  cursor: pointer; font-size: 14px; opacity: 0.6; transition: opacity 0.2s;
}
.rel-del:hover { opacity: 1; }

.detail-btn {
  width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 14px; font-family: inherit; transition: all 0.2s; margin-top: 8px;
}
.btn-save { background: rgba(0,224,255,0.15); color: var(--cyan); border: 1px solid rgba(0,224,255,0.3); }
.btn-save:hover { background: rgba(0,224,255,0.25); box-shadow: 0 0 12px rgba(0,224,255,0.2); }
.btn-delete { background: rgba(255,87,119,0.1); color: var(--red); border: 1px solid rgba(255,87,119,0.2); }
.btn-delete:hover { background: rgba(255,87,119,0.2); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--glass); backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 24px; width: 460px; max-width: 90vw; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 60px rgba(0,0,0,0.6);
}
.modal-title { font-size: 18px; font-weight: 600; color: var(--text-bright); margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions button { flex: 1; }

/* SVG node styles */
.node-circle { cursor: pointer; transition: filter 0.3s; }
.node-circle:hover { filter: brightness(1.4); }
.orbit-ring { fill: none; stroke: rgba(120,130,255,0.05); stroke-width: 1; }
.galaxy-core { pointer-events: none; }
.galaxy-group { transition: none; }
.node-label {
  font-size: 12px; fill: var(--text-main); pointer-events: none;
  text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 3px rgba(0,0,0,0.9);
  user-select: none;
}
.node-label.dimmed { opacity: 0.2; }
.link-line { transition: stroke-opacity 0.3s; }
.link-line.dimmed { stroke-opacity: 0.05; }
.node-group.dimmed { opacity: 0.2; }
.node-group.highlighted { opacity: 1; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
  z-index: 100; background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 24px; font-size: 14px; color: var(--text-bright);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(66,255,170,0.4); color: var(--green); }
.toast.error { border-color: rgba(255,87,119,0.4); color: var(--red); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(120,130,255,0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(120,130,255,0.4); }

/* Tooltip */
.node-tooltip {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 14px; font-size: 12px; color: var(--text-main);
  max-width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: none; line-height: 1.5;
}
.node-tooltip.show { display: block; }
.tt-name { font-size: 14px; font-weight: 600; color: var(--text-bright); margin-bottom: 4px; }
.tt-desc { color: var(--text-dim); font-size: 11px; }

@media (max-width: 600px) {
  .toolbar { max-width: calc(100% - 32px); }
  .detail-panel { width: 100%; }
  .legend { display: none; }
}
</style>

    'Hiragino Sans GB', Roboto, sans-serif;

  --transition-normal: 0.2s ease;
  --transition-slow: 0.3s ease;

  --z-confirm: 1150;

ype": "概念性", "desc": "由厚度远小于其他两个方向尺度的平板或曲壳组成的结构，又称薄壁结构。"}, {"id": "n18", "name": "实体结构", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "三个方向的尺度相近的结构，因形同块状，又称为块体结构。"}, {"id": "n19", "name": "计算简图", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "对实际结构作合理简化的过程，是结构力学分析的第一步。"}, {"id": "n20", "name": "体系简化", "type": "知识点", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "将空间结构简化为平面杆系结构，便于计算分析。"}, {"id": "n21", "name": "杆件简化", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "将实际杆件简化为轴线（中心线），用杆轴线代表杆件进行计算。"}, {"id": "n22", "name": "连接简化", "type": "知识点", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "将杆件间的连接简化为铰结点或刚结点，将支承简化为各类支座。"}, {"id": "n23", "name": "材料简化", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "假设材料为连续、均匀、各向同性、线弹性，以简化计算。"}, {"id": "n24", "name": "荷载简化", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "将实际作用于结构上的外力简化为集中力、分布力等理想化形式。"}, {"id": "n25", "name": "结点与支座", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "介绍结点和支座的基本类型及其约束特性，是结构计算简图的核心内容。"}, {"id": "n26", "name": "结点类型", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "结点是杆件与杆件连接部位的简化，分为铰结点和刚结点两种基本形式。"}, {"id": "n27", "name": "铰结点", "type": "知识点", "level": 4, "labels": ["考点", "重点"], "ktype": "概念性", "desc": "允许杆件绕结点中心自由转动，不允许相对移动；能传递力但不传递力矩。常见于钢构件连接中的螺栓连接。"}, {"id": "n28", "name": "刚结点", "type": "知识点", "level": 4, "labels": ["考点", "重点"], "ktype": "概念性", "desc": "不允许杆件之间发生相对转动和相对移动；既能传递力也能传递力矩。常见于混凝土构件的现浇连接。"}, {"id": "n29", "name": "支座类型", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "支座是将结构与支承面连接以限制结构运动的装置，支座反力是外力作用下支座产生的反作用力。"}, {"id": "n30", "name": "可动铰支座", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "不允许沿链杆（垂直于支承面）方向移动，允许沿平行于支承面方向移动和绕圆柱铰转动。只有一个竖向反力。"}, {"id": "n31", "name": "固定铰支座", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "不允许沿水平和竖向移动，允许绕圆柱铰转动。有水平反力和竖向反力两个分量。"}, {"id": "n32", "name": "固定支座", "type": "知识点", "level": 4, "labels": ["考点", "难点"], "ktype": "概念性", "desc": "不允许支承处发生任一方向的移动和转动。有三个反力分量：水平反力、竖向反力和反力矩。"}, {"id": "n33", "name": "滑动支座", "type": "知识点", "level": 4, "labels": ["考点", "难点"], "ktype": "概念性", "desc": "不允许支承处发生转动和沿一个方向的移动，允许沿另一方向自由滑动。有两个反力分量：一个力和一个力矩。"}, {"id": "n34", "name": "结构与荷载", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "介绍杆系结构的五大类型和荷载的四种分类维度。"}, {"id": "n35", "name": "杆系分类", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "按受力特点和组成方式将杆系结构分为五类。"}, {"id": "n36", "name": "梁", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "由受弯杆件沿轴向延伸或连接而成的结构，主要承受弯矩和剪力。"}, {"id": "n37", "name": "刚架", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "由若干梁、柱杆件相互刚接而成的结构，杆件同时承受弯矩、剪力和轴力。"}, {"id": "n38", "name": "桁架", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "由若干直杆相互铰接而成的结构，杆件主要承受轴力。"}, {"id": "n39", "name": "拱", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "杆轴为曲线，且在竖向荷载作用下支座会产生水平反力（推力），以轴压力为主要受力特征。"}, {"id": "n40", "name": "组合结构", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "由桁架杆和梁式杆等不同类型杆件组合而成的结构，不同杆件受力特征不同。"}, {"id": "n41", "name": "荷载分类", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "荷载是指主动作用于结构上的外力，按不同维度进行分类。"}, {"id": "n42", "name": "恒载与活载", "type": "知识点", "level": 4, "labels": ["考点"], "ktype": "概念性", "desc": "按作用时间久暂分类：恒载是长期作用在结构上的不变荷载（如自重），活载是暂时作用在结构上的可变荷载（如人群、车辆）。"}, {"id": "n43", "name": "固定与移动", "type": "知识点", "level": 4, "labels": [], "ktype": "概念性", "desc": "按作用位置是否改变分类：固定荷载作用位置固定不变，移动荷载作用位置可以改变（如桥梁上的车辆荷载）。"}, {"id": "n44", "name": "直接与间接", "type": "知识点", "level": 4, "labels": [], "ktype": "概念性", "desc": "按是否直接作用于研究的结构对象分类：直接荷载直接作用于结构上，间接荷载通过中间介质传递到结构上。"}, {"id": "n45", "name": "静力与动力", "type": "知识点", "level": 4, "labels": [], "ktype": "概念性", "desc": "按作用效应中是否包含不可忽略的惯性力分类：静力荷载缓慢施加不产生显著加速度，动力荷载引起结构显著振动。"}, {"id": "n46", "name": "分析条件", "type": "分类", "level": 2, function loadData() {

}

// ======================== STARFIELD ========================
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let stars = [];

function initStarfield() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  stars = [];
  const count = Math.floor((starCanvas.width * starCanvas.height) / 6000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.2,
      tw: Math.random() * 0.02 + 0.005,
      tp: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05,
    });
  }
}

function animateStars() {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  for (const s of stars) {
    s.tp += s.tw;
    const a = s.a * (0.6 + 0.4 * Math.sin(s.tp));
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0) s.x = starCanvas.width;
    if (s.x > starCanvas.width) s.x = 0;
    if (s.y < 0) s.y = starCanvas.height;
    if (s.y > starCanvas.height) s.y = 0;
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(200,210,255,${a})`;
    starCtx.fill();
    if (s.r > 0.8) {
      starCtx.beginPath();
      starCtx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      starCtx.fillStyle = `rgba(150,170,255,${a*0.08})`;
      starCtx.fill();
    }
  }
  requestAnimationFrame(animateStars);
}

window.addEventListener('resize', initStarfield);

const nodeRadiusMap = { 1: 22, 2: 16, 3: 12, 4: 8 };
const linkColorMap = {
  '包含': '#5577ff',
  '前置': '#ffa030',
  '后置': '#50ff80',
  '关联': '#d050ff',
};
const linkDashMap = {
  '包含': '5,3',
  '前置': '7,4',
  '后置': '7,4',
  '关联': '2,5',
};

function initGraph() {
  const container = document.getElementById('graph-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Resolve link source/target from string IDs to node object references
  const nodeMap = {};
  graphData.nodes.forEach(n => { nodeMap[n.id] = n; });
  graphData.links.forEach(l => {
    if (typeof l.source === 'string') l.source = nodeMap[l.source];
    if (typeof l.target === 'string') l.target = nodeMap[l.target];
  });

  d3.select('#graph-svg').selectAll('*').remove();

  svg = d3.select('#graph-svg')
    .attr('viewBox', `0 0 ${width} ${height}`);

  // Defs for gradients
  const defs = svg.append('defs');

  graphData.nodes.forEach(node => {
    const colors = nodeColorMap[node.level] || nodeColorMap[4];
    const r = nodeRadiusMap[node.level] || 8;
    const gradId = `grad-${node.id}`;
    const grad = defs.append('radialGradient').attr('id', gradId);
    grad.append('stop').attr('offset', '0%').attr('stop-color', colors.core).attr('stop-opacity', 1);
    grad.append('stop').attr('offset', '50%').attr('stop-color', colors.glow).attr('stop-opacity', 0.8);
    grad.append('stop').attr('offset', '100%').attr('stop-color', colors.glow).attr('stop-opacity', 0);
    node._gradId = gradId;
    node._r = r;
    node._colors = colors;
  });

  // Glow filter
  const filter = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
  filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'blur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');

  // Central galaxy glow gradient
  galaxyCenterX = width / 2;
  galaxyCenterY = height / 2;
  const centerGrad = defs.append('radialGradient').attr('id', 'centerGlow');
  centerGrad.append('stop').attr('offset', '0%').attr('stop-color', '#4488ff').attr('stop-opacity', 0.15);
  centerGrad.append('stop').attr('offset', '40%').attr('stop-color', '#9d6bff').attr('stop-opacity', 0.06);
  centerGrad.append('stop').attr('offset', '100%').attr('stop-color', '#9d6bff').attr('stop-opacity', 0);

  gMain = svg.append('g').attr('class', 'main-group');

  // Orbit ring for L2 around galaxy center (the "solar" orbit)
  const orbitGroup = gMain.append('g').attr('class', 'orbit-rings');
  orbitGroup.append('circle')
    .attr('class', 'orbit-ring')
    .attr('cx', galaxyCenterX).attr('cy', galaxyCenterY)
    .attr('r', 170)
    .attr('stroke-dasharray', '2,10');
  // Central glow
  orbitGroup.append('circle')
    .attr('class', 'galaxy-core')
    .attr('cx', galaxyCenterX).attr('cy', galaxyCenterY)
    .attr('r', 80)
    .attr('fill', 'url(#centerGlow)');

  // Galaxy rotation wrapper
  gGalaxy = gMain.append('g').attr('class', 'galaxy-group');

  // Links
  gLink = gGalaxy.append('g').attr('class', 'links')
    .selectAll('line')
    .data(graphData.links)
    .enter().append('line')
    .attr('class', 'link-line')
    .attr('stroke', d => linkColorMap[d.type] || linkColorMap['包含'])
    .attr('stroke-width', d => d.type === '包含' ? 1.5 : 2.5)
    .attr('stroke-opacity', d => d.type === '包含' ? 0.7 : 0.85)
    .attr('stroke-dasharray', d => linkDashMap[d.type] || '5,3')
    .style('cursor', 'pointer')
    .on('click', function(event, d) {
      event.stopPropagation();
      if (confirm(`删除该"${d.type}"关系？`)) {
        graphData.links = graphData.links.filter(l =>
          !(l.source.id === d.source.id && l.target.id === d.target.id && l.type === d.type));
        saveData();
        initGraph();
        showToast('关系已删除', 'success');
      }
    });

  // Nodes
  gNode = gGalaxy.append('g').attr('class', 'nodes')
    .selectAll('g')
    .data(graphData.nodes)
    .enter().append('g')
    .attr('class', 'node-group')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', dragStarted)
      .on('drag', dragged)
      .on('end', dragEnded));

  // Outer glow ring
  gNode.append('circle')
    .attr('class', 'node-glow')
    .attr('r', d => d._r * 2.2)
    .attr('fill', d => `url(#${d._gradId})`)
    .attr('opacity', 0.35);

  // Main circle
  gNode.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => d._r)
    .attr('fill', d => `url(#${d._gradId})`)
    .attr('stroke', d => d._colors.core)
    .attr('stroke-width', 1.5)
    .attr('filter', 'url(#glow)');

  // Label
  gNode.append('text')
    .attr('class', 'node-label')
    .attr('dy', d => d._r + 16)
    .attr('text-anchor', 'middle')
    .text(d => d.name.length > 16 ? d.name.substring(0, 14) + '…' : d.name)
    .style('display', showLabels ? 'block' : 'none');

  // Badge indicators (small dots for labels)
  gNode.each(function(d) {
    if (d.labels && d.labels.length > 0) {
      const badgeColors = { '重点': '#ffd700', '难点': '#ff5577', '考点': '#00e0ff', '课程思政': '#ff6ec7' };
      const g = d3.select(this);
      d.labels.forEach((label, i) => {
        const angle = (i / d.labels.length) * Math.PI * 2 - Math.PI / 2;
        const bx = Math.cos(angle) * (d._r + 5);
        const by = Math.sin(angle) * (d._r + 5);
        g.append('circle')
          .attr('class', 'badge-dot')
          .attr('cx', bx).attr('cy', by)
          .attr('r', 3)
          .attr('fill', badgeColors[label] || '#9d6bff')
          .attr('stroke', 'rgba(0,0,0,0.4)')
          .attr('stroke-width', 0.5);
      });
    }
  });

  // Apply level visibility
  applyLevelVisibility();

  // Node events
  gNode.on('mouseenter', function(event, d) {
    showTooltip(event, d);
    highlightPropagation(d);
    if (galaxyRotating) { wasRotatingBeforeHover = true; galaxyRotating = false; }
  })
  .on('mousemove', function(event) {
    moveTooltip(event);
  })
  .on('mouseleave', function() {
    hideTooltip();
    unhighlight();
    if (wasRotatingBeforeHover) { galaxyRotating = true; wasRotatingBeforeHover = false; }
  })
  .on('click', function(event, d) {
    event.stopPropagation();
    selectedNode = d;
    showDetail(d);
  });

  // Click empty space
  svg.on('click', function() {
    closeDetail();
    selectedNode = null;
  });

  // Zoom
  let currentZoomTransform = d3.zoomIdentity;
  zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => {
      currentZoomTransform = event.transform;
      gMain.attr('transform', event.transform);
    });
  svg.call(zoomBehavior);

  // Radial tree layout (planets orbiting star)
  calculateRadialLayout();
  updateGraphPositions();

  updateStats();
}

// ======================== RADIAL LAYOUT (Nested Orbital) ========================
function calculateRadialLayout() {
  const cx = galaxyCenterX;
  const cy = galaxyCenterY;

  // Build parent-children tree from "包含" links
  const childrenMap = {};
  graphData.links.forEach(l => {
    const s = (l.source.id || l.source);
    const t = (l.target.id || l.target);
    if (l.type === '包含') {
      if (!childrenMap[s]) childrenMap[s] = [];
      childrenMap[s].push(t);
    }
  });

  // Find root node (L1)
  const root = graphData.nodes.find(n => n.level === 1);
  if (!root) return;

  // Count total descendants for angular weighting
  function countDescendants(nodeId) {
    const children = childrenMap[nodeId] || [];
    let count = children.length;
    children.forEach(cid => { count += countDescendants(cid); });
    return Math.max(count, 1);
  }

  // Orbit radius FROM PARENT (not from galaxy center)
  // L2 orbits L1 at 170px, L3 orbits L2 at 135px, L4 orbits L3 at 105px
  const orbitRadius = { 2: 170, 3: 150, 4: 165 };

  // Recursive layout: parent is the orbital center for its children
  function layoutNode(nodeId, angleStart, angleEnd, depth, parentX, parentY) {
    const node = graphData.nodes.find(n => n.id === nodeId);
    if (!node) return;

    const children = childrenMap[nodeId] || [];

    if (depth === 0) {
      // Root (L1) at galaxy center - the "sun"
      node.x = cx;
      node.y = cy;
    } else {
      // Position on orbit circle around PARENT (parent is the "mother star")
      const midAngle = (angleStart + angleEnd) / 2;
      const r = orbitRadius[node.level] || 120;
      node.x = parentX + Math.cos(midAngle) * r;
      node.y = parentY + Math.sin(midAngle) * r;
    }

    // Assign angular sectors to children (weighted by descendant count)
    if (children.length > 0) {
      const totalRange = angleEnd - angleStart;
      const weights = children.map(cid => countDescendants(cid));
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let currentAngle = angleStart;
      children.forEach((cid, i) => {
        const sectorSize = totalRange * (weights[i] / totalWeight);
        const childStart = currentAngle;
        const childEnd = currentAngle + sectorSize;
        // Add small gap between sectors to reduce visual overlap
        const gap = Math.min(sectorSize * 0.05, 0.03);
        layoutNode(cid, childStart + gap, childEnd - gap, depth + 1, node.x, node.y);
        currentAngle = childEnd;
      });
    }
  }

  // Start layout from root with full circle
  // Offset by -PI/2 so first child is at top
  layoutNode(root.id, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI, 0, cx, cy);

  // Handle orphan nodes (not connected via "包含" to root)
  const placedIds = new Set();
  function collectPlaced(nodeId) {
    placedIds.add(nodeId);
    (childrenMap[nodeId] || []).forEach(cid => collectPlaced(cid));
  }
  collectPlaced(root.id);

  let orphanIndex = 0;
  const orphans = graphData.nodes.filter(n => !placedIds.has(n.id));
  orphans.forEach(n => {
    const angle = (orphanIndex / Math.max(orphans.length, 1)) * 2 * Math.PI - Math.PI / 2;
    const r = (n.level || 2) * 130;
    n.x = cx + Math.cos(angle) * r;
    n.y = cy + Math.sin(angle) * r;
    orphanIndex++;
  });
}

// ======================== GALAXY ROTATION ========================
function updateGraphPositions() {
  const cosA = Math.cos(galaxyAngle);
  const sinA = Math.sin(galaxyAngle);
  const cx = galaxyCenterX, cy = galaxyCenterY;
  gLink
    .attr('x1', d => cx + (d.source.x - cx) * cosA - (d.source.y - cy) * sinA)
    .attr('y1', d => cy + (d.source.x - cx) * sinA + (d.source.y - cy) * cosA)
    .attr('x2', d => cx + (d.target.x - cx) * cosA - (d.target.y - cy) * sinA)
    .attr('y2', d => cy + (d.target.x - cx) * sinA + (d.target.y - cy) * cosA);
  gNode.attr('transform', d => {
    const rx = cx + (d.x - cx) * cosA - (d.y - cy) * sinA;
    const ry = cy + (d.x - cx) * sinA + (d.y - cy) * cosA;
    return `translate(${rx},${ry})`;
  });
}

function animateGalaxy() {
  if (galaxyRotating) {
    galaxyAngle += galaxySpeed;
    updateGraphPositions();
  }
  requestAnimationFrame(animateGalaxy);
}

function toggleRotation() {
  galaxyRotating = !galaxyRotating;
  document.getElementById('toggle-rotation-btn').textContent = galaxyRotating ? '暂停旋转' : '开启旋转';
}

function dragStarted(event, d) {
  // No simulation; just allow dragging
}
function dragged(event, d) {
  const cosA = Math.cos(-galaxyAngle);
  const sinA = Math.sin(-galaxyAngle);
  const dx = event.x - galaxyCenterX;
  const dy = event.y - galaxyCenterY;
  d.x = galaxyCenterX + dx * cosA - dy * sinA;
  d.y = galaxyCenterY + dx * sinA + dy * cosA;
  updateGraphPositions();
}
function dragEnded(event, d) {
  // Node stays where dropped
}

// ======================== HIGHLIGHT (Direct Neighbors) ========================
function highlightPropagation(node) {
  // Find only DIRECTLY connected nodes (1-hop neighbors)
  const connected = new Set([node.id]);
  graphData.links.forEach(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    if (s === node.id) connected.add(t);
    if (t === node.id) connected.add(s);
  });

  // Nodes: show direct neighbors (even if level hidden), dim everything else
  gNode
    .style('display', d => {
      if (connected.has(d.id)) return null;              // hovered node + direct neighbors: always show
      return hiddenLevels.has(d.level) ? 'none' : null;  // others: respect level visibility
    })
    .style('opacity', d => connected.has(d.id) ? 1 : 0.12)
    .style('transition', 'opacity 0.3s ease');

  // Links: show links touching the hovered node, dim the rest
  gLink
    .style('display', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      if (s === node.id || t === node.id) return null;   // links touching hovered node: always show
      const sLevel = d.source.level;
      const tLevel = d.target.level;
      return (hiddenLevels.has(sLevel) || hiddenLevels.has(tLevel)) ? 'none' : null;
    })
    .style('opacity', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      return (s === node.id || t === node.id) ? 1 : 0.06;
    })
    .style('transition', 'opacity 0.3s ease');
}

function unhighlight() {
  gNode
    .style('opacity', null)
    .style('transition', null);
  gLink
    .style('opacity', null)
    .style('transition', null);
  applyLevelVisibility();
}

// ======================== TOOLTIP ========================
const tooltip = document.getElementById('tooltip');
function showTooltip(event, d) {
  const badgeHtml = (d.labels || []).map(l => {
    const cls = l === '重点' ? 'badge-zhongdian' : l === '难点' ? 'badge-nandian' :
                l === '考点' ? 'badge-kaodian' : l === '课程思政' ? 'badge-sizheng' : 'badge-custom';
    return `<span class="badge ${cls}" style="font-size:10px;padding:1px 6px">${l}</span>`;
  }).join(' ');
  const typeBadge = d.type === '分类' ?
    `<span class="badge badge-type-cat" style="font-size:10px;padding:1px 6px">分类</span>` :
    `<span class="badge badge-type-kp" style="font-size:10px;padding:1px 6px">知识点</span>`;
  tooltip.innerHTML = `
    <div class="tt-name">${d.name}</div>
    <div style="margin:4px 0">${typeBadge} ${badgeHtml}</div>
    ${d.ktype ? `<div style="font-size:11px;color:var(--text-dim)">分类: ${d.ktype}</div>` : ''}
    ${d.desc ? `<div class="tt-desc">${d.desc.substring(0, 100)}${d.desc.length > 100 ? '...' : ''}</div>` : ''}
  `;
  tooltip.classList.add('show');
  moveTooltip(event);
}
function moveTooltip(event) {
  const x = event.clientX + 14;
  const y = event.clientY + 14;
  const tw = tooltip.offsetWidth;
  const th = tooltip.offsetHeight;
  tooltip.style.left = (x + tw > window.innerWidth ? x - tw - 28 : x) + 'px';
  tooltip.style.top = (y + th > window.innerHeight ? y - th - 28 : y) + 'px';
}
function hideTooltip() { tooltip.classList.remove('show'); }

// ======================== DETAIL PANEL ========================
function showDetail(node) {
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  const typeBadge = node.type === '分类' ?
    `<span class="badge badge-type-cat">分类</span>` :
    `<span class="badge badge-type-kp">知识点</span>`;
  const labelBadges = (node.labels || []).map(l => {
    const cls = l === '重点' ? 'badge-zhongdian' : l === '难点' ? 'badge-nandian' :
                l === '考点' ? 'badge-kaodian' : l === '课程思政' ? 'badge-sizheng' : 'badge-custom';
    return `<span class="badge ${cls}">${l}</span>`;
  }).join('');

  // Find relationships
  const rels = graphData.links.filter(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    return s === node.id || t === node.id;
  }).map(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    const otherId = s === node.id ? t : s;
    const otherNode = graphData.nodes.find(n => n.id === otherId);
    const otherName = otherNode ? otherNode.name : otherId;
    const direction = s === node.id ? '→' : '←';
    const typeColor = l.type === '前置' ? 'var(--orange)' : l.type === '后置' ? 'var(--green)' :
                      l.type === '关联' ? 'var(--purple)' : 'var(--blue)';
    return `<div class="rel-item">
      <span class="rel-type" style="background:${typeColor}22;color:${typeColor}">${l.type}</span>
      <span>${direction} ${otherName}</span>
      <button class="rel-del" onclick="deleteLink('${s}','${t}','${l.type}')">×</button>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="detail-section">
      <div class="detail-name">${node.name}</div>
      <div class="detail-badges">${typeBadge} ${labelBadges}</div>
    </div>

    <div class="detail-section">
      <div class="detail-label">节点名称</div>
      <input class="detail-input" id="edit-name" value="${node.name.replace(/"/g, '&quot;')}">
    </div>

    <div class="detail-section">
      <div class="detail-label">节点类型</div>
      <select class="detail-select" id="edit-type">
        <option value="分类" ${node.type === '分类' ? 'selected' : ''}>分类</option>
        <option value="知识点" ${node.type === '知识点' ? 'selected' : ''}>知识点</option>
      </select>
    </div>

    <div class="detail-section">
      <div class="detail-label">层级 (1=根 2=模块 3=子类 4=知识点)</div>
      <select class="detail-select" id="edit-level">
        <option value="1" ${node.level === 1 ? 'selected' : ''}>1 - 根节点</option>
        <option value="2" ${node.level === 2 ? 'selected' : ''}>2 - 模块</option>
        <option value="3" ${node.level === 3 ? 'selected' : ''}>3 - 子分类</option>
        <option value="4" ${node.level === 4 ? 'selected' : ''}>4 - 知识点</option>
      </select>
    </div>

    <div class="detail-section">
      <div class="detail-label">标签 (分号分隔)</div>
      <input class="detail-input" id="edit-labels" value="${(node.labels || []).join(';')}" placeholder="重点;难点;考点">
    </div>

    <div class="detail-section">
      <div class="detail-label">知识点分类</div>
      <select class="detail-select" id="edit-ktype">
        <option value="" ${!node.ktype ? 'selected' : ''}>无</option>
        <option value="事实性" ${node.ktype === '事实性' ? 'selected' : ''}>事实性</option>
        <option value="概念性" ${node.ktype === '概念性' ? 'selected' : ''}>概念性</option>
        <option value="程序性" ${node.ktype === '程序性' ? 'selected' : ''}>程序性</option>
        <option value="元认知" ${node.ktype === '元认知' ? 'selected' : ''}>元认知</option>
      </select>
    </div>

    <div class="detail-section">
      <div class="detail-label">节点说明</div>
      <textarea class="detail-textarea" id="edit-desc">${node.desc || ''}</textarea>
    </div>

    <div class="detail-section">
      <div class="detail-label">关系 (${rels ? '点击×删除' : '暂无'})</div>
      <div class="rel-list">${rels || '<div style="color:var(--text-dim);font-size:12px;padding:4px">暂无关系</div>'}</div>
    </div>

    <button class="detail-btn btn-save" onclick="saveNodeEdit('${node.id}')">保存修改</button>
    <button class="detail-btn btn-delete" onclick="deleteNode('${node.id}')">删除此节点</button>
  `;
  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

function saveNodeEdit(id) {
  const node = graphData.nodes.find(n => n.id === id);
  if (!node) return;
  node.name = document.getElementById('edit-name').value.trim() || node.name;
  node.type = document.getElementById('edit-type').value;
  node.level = parseInt(document.getElementById('edit-level').value);
  const labelsStr = document.getElementById('edit-labels').value.trim();
  node.labels = labelsStr ? labelsStr.split(';').map(s => s.trim()).filter(s => s) : [];
  node.ktype = document.getElementById('edit-ktype').value;
  node.desc = document.getElementById('edit-desc').value.trim();
  saveData();
  initGraph();
  showDetail(node);
  showToast('节点已保存', 'success');
}

function deleteNode(id) {
  const node = graphData.nodes.find(n => n.id === id);
  if (!node) return;
  if (!confirm(`确定删除"${node.name}"？相关关系也将一并删除。`)) return;
  graphData.nodes = graphData.nodes.filter(n => n.id !== id);
  graphData.links = graphData.links.filter(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    return s !== id && t !== id;
  });
  saveData();
  initGraph();
  closeDetail();
  showToast('节点已删除', 'success');
}

function deleteLink(sourceId, targetId, type) {
  graphData.links = graphData.links.filter(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    return !(s === sourceId && t === targetId && l.type === type);
  });
  saveData();
  initGraph();
  if (selectedNode) showDetail(selectedNode);
  showToast('关系已删除', 'success');
}

    <div class="modal-field">
      <label>父节点（包含关系）</label>
      <select class="detail-select" id="add-parent">
        <option value="">无（作为根节点）</option>
        ${parentOptions}
      </select>
    </div>
    <div class="modal-field">
      <label>标签（分号分隔）</label>
      <input class="detail-input" id="add-labels" placeholder="重点;难点;考点">
    </div>
    <div class="modal-field">
      <label>知识点分类</label>
      <select class="detail-select" id="add-ktype">
        <option value="">无</option>
        <option value="事实性">事实性</option>
        <option value="概念性">概念性</option>
        <option value="程序性">程序性</option>
        <option value="元认知">元认知</option>
      </select>
    </div>
    <div class="modal-field">
      <label>节点说明</label>
      <textarea class="detail-textarea" id="add-desc" placeholder="输入节点说明..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="detail-btn" style="background:rgba(60,60,120,0.3);color:var(--text-dim);border:1px solid rgba(120,130,255,0.2)" onclick="closeModal()">取消</button>
      <button class="detail-btn btn-save" onclick="confirmAddNode()">添加</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('add-name').focus();
}

function confirmAddNode() {
  const name = document.getElementById('add-name').value.trim();
  if (!name) { showToast('请输入节点名称', 'error'); return; }
  const type = document.getElementById('add-type').value;
  const parentId = document.getElementById('add-parent').value;
  const labelsStr = document.getElementById('add-labels').value.trim();
  const ktype = document.getElementById('add-ktype').value;
  const desc = document.getElementById('add-desc').value.trim();

  let level = 1;
  if (parentId) {
    const parent = graphData.nodes.find(n => n.id === parentId);
    if (parent) level = parent.level + 1;
  }

  const newId = 'n' + Date.now();
  const newNode = {
    id: newId, name, type, level,
    labels: labelsStr ? labelsStr.split(';').map(s => s.trim()).filter(s => s) : [],
    ktype, desc,
    x: window.innerWidth / 2 + (Math.random() - 0.5) * 100,
    y: window.innerHeight / 2 + (Math.random() - 0.5) * 100,
  };
  graphData.nodes.push(newNode);
  if (parentId) {
    graphData.links.push({ source: parentId, target: newId, type: '包含' });
  }
  saveData();
  initGraph();
  closeModal();
  showToast('节点已添加', 'success');
}

// ======================== ADD LINK MODAL ========================
function openAddLinkModal() {
  const nodeOptions = graphData.nodes.map(n =>
    `<option value="${n.id}">${n.name}</option>`
  ).join('');

  document.getElementById('modal-content').innerHTML = `
    <div class="modal-title">新增关系</div>
    <div class="modal-field">
      <label>起始节点 *</label>
      <select class="detail-select" id="link-source">${nodeOptions}</select>
    </div>
    <div class="modal-field">
      <label>关系类型</label>
      <select class="detail-select" id="link-type">
        <option value="包含">包含（父子层级）</option>
        <option value="前置">前置（A是B的前置）</option>
        <option value="后置">后置（A的后继是B）</option>
        <option value="关联">关联（相互关联）</option>
      </select>
    </div>
    <div class="modal-field">
      <label>目标节点 *</label>
      <select class="detail-select" id="link-target">${nodeOptions}</select>
    </div>
    <div class="modal-actions">
      <button class="detail-btn" style="background:rgba(60,60,120,0.3);color:var(--text-dim);border:1px solid rgba(120,130,255,0.2)" onclick="closeModal()">取消</button>
      <button class="detail-btn btn-save" onclick="confirmAddLink()">添加</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

function confirmAddLink() {
  const source = document.getElementById('link-source').value;
  const target = document.getElementById('link-target').value;
  const type = document.getElementById('link-type').value;
  if (source === target) { showToast('起始和目标不能相同', 'error'); return; }
  const exists = graphData.links.some(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    return s === source && t === target && l.type === type;
  });
  if (exists) { showToast('该关系已存在', 'error'); return; }
  graphData.links.push({ source, target, type });
  saveData();
  initGraph();
  closeModal();
  showToast('关系已添加', 'success');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ======================== LEVEL VISIBILITY ========================
function toggleLevel(level) {
  if (hiddenLevels.has(level)) {
    hiddenLevels.delete(level);
  } else {
    hiddenLevels.add(level);
  }
  // Update button visual state
  document.querySelectorAll('.tb-level').forEach(btn => {
    const lv = parseInt(btn.dataset.level);
    btn.classList.toggle('active', !hiddenLevels.has(lv));
  });
  applyLevelVisibility();
}

function applyLevelVisibility() {
  if (!gNode) return;
  // Hide/show nodes based on their level
  gNode.style('display', d => hiddenLevels.has(d.level) ? 'none' : null);
  // Hide/show links if either endpoint's level is hidden
  gLink.style('display', d => {
    const sLevel = d.source.level;
    const tLevel = d.target.level;
    return (hiddenLevels.has(sLevel) || hiddenLevels.has(tLevel)) ? 'none' : null;
  });
}

// ======================== SEARCH ========================
document.getElementById('search-input').addEventListener('input', function(e) {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    gNode.style('opacity', null).style('transition', null);
    gLink.style('opacity', null).style('transition', null);
    applyLevelVisibility();
    return;
  }
  const matched = new Set();
  graphData.nodes.forEach(n => {
    if (n.name.toLowerCase().includes(q) || (n.desc && n.desc.toLowerCase().includes(q))) {
      matched.add(n.id);
    }
  });
  gNode
    .style('display', d => matched.has(d.id) ? null : (hiddenLevels.has(d.level) ? 'none' : null))
    .style('opacity', d => matched.has(d.id) ? 1 : 0.12)
    .style('transition', 'opacity 0.3s ease');
  gLink
    .style('display', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      if (matched.has(s) || matched.has(t)) return null;
      const sLevel = d.source.level;
      const tLevel = d.target.level;
      return (hiddenLevels.has(sLevel) || hiddenLevels.has(tLevel)) ? 'none' : null;
    })
    .style('opacity', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      return (matched.has(s) || matched.has(t)) ? 1 : 0.08;
    })
    .style('transition', 'opacity 0.3s ease');
});

// ======================== EXPORT / IMPORT ========================
function exportJSON() {
  const exportData = {
    nodes: graphData.nodes.map(n => ({
      id: n.id, name: n.name, type: n.type, level: n.level,
      labels: n.labels || [], ktype: n.ktype || '', desc: n.desc || ''
    })),
    links: graphData.links.map(l => ({
      source: l.source.id || l.source,
      target: l.target.id || l.target,
      type: l.type
    }))
  };
  const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `知识星图_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出JSON文件', 'success');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.nodes || !data.links) throw new Error('格式错误');
      graphData = data;
      saveData();
      initGraph();
      showToast(`已导入 ${data.nodes.length} 个节点, ${data.links.length} 条关系`, 'success');
    } catch(err) {
      showToast('导入失败: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ======================== UTILITIES ========================
function resetLayout() {
  galaxyAngle = 0;
  calculateRadialLayout();
  updateGraphPositions();
  svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity);
  showToast('布局已重置', 'success');
}

function toggleLabels() {
  showLabels = !showLabels;
  d3.selectAll('.node-label').style('display', showLabels ? 'block' : 'none');
  document.getElementById('toggle-labels-btn').textContent = showLabels ? '隐藏标签' : '显示标签';
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + (type || '');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ======================== INIT ========================
loadData();
initStarfield();
animateStars();
initGraph();
animateGalaxy();

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeDetail();
    closeModal();
  }
});
</script>
