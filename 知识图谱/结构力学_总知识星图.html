<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结构力学 · 总知识星图</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
:root {
  --bg-deep: #030310;
  --bg-mid: #0a0a24;
  --glass: rgba(15, 15, 45, 0.72);
  --glass-border: rgba(120, 130, 255, 0.18);
  --text-main: #e8e8ff;
  --text-dim: #8888bb;
  --text-bright: #ffffff;
  --gold: #ffd700;
  --cyan: #00e0ff;
  --purple: #9d6bff;
  --orange: #ff8c42;
  --green: #42ffaa;
  --red: #ff5577;
  --blue: #4488ff;
  --pink: #ff6ec7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
body { background: radial-gradient(ellipse at center, var(--bg-mid) 0%, var(--bg-deep) 70%); color: var(--text-main); }

#starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#graph-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
#graph-svg { width: 100%; height: 100%; cursor: grab; }
#graph-svg:active { cursor: grabbing; }

/* Toolbar */
.toolbar {
  position: fixed; top: 16px; left: 16px; z-index: 10;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.03) inset;
  max-width: 520px;
}
.toolbar-title {
  font-size: 15px; font-weight: 600; color: var(--text-bright);
  margin-right: 8px; white-space: nowrap;
  text-shadow: 0 0 12px rgba(120,130,255,0.5);
}
.tb-btn {
  background: rgba(60, 60, 120, 0.3); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; padding: 6px 14px;
  font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  font-family: inherit;
}
.tb-btn:hover { background: rgba(80, 80, 160, 0.5); border-color: rgba(120,130,255,0.5); box-shadow: 0 0 12px rgba(100,110,255,0.3); }
.tb-btn:active { transform: scale(0.95); }
.tb-search {
  background: rgba(30, 30, 60, 0.6); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; padding: 6px 12px;
  font-size: 13px; width: 140px; outline: none; font-family: inherit;
  transition: all 0.2s;
}
.tb-search:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,224,255,0.2); width: 180px; }
.tb-search::placeholder { color: var(--text-dim); }
.tb-divider { width: 1px; height: 24px; background: rgba(120,130,255,0.15); margin: 0 4px; }
.tb-level-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
.tb-level {
  padding: 4px 10px; font-size: 12px; font-weight: 600; min-width: 36px;
  text-align: center; border-radius: 6px;
  border: 1px solid rgba(120,130,255,0.3);
}
.tb-level.active {
  background: rgba(80, 100, 255, 0.25);
  color: var(--cyan);
  border-color: rgba(0, 224, 255, 0.4);
  box-shadow: 0 0 8px rgba(0,224,255,0.15);
}
.tb-level:not(.active) {
  background: rgba(40, 40, 60, 0.3);
  color: var(--text-dim);
  border-color: rgba(120,130,255,0.1);
  opacity: 0.5;
}

/* Legend */
.legend {
  position: fixed; bottom: 16px; left: 16px; z-index: 10;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  font-size: 12px; min-width: 180px;
}
.legend-title { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-bottom: 8px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--text-dim); }
.legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
.legend-line { width: 20px; height: 2px; flex-shrink: 0; }

/* Stats */
.stats {
  position: fixed; bottom: 16px; right: 16px; z-index: 10;
  background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 14px;
  padding: 10px 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  font-size: 12px; color: var(--text-dim);
  display: flex; gap: 16px;
}
.stats span { color: var(--cyan); font-weight: 600; }

/* Detail Panel */
.detail-panel {
  position: fixed; top: 0; right: 0; width: 380px; height: 100%; z-index: 20;
  background: var(--glass); backdrop-filter: blur(20px);
  border-left: 1px solid var(--glass-border);
  box-shadow: -8px 0 40px rgba(0,0,0,0.5);
  transform: translateX(100%); transition: transform 0.3s ease;
  overflow-y: auto; padding: 20px;
}
.detail-panel.open { transform: translateX(0); }
.detail-close {
  position: absolute; top: 16px; right: 16px;
  background: rgba(60,60,120,0.3); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; width: 30px; height: 30px;
  font-size: 16px; cursor: pointer; transition: all 0.2s;
}
.detail-close:hover { background: rgba(255,87,119,0.3); }
.detail-section { margin-bottom: 16px; }
.detail-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.detail-value { font-size: 14px; color: var(--text-main); line-height: 1.6; }
.detail-name { font-size: 20px; font-weight: 600; color: var(--text-bright); line-height: 1.3; margin-bottom: 4px; }
.detail-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.badge {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  font-weight: 500; white-space: nowrap;
}
.badge-zhongdian { background: rgba(255,215,0,0.15); color: var(--gold); border: 1px solid rgba(255,215,0,0.3); }
.badge-nandian { background: rgba(255,87,119,0.15); color: var(--red); border: 1px solid rgba(255,87,119,0.3); }
.badge-kaodian { background: rgba(0,224,255,0.15); color: var(--cyan); border: 1px solid rgba(0,224,255,0.3); }
.badge-sizheng { background: rgba(255,110,199,0.15); color: var(--pink); border: 1px solid rgba(255,110,199,0.3); }
.badge-custom { background: rgba(157,107,255,0.15); color: var(--purple); border: 1px solid rgba(157,107,255,0.3); }
.badge-type-cat { background: rgba(68,136,255,0.15); color: var(--blue); border: 1px solid rgba(68,136,255,0.3); }
.badge-type-kp { background: rgba(66,255,170,0.15); color: var(--green); border: 1px solid rgba(66,255,170,0.3); }

.detail-input, .detail-textarea, .detail-select {
  width: 100%; background: rgba(20,20,50,0.6); border: 1px solid rgba(120,130,255,0.2);
  color: var(--text-main); border-radius: 8px; padding: 8px 12px;
  font-size: 13px; font-family: inherit; outline: none; transition: all 0.2s;
}
.detail-input:focus, .detail-textarea:focus, .detail-select:focus {
  border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,224,255,0.15);
}
.detail-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.detail-select option { background: var(--bg-mid); }

.rel-list { margin-top: 8px; }
.rel-item {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin: 4px 0;
  background: rgba(30,30,60,0.4); border-radius: 8px; border: 1px solid rgba(120,130,255,0.1);
  font-size: 13px;
}
.rel-type { font-size: 11px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
.rel-del {
  margin-left: auto; background: none; border: none; color: var(--red);
  cursor: pointer; font-size: 14px; opacity: 0.6; transition: opacity 0.2s;
}
.rel-del:hover { opacity: 1; }

.detail-btn {
  width: 100%; padding: 10px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 14px; font-family: inherit; transition: all 0.2s; margin-top: 8px;
}
.btn-save { background: rgba(0,224,255,0.15); color: var(--cyan); border: 1px solid rgba(0,224,255,0.3); }
.btn-save:hover { background: rgba(0,224,255,0.25); box-shadow: 0 0 12px rgba(0,224,255,0.2); }
.btn-delete { background: rgba(255,87,119,0.1); color: var(--red); border: 1px solid rgba(255,87,119,0.2); }
.btn-delete:hover { background: rgba(255,87,119,0.2); }

/* Modal */
.modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 50;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--glass); backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 24px; width: 460px; max-width: 90vw; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 60px rgba(0,0,0,0.6);
}
.modal-title { font-size: 18px; font-weight: 600; color: var(--text-bright); margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions button { flex: 1; }

/* SVG node styles */
.node-circle { cursor: pointer; transition: filter 0.3s; }
.node-circle:hover { filter: brightness(1.4); }
.orbit-ring { fill: none; stroke: rgba(120,130,255,0.05); stroke-width: 1; }
.galaxy-core { pointer-events: none; }
.galaxy-group { transition: none; }
.node-label {
  font-size: 12px; fill: var(--text-main); pointer-events: none;
  text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 3px rgba(0,0,0,0.9);
  user-select: none;
}
.node-label.dimmed { opacity: 0.2; }
.link-line { transition: stroke-opacity 0.3s; }
.link-line.dimmed { stroke-opacity: 0.05; }
.node-group.dimmed { opacity: 0.2; }
.node-group.highlighted { opacity: 1; }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
  z-index: 100; background: var(--glass); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 24px; font-size: 14px; color: var(--text-bright);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: transform 0.3s ease;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: rgba(66,255,170,0.4); color: var(--green); }
.toast.error { border-color: rgba(255,87,119,0.4); color: var(--red); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(120,130,255,0.2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(120,130,255,0.4); }

/* Tooltip */
.node-tooltip {
  position: fixed; z-index: 30; pointer-events: none;
  background: var(--glass); backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 14px; font-size: 12px; color: var(--text-main);
  max-width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  display: none; line-height: 1.5;
}
.node-tooltip.show { display: block; }
.tt-name { font-size: 14px; font-weight: 600; color: var(--text-bright); margin-bottom: 4px; }
.tt-desc { color: var(--text-dim); font-size: 11px; }

@media (max-width: 600px) {
  .toolbar { max-width: calc(100% - 32px); }
  .detail-panel { width: 100%; }
  .legend { display: none; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="toolbar">
  <span class="toolbar-title">知识星图</span>
  <input class="tb-search" id="search-input" placeholder="搜索节点..." type="text">
  <div class="tb-divider"></div>
  <span class="tb-level-label">层级</span>
  <button class="tb-btn tb-level active" data-level="0" onclick="toggleLevel(0)">L0</button>
  <button class="tb-btn tb-level active" data-level="1" onclick="toggleLevel(1)">L1</button>
  <button class="tb-btn tb-level active" data-level="2" onclick="toggleLevel(2)">L2</button>
  <button class="tb-btn tb-level active" data-level="3" onclick="toggleLevel(3)">L3</button>
  <div class="tb-divider"></div>
  <button class="tb-btn" onclick="openAddNodeModal()">+ 新增节点</button>
  <button class="tb-btn" onclick="openAddLinkModal()">+ 新增关系</button>
  <div class="tb-divider"></div>
  <button class="tb-btn" onclick="exportJSON()">导出</button>
  <button class="tb-btn" onclick="document.getElementById('import-file').click()">导入</button>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">
  <div class="tb-divider"></div>
  <button class="tb-btn" onclick="resetLayout()">重置布局</button>
  <button class="tb-btn" onclick="toggleRotation()" id="toggle-rotation-btn">暂停旋转</button>
  <button class="tb-btn" onclick="toggleLabels()" id="toggle-labels-btn">隐藏标签</button>
  <button class="tb-btn" onclick="resetData()" style="color:var(--red)">还原</button>
</div>

<div id="graph-container">
  <svg id="graph-svg"></svg>
</div>

<div class="legend">
  <div class="legend-title">图例</div>
  <div class="legend-row"><span class="legend-dot" style="background:radial-gradient(circle,#ffd700,#ff8c00);box-shadow:0 0 8px #ffd700"></span> 章节根节点</div>
  <div class="legend-row"><span class="legend-dot" style="background:radial-gradient(circle,#4488ff,#2244aa);box-shadow:0 0 6px #4488ff"></span> 分类节点</div>
  <div class="legend-row"><span class="legend-dot" style="background:radial-gradient(circle,#e8e8ff,#8888bb);box-shadow:0 0 4px #aaaaff"></span> 知识点</div>
  <div class="legend-row"><span class="legend-line" style="border-top:2px dashed #5577ff;background:none"></span> 包含</div>
  <div class="legend-row"><span class="legend-line" style="border-top:2px dashed #ffa030;background:none"></span> 前置</div>
  <div class="legend-row"><span class="legend-line" style="border-top:2px dashed #50ff80;background:none"></span> 后置</div>
  <div class="legend-row"><span class="legend-line" style="border-top:2px dotted #d050ff;background:none"></span> 关联</div>
</div>

<div class="stats" id="stats">
  节点 <span id="stat-nodes">0</span> · 关系 <span id="stat-links">0</span>
</div>

<div class="detail-panel" id="detail-panel">
  <button class="detail-close" onclick="closeDetail()">×</button>
  <div id="detail-content"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<div class="node-tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>

const INITIAL_DATA = {"nodes": [{"id": "root", "name": "结构力学", "type": "分类", "level": 0, "labels": ["重点"], "ktype": "", "desc": "结构力学课程总知识图谱。涵盖绪论、几何组成分析、静定结构内力、影响线、位移计算、力法、位移法和实用分析方法共8章内容。"}, {"id": "ch1_l1", "name": "第1章 绪论", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "结构力学课程的入门章节，介绍结构力学的研究对象、计算简图、结点与支座、结构与荷载分类以及分析条件等基础概念。"}, {"id": "ch1_n4", "name": "发展简史", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "介绍结构力学从17世纪到现代的发展历程，梳理关键历史人物及其贡献。"}, {"id": "ch1_n5", "name": "伽利略·受弯", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "1638年，伽利略提出悬臂梁受弯承载力问题，开启了材料力学和结构力学的研究先河。"}, {"id": "ch1_n6", "name": "伯努利·虚位移", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "约翰·伯努利提出了虚位移原理，为结构位移计算奠定了理论基础。"}, {"id": "ch1_n7", "name": "欧拉·压杆稳定", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "欧拉建立了压杆稳定分析理论，提出了细长压杆临界荷载的计算公式。"}, {"id": "ch1_n8", "name": "麦克斯韦·互等", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "麦克斯韦提出了位移互等定理，并给出了计算超静定桁架的一般方法。"}, {"id": "ch1_n9", "name": "卡氏定理", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "卡斯蒂利亚诺提出了卡氏第一、第二定理和最小势能原理，为结构分析提供了能量方法。"}, {"id": "ch1_n10", "name": "影响线比拟法", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "穆勒-布雷斯劳提出了绘制影响线的比拟法（穆勒-布雷斯劳准则），为移动荷载分析提供了重要工具。"}, {"id": "ch1_n11", "name": "莫尔·次弯矩", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "莫尔提出了次弯矩法（莫尔积分），用于计算结构的位移。"}, {"id": "ch1_n12", "name": "转角位移法", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "本迪克森和威尔逊提出了转角位移法，为位移法的发展奠定了基础。"}, {"id": "ch1_n13", "name": "力矩分配法", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "克罗斯提出了力矩分配法，是一种渐进求解超静定结构的实用方法。"}, {"id": "ch1_n14", "name": "矩阵位移法", "type": "知识点", "level": 3, "labels": [], "ktype": "事实性", "desc": "随着计算机技术的发展，矩阵位移法成为结构分析的主流数值方法，实现了结构分析的程序化和自动化。"}, {"id": "ch1_n15", "name": "研究对象", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "介绍结构力学的研究对象分类及课程任务。"}, {"id": "ch1_n16", "name": "杆系结构", "type": "知识点", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "由若干长度远大于横截面尺度的杆件组成的结构，是结构力学的主要研究对象。"}, {"id": "ch1_n17", "name": "板壳结构", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "由厚度远小于其他两个方向尺度的平板或曲壳组成的结构，又称薄壁结构。"}, {"id": "ch1_n18", "name": "实体结构", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "三个方向的尺度相近的结构，因形同块状，又称为块体结构。"}, {"id": "ch1_n19", "name": "计算简图", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "对实际结构作合理简化的过程，是结构力学分析的第一步。"}, {"id": "ch1_n20", "name": "体系简化", "type": "知识点", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "将空间结构简化为平面杆系结构，便于计算分析。"}, {"id": "ch1_n21", "name": "杆件简化", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "将实际杆件简化为轴线（中心线），用杆轴线代表杆件进行计算。"}, {"id": "ch1_n22", "name": "连接简化", "type": "知识点", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "将杆件间的连接简化为铰结点或刚结点，将支承简化为各类支座。"}, {"id": "ch1_n23", "name": "材料简化", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "假设材料为连续、均匀、各向同性、线弹性，以简化计算。"}, {"id": "ch1_n24", "name": "荷载简化", "type": "知识点", "level": 3, "labels": [], "ktype": "概念性", "desc": "将实际作用于结构上的外力简化为集中力、分布力等理想化形式。"}, {"id": "ch1_n25", "name": "结点与支座", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "介绍结点和支座的基本类型及其约束特性，是结构计算简图的核心内容。"}, {"id": "ch1_n26", "name": "结点类型", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "结点是杆件与杆件连接部位的简化，分为铰结点和刚结点两种基本形式。"}, {"id": "ch1_n29", "name": "支座类型", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "支座是将结构与支承面连接以限制结构运动的装置，支座反力是外力作用下支座产生的反作用力。"}, {"id": "ch1_n34", "name": "结构与荷载", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "介绍杆系结构的五大类型和荷载的四种分类维度。"}, {"id": "ch1_n35", "name": "杆系分类", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "按受力特点和组成方式将杆系结构分为五类。"}, {"id": "ch1_n41", "name": "荷载分类", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "荷载是指主动作用于结构上的外力，按不同维度进行分类。"}, {"id": "ch1_n46", "name": "分析条件", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "介绍结构分析的基本假设和非线性分析条件。"}, {"id": "ch1_n47", "name": "基本假设", "type": "分类", "level": 3, "labels": [], "ktype": "", "desc": "结构分析时常运用的四个基本假设，是线性弹性分析的前提。"}, {"id": "ch1_n52", "name": "非线性分析", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "", "desc": "当结构不满足基本假设时，需考虑非线性效应。"}, {"id": "ch2_l1", "name": "第2章 几何组成分析", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第2章 平面体系的几何组成分析。研究平面体系的几何组成规则，判断体系是否几何不变，为后续静定结构和超静定结构分析奠定基础。"}, {"id": "ch2_n2", "name": "自由度", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "2-1 体系的自由度和计算自由度。介绍自由度概念、联系与约束、计算自由度的三种方法及其与几何组成的关系。"}, {"id": "ch2_n3", "name": "基本规则", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "2-2 几何不变体系的基本组成规则。包括三个基本规则及其推广形式，是几何组成分析的核心依据。"}, {"id": "ch2_n4", "name": "分析方法", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "2-3 几何组成分析方法及示例。介绍扩大刚片法、撤除刚片法、替代刚片法三种常用分析方法。"}, {"id": "ch2_n5", "name": "静定性", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "2-4 几何组成与静定性的关系。讨论几何组成与静力特性的对应关系。"}, {"id": "ch2_n6", "name": "自由度概念", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "自由度是确定体系位置所需的独立坐标数。一个点的自由度为2，一个刚片的自由度为3。"}, {"id": "ch2_n9", "name": "联系与约束", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "联系是限制运动的装置，也称为约束。包括链杆约束、单铰约束和复铰约束。"}, {"id": "ch2_n13", "name": "计算自由度", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "计算自由度W是几何组成分析的辅助工具。有刚片法、结点法和联合法三种计算方法。"}, {"id": "ch2_n17", "name": "必要与多余约束", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "必要约束是使体系几何不变所必需的约束；多余约束是超过必要数量的约束。每个联系不一定减少一个自由度。"}, {"id": "ch2_n18", "name": "W与组成关系", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "", "desc": "W>0体系缺少联系为几何可变；W=0具有最少联系但布置不当仍可变；W≤0是几何不变的必要条件而非充分条件。"}, {"id": "ch2_n19", "name": "三基本规则", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "", "desc": "几何不变体系且无多余约束的三个基本组成规则：点-刚片规则、两刚片规则、三刚片规则。核心是约束不能共线。"}, {"id": "ch2_n25", "name": "三角形法则", "type": "分类", "level": 3, "labels": [], "ktype": "", "desc": "三个基本规则可统一为三角形法则，相互之间可以转换。是理解三个规则内在联系的关键。"}, {"id": "ch2_n26", "name": "规则推广", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "基本组成规则的推广形式，引入虚铰概念，扩展两刚片规则和三刚片规则的适用范围。"}, {"id": "ch2_n31", "name": "撤除刚片法", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "将符合条件的刚片和约束逐步撤除，分析余下部分的几何组成性质。包括撤除二元体和撤除刚片。"}, {"id": "ch2_n34", "name": "替代刚片法", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "", "desc": "将符合条件的刚片用链杆替代，简化体系后再进行分析。包括两铰替代和三铰替代。"}, {"id": "ch2_n37", "name": "静定性概念", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "静定性是指体系的反力和内力能否根据静力平衡条件确定的性质。与几何组成直接相关。"}, {"id": "ch2_n40", "name": "可变体系特性", "type": "分类", "level": 3, "labels": [], "ktype": "", "desc": "常变体系和瞬变体系的静力特性：常变体系不能作为结构使用；瞬变体系在特定荷载下可能产生无穷大或不确定的内力。"}, {"id": "ch3_l1", "name": "第3章 静定结构内力", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第3章 静定结构的内力分析。系统介绍静定梁、刚架、桁架、组合结构、三铰拱的内力计算方法及静定结构的性质。"}, {"id": "ch3_n2", "name": "分析基础", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "3-1 静定结构内力分析基础。介绍内力概念、截面法、内力图形状特征及区段叠加法。"}, {"id": "ch3_n3", "name": "静定梁", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "3-2 静定梁。包括单跨静定梁和多跨静定梁的内力分析。"}, {"id": "ch3_n4", "name": "静定刚架", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "3-3 静定平面刚架。介绍刚架的结构特点、内力计算及快捷法作弯矩图。"}, {"id": "ch3_n5", "name": "静定桁架", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "3-4 静定平面桁架。介绍桁架分类、结点法、截面法及联合应用。"}, {"id": "ch3_n6", "name": "组合结构", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "3-5 静定组合结构。由桁架杆和梁式杆联合组成的结构。"}, {"id": "ch3_n7", "name": "三铰拱", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "3-6 三铰拱。介绍拱的特点、内力计算及合理拱轴线。"}, {"id": "ch3_n8", "name": "性质总结", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "3-7 静定结构的性质与算法总结。包括静力特性、对称性利用和零载法。"}, {"id": "ch3_n9", "name": "内力与内力图", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "3-1-1 内力与内力图。介绍杆件类型、内力符号规定和内力图绘制规定。"}, {"id": "ch3_n13", "name": "截面法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "3-1-2 内力计算的基本方法。操作步骤：切（切开截面）、取（取隔离体）、标（标注作用力）、列（列平衡方程）。"}, {"id": "ch3_n14", "name": "内力图特征", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "3-1-3 内力图的形状特征。利用微分关系和增量关系归纳常见荷载下的内力图形状。"}, {"id": "ch3_n17", "name": "区段叠加法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "3-1-4 区段叠加法作弯矩图。步骤：分段、求值、定形、连线。先绘两端弯矩竖标连线（虚线），再叠加均布荷载下的弯矩图。"}, {"id": "ch3_n18", "name": "单跨静定梁", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "3-2-1 单跨静定梁。包括简支梁、悬臂梁和斜梁。"}, {"id": "ch3_n22", "name": "多跨静定梁", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "", "desc": "3-2-2 多跨静定梁。由基本部分和附属部分组成，计算原则为先附属后基本。"}, {"id": "ch3_n26", "name": "刚架特点", "type": "分类", "level": 3, "labels": [], "ktype": "", "desc": "3-3-1 刚架的结构形式及特点。梁柱刚接，内部空间大，刚度大，弯矩分布均匀。"}, {"id": "ch3_n27", "name": "刚架内力", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "3-3-2 刚架的内力计算。先求支座反力，再求各控制截面内力，最后画内力图。"}, {"id": "ch3_n28", "name": "快捷法M图", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "程序性", "desc": "3-3-3 快捷法作静定刚架弯矩图。利用平衡条件和叠加法快速绘制弯矩图。"}, {"id": "ch3_n29", "name": "桁架分类", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "", "desc": "3-4-1 桁架结构形式及分类。按外形、推力、几何组成方式分类。"}, {"id": "ch3_n34", "name": "结点法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "3-4-2 结点法。取单个结点为隔离体，每结点可列两个平衡方程。应确保未知力不超过两个。"}, {"id": "ch3_n36", "name": "截面法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "3-4-3 截面法。用截面切断待求杆件，取一部分为隔离体，用三个平衡方程求解。分为力矩法和投影法。"}, {"id": "ch3_n39", "name": "联合应用", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "程序性", "desc": "3-4-4 结点法与截面法的联合应用。结点法适合求全部杆力，截面法适合求指定杆力，联合使用更灵活。"}, {"id": "ch3_n40", "name": "组合特点", "type": "分类", "level": 3, "labels": [], "ktype": "", "desc": "3-5 静定组合结构。由链杆（仅受轴力）和梁式杆（受弯剪轴）联合组成。"}, {"id": "ch3_n42", "name": "拱的特点", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "3-6-1 三铰拱的结构形式及特点。由曲杆构成，水平推力抵消弯矩，以受轴压为主。"}, {"id": "ch3_n45", "name": "拱的内力", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "3-6-2 三铰拱的内力计算。反力仅与铰的位置有关，内力还与拱轴线形状有关。水平推力使剪力减小、轴向受压。"}, {"id": "ch3_n46", "name": "合理拱轴线", "type": "分类", "level": 3, "labels": ["难点", "考点"], "ktype": "", "desc": "3-6-3 合理拱轴线。使全拱处于无弯矩状态（无剪力）的拱轴线。"}, {"id": "ch3_n49", "name": "静力特性", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "", "desc": "3-7-1 静定结构的静力特性。基本特性为静力解答唯一性。"}, {"id": "ch3_n54", "name": "方法综合", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "", "desc": "3-7-2 计算方法的综合应用。利用对称性和多种方法灵活应用简化计算。"}, {"id": "ch4_l1", "name": "第4章 影响线及应用", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第4章 静定结构的影响线及其应用。系统介绍影响线的概念、作法（静力法、机动法、联合法）及其在工程中的应用。"}, {"id": "ch4_n2", "name": "影响线概述", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "4-1 移动荷载及影响线概述。介绍移动荷载概念、影响线定义及三个基本问题。"}, {"id": "ch4_n3", "name": "静力法作梁", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "4-2 静力法作静定梁的影响线。包括简支梁、伸臂梁和多跨静定梁的影响线。"}, {"id": "ch4_n4", "name": "间接荷载梁", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "4-3 间接荷载作用下静定梁的影响线。介绍间接荷载（结点荷载）作用下影响线的作法。"}, {"id": "ch4_n5", "name": "桁架影响线", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "4-4 静力法作静定桁架的影响线。桁架只承受结点荷载，作法与间接荷载类似。"}, {"id": "ch4_n6", "name": "机动法作梁", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "4-5 机动法作静定梁的影响线。基于刚体体系虚功原理，通过虚位移图作影响线。"}, {"id": "ch4_n7", "name": "联合法作线", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "4-6 联合法作影响线。先用机动法判断形状，再用静力法确定控制点竖标。"}, {"id": "ch4_n8", "name": "影响线应用", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "4-7 影响线的应用。利用影响线求量值、确定最不利荷载位置。"}, {"id": "ch4_n9", "name": "包络图弯矩", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "4-8 简支梁的包络图和绝对最大弯矩。各截面内力极值分布及全梁最大弯矩。"}, {"id": "ch4_n10", "name": "移动荷载", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "4-1-1 移动荷载的概念。大小、方向、间距不变但作用位置随时间变化的荷载。"}, {"id": "ch4_n11", "name": "影响线定义", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "4-1-2 影响线的定义。单位移动荷载作用下某量值随荷载位置变化的图形。"}, {"id": "ch4_n12", "name": "简支梁影响线", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "4-2-1 简支梁的影响线。用静力平衡条件建立影响线方程并绘图。"}, {"id": "ch4_n13", "name": "伸臂梁影响线", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "4-2-2 伸臂梁的影响线。跨间内力影响线由简支梁延伸，伸臂段与悬臂梁相同。"}, {"id": "ch4_n14", "name": "多跨梁影响线", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "程序性", "desc": "4-2-2 多跨静定梁的影响线。利用基本部分与附属部分的传力关系作图。"}, {"id": "ch4_n15", "name": "间接荷载作法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "4-3 间接荷载作用下影响线的作法。结点间影响线为直线，修正直接荷载影响线。"}, {"id": "ch4_n16", "name": "桁架作图法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "4-4 静力法作桁架影响线。利用力矩法、投影法、结点法分别作图。"}, {"id": "ch4_n17", "name": "虚功原理", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "概念性", "desc": "4-5-1 刚体体系虚功原理。平衡的充要条件是主动力在任意虚位移上做功总和为零。"}, {"id": "ch4_n18", "name": "机动法作图", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "4-5-2 机动法作影响线。去掉约束施加单位虚位移，位移图即为影响线。"}, {"id": "ch4_n19", "name": "联合法步骤", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "4-6 联合法作影响线。机动法定形+静力定值，两步完成作图。"}, {"id": "ch4_n20", "name": "利用影响线求量值", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "4-7-1 利用影响线求量值。集中荷载和均布荷载作用下的量值计算。"}, {"id": "ch4_n21", "name": "均布荷载位置", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "4-7-2 可动均布荷载的最不利位置。将荷载布满影响线正号或负号区域。"}, {"id": "ch4_n22", "name": "荷载组位置", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "程序性", "desc": "4-7-3 移动荷载组的最不利位置。通过临界位置判别式确定。"}, {"id": "ch4_n23", "name": "三角形位置", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "4-7-4 三角形影响线的最不利位置。利用特定判别公式确定临界荷载。"}, {"id": "ch4_n24", "name": "包络图", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "4-8-1 简支梁的内力包络图。各截面最大和最小内力值的连线图。"}, {"id": "ch4_n25", "name": "绝对最大弯矩", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "程序性", "desc": "4-8-2 简支梁的绝对最大弯矩。全梁所有截面最大弯矩中的最大值。"}, {"id": "ch5_l1", "name": "第5章 位移计算", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第5章 静定结构的位移计算。系统介绍虚功原理、位移计算的一般公式、荷载作用下的位移计算、图乘法及其他外因作用下的位移计算和互等定理。"}, {"id": "ch5_n2", "name": "位移计算概述", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "5-1 位移计算概述。介绍位移的种类、产生原因及广义位移概念。"}, {"id": "ch5_n3", "name": "虚功原理", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "5-2 虚功原理。包括刚体体系和变形体系的虚功原理，是位移计算的理论基础。"}, {"id": "ch5_n4", "name": "位移计算公式", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "5-3 位移计算的一般公式。由变形体系虚功原理导出的位移计算统一公式及广义力与广义位移。"}, {"id": "ch5_n5", "name": "荷载位移计算", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "5-4 荷载作用下的位移计算。针对梁、刚架、桁架、拱等不同结构的位移计算公式。"}, {"id": "ch5_n6", "name": "图乘法", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "5-5 图乘法。梁和刚架位移计算的简化方法，用一个图形面积乘以另一图形竖标代替积分。"}, {"id": "ch5_n7", "name": "其他外因位移", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "5-6 其他外因作用下的位移计算。包括支座移动、温度改变和制造误差引起的位移。"}, {"id": "ch5_n8", "name": "互等定理", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "5-7 互等定理。包括功的互等、位移互等、反力互等及反力位移互等定理。"}, {"id": "ch5_n9", "name": "位移种类原因", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "5-1 位移的种类及产生原因。荷载、温度改变、支座移动、制造误差等均可引起位移。"}, {"id": "ch5_n10", "name": "广义位移", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "5-1 广义位移。单个方向位移的组合形式，包括相对位移、相对转角等。"}, {"id": "ch5_n11", "name": "刚体虚功原理", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "概念性", "desc": "5-2-1 刚体体系的虚功原理。平衡的充要条件是主动力虚功总和为零。"}, {"id": "ch5_n12", "name": "变形体虚功原理", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "概念性", "desc": "5-2-2 变形体系的虚功原理。平衡的充要条件是外力虚功等于变形虚功。"}, {"id": "ch5_n13", "name": "一般公式", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "5-3-1 位移计算的一般公式。由变形体虚功原理导出，适用于各种因素引起的位移。"}, {"id": "ch5_n14", "name": "广义力广义位移", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "5-3-2 广义力和广义位移。广义位移与对应的广义单位力之间的关系。"}, {"id": "ch5_n15", "name": "各类结构公式", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "5-4 荷载作用下各类结构的位移计算公式。梁刚架、桁架、拱曲杆、组合结构各有不同。"}, {"id": "ch5_n16", "name": "图乘法算式", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "5-5-1 图乘法算式。满足三条件时用面积乘竖标代替积分的公式及适用条件。"}, {"id": "ch5_n17", "name": "图乘法应用", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "5-5-2 图乘法的应用。无荷载区段和均布荷载区段的图乘方法及注意事项。"}, {"id": "ch5_n18", "name": "支座移动位移", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "5-6-1 支座移动引起的位移。静定结构支座移动不产生内力但引起刚体位移。"}, {"id": "ch5_n19", "name": "温度改变位移", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "5-6-2 温度改变引起的位移。静定结构温度改变不产生内力但引发位移。"}, {"id": "ch5_n20", "name": "制造误差位移", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "5-6-3 制造误差引起的位移。杆件长度误差和平直度误差引起的位移。"}, {"id": "ch5_n21", "name": "柔度刚度系数", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "5-7-1 柔度系数和刚度系数。单位力引起的位移为柔度系数，单位位移所需的力为刚度系数。"}, {"id": "ch5_n22", "name": "功的互等定理", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "5-7-2 功的互等定理。状态I外力在状态II位移上的虚功等于状态II外力在状态I位移上的虚功。"}, {"id": "ch5_n23", "name": "位移互等定理", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "5-7-3 位移互等定理。单位力Fj引起的i方向位移等于单位力Fi引起的j方向位移。"}, {"id": "ch5_n24", "name": "反力互等定理", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "5-7-4 反力互等定理。单位支座位移j引起的支座反力i等于单位支座位移i引起的支座反力j。"}, {"id": "ch5_n25", "name": "反力位移互等", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "概念性", "desc": "5-7-5 反力位移互等定理。单位力引起的反力与单位支座位移引起的位移数值相等且反号。"}, {"id": "ch6_l1", "name": "第6章 力法", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第6章 力法。超静定结构的基本解法之一，以多余约束力为基本未知量，通过变形协调条件建立力法方程求解。"}, {"id": "ch6_n2", "name": "超静定概述", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "6-1 超静定结构及其解法概述。介绍超静定结构的概念、特点和基本解法。"}, {"id": "ch6_n3", "name": "次数与基本结构", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "6-2 超静定次数和力法基本结构。确定超静定次数的方法及去除约束法。"}, {"id": "ch6_n4", "name": "力法基本原理", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "6-3 力法的基本原理。以多余约束力为未知量，通过位移协调条件建立力法方程。"}, {"id": "ch6_n5", "name": "梁和刚架", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "6-4 力法解超静定梁和刚架。梁刚架以弯曲变形为主，只需考虑弯矩影响。"}, {"id": "ch6_n6", "name": "桁架和组合结构", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "6-5 力法解超静定桁架和组合结构。桁架只考虑轴向变形，组合结构分别考虑。"}, {"id": "ch6_n7", "name": "对称性利用", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "6-6 对称性的利用。利用结构对称性简化计算，取半边结构。"}, {"id": "ch6_n8", "name": "其他外因力法", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "6-7 其他外因作用下的力法计算。支座移动、温度改变等引起的自内力计算。"}, {"id": "ch6_n9", "name": "超静定拱", "type": "分类", "level": 2, "labels": ["难点"], "ktype": "", "desc": "6-8 力法解超静定拱。两铰拱和无铰拱的力法计算，弹性中心法。"}, {"id": "ch6_n10", "name": "位移校核", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "6-9 超静定结构的位移计算和内力校核。利用单位荷载法求位移及内力校核方法。"}, {"id": "ch6_n11", "name": "超静定概念", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "6-1 超静定结构的概念。具有多余约束的几何不变体系，内力超出静力平衡条件可确定范围。"}, {"id": "ch6_n12", "name": "结构特点", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "6-1 超静定结构的特点。延性好、刚度大、材料性能发挥充分。"}, {"id": "ch6_n13", "name": "基本解法", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "6-1 超静定结构的两种基本解法：力法（以多余约束力为未知量）和位移法（以结点位移为未知量）。"}, {"id": "ch6_n14", "name": "超静定次数", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "6-2 超静定次数的确定。多余约束个数即为超静定次数，也可由计算自由度W确定。"}, {"id": "ch6_n15", "name": "去除约束法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "6-2 去除约束法。通过撤除或切断约束使结构退化为静定结构的方法。"}, {"id": "ch6_n16", "name": "一次超静定", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "6-3-1 一次超静定结构。去除多余约束得到基本体系，建立力法基本方程。"}, {"id": "ch6_n17", "name": "多次超静定", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "程序性", "desc": "6-3-2 多次超静定结构。力法典型方程为线性方程组，含柔度系数和载变位。"}, {"id": "ch6_n18", "name": "计算步骤", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "6-3-3 力法计算的一般步骤。确定次数→选基本结构→列方程→作内力图→求系数→解方程→叠加内力。"}, {"id": "ch6_n19", "name": "梁刚架特点", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "6-4 梁和刚架力法计算特点。以受弯为主，轴向和剪切变形很小，通常只考虑弯曲变形。"}, {"id": "ch6_n20", "name": "桁架组合特点", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "6-5 桁架和组合结构力法计算特点。桁架只考虑轴向变形，组合结构梁式杆计弯矩、链杆计轴力。"}, {"id": "ch6_n21", "name": "对称结构荷载", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "概念性", "desc": "6-6-1 对称结构和对称荷载。对称结构：几何形状、刚度、约束关于轴线对称。一般荷载可分解为正对称+反对称。"}, {"id": "ch6_n22", "name": "受力特性", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "6-6-2 对称结构的受力特性。正对称荷载下内力正对称，反对称荷载下内力反对称。"}, {"id": "ch6_n23", "name": "简化计算", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "6-6-3 对称结构的简化计算。取半边结构法：奇数跨和偶数跨的不同处理。"}, {"id": "ch6_n24", "name": "支座移动力法", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "6-7-1 支座移动时的力法计算。力法方程右端为原结构实际位移，自由项为基本结构支座移动引起的位移。"}, {"id": "ch6_n25", "name": "温度改变力法", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "6-7-2 温度改变时的力法计算。静定基本结构温度改变不产生内力，原结构内力仅由多余未知力产生。"}, {"id": "ch6_n26", "name": "两铰拱", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "6-8-1 两铰拱的计算。一次超静定，包括普通两铰拱和带拉杆两铰拱。扁平拱需考虑轴向变形。"}, {"id": "ch6_n27", "name": "无铰拱", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "程序性", "desc": "6-8-2 无铰拱的计算。三次超静定，利用弹性中心法简化为三个独立方程。"}, {"id": "ch6_n28", "name": "位移计算", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "6-9-1 超静定结构的位移计算。用单位荷载法，可选取静定基本结构施加单位力简化计算。"}, {"id": "ch6_n29", "name": "内力校核", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "6-9-2 超静定内力计算的校核。包括定性校核和定量校核（平衡条件、变形条件）。"}, {"id": "ch7_l1", "name": "第7章 位移法", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第7章 位移法。超静定结构的基本解法之一，以结点位移为基本未知量，通过平衡条件建立位移法方程求解。"}, {"id": "ch7_n2", "name": "位移法概念", "type": "分类", "level": 2, "labels": ["重点"], "ktype": "", "desc": "7-1 位移法的基本概念。以结点位移为未知量，通过杆件分析和平衡条件求解结构内力。"}, {"id": "ch7_n3", "name": "刚度方程", "type": "分类", "level": 2, "labels": ["重点", "难点"], "ktype": "", "desc": "7-2 等截面直杆的刚度方程。杆端力与杆端位移之间的相互关系，包括形常数和载常数。"}, {"id": "ch7_n4", "name": "基本未知量", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "7-3 位移法基本未知量的确定。结点角位移和结点线位移的数目确定方法。"}, {"id": "ch7_n5", "name": "原理和步骤", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "7-4 位移法的原理和步骤。典型方程法和直接列平衡方程法两种途径。"}, {"id": "ch7_n6", "name": "梁和刚架", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "7-5 位移法计算梁和刚架结构。包括无侧移刚架、有侧移刚架和无剪力法。"}, {"id": "ch7_n7", "name": "对称性利用", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "7-6 对称性的利用。利用对称性取半边结构简化位移法计算。"}, {"id": "ch7_n8", "name": "桁架组合结构", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "7-7 位移法计算桁架和组合结构。桁架以结点线位移为未知量，组合结构综合处理。"}, {"id": "ch7_n9", "name": "支座移动温变", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "7-8 支座移动和温度改变时的位移法计算。自由项为基本结构在这些因素下的附加约束力。"}, {"id": "ch7_n10", "name": "混合法", "type": "分类", "level": 2, "labels": ["难点"], "ktype": "", "desc": "7-9 力法与位移法的联合——混合法。选取结点位移和多余约束力共同作为基本未知量。"}, {"id": "ch7_n11", "name": "基本思路", "type": "分类", "level": 3, "labels": ["重点"], "ktype": "程序性", "desc": "7-1 位移法基本思路：选取结点位移为未知量→杆件分析建立杆端力与位移关系→取隔离体列平衡方程→解方程求位移→确定内力。"}, {"id": "ch7_n12", "name": "桁架杆刚度", "type": "分类", "level": 3, "labels": [], "ktype": "程序性", "desc": "7-2-1 桁架杆的刚度方程。杆端力与杆端位移之间的轴向关系。"}, {"id": "ch7_n13", "name": "转角位移方程", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "7-2-2 梁式杆的转角位移方程。不同支承条件下梁式杆的杆端弯矩与杆端位移关系。"}, {"id": "ch7_n14", "name": "形常数载常数", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "7-2 形常数和载常数。形常数仅与杆件几何和材料有关，载常数与荷载形式有关。"}, {"id": "ch7_n15", "name": "角位移确定", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "7-3 结点角位移的确定。刚结点有一个独立角位移，铰结点转角不独立，固定支座转角为零。"}, {"id": "ch7_n16", "name": "线位移确定", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "7-3 结点线位移的确定。受弯直杆忽略轴向变形，可用附加支座链杆法或铰接链杆体系法。"}, {"id": "ch7_n17", "name": "典型方程法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "7-4-1 典型方程法。借助基本结构，计算结点位移和荷载分别作用下的附加约束力，建立位移法典型方程。"}, {"id": "ch7_n18", "name": "直接平衡法", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "7-4-2 直接列平衡方程法。直接利用杆端弯矩表达式和结点/截面平衡条件建立方程。"}, {"id": "ch7_n19", "name": "无侧移刚架", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "7-5-1 连续梁和无侧移刚架。仅含结点角位移，建立力矩平衡方程。"}, {"id": "ch7_n20", "name": "有侧移刚架", "type": "分类", "level": 3, "labels": ["重点", "难点"], "ktype": "程序性", "desc": "7-5-2 有侧移刚架。既有角位移又有线位移，线位移对应投影平衡方程。"}, {"id": "ch7_n21", "name": "无剪力法", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "程序性", "desc": "7-5 无剪力法。用于有侧移杆件剪力静定的结构，上层荷载对下层均有影响。"}, {"id": "ch7_n22", "name": "对称简化", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "7-6 对称结构的简化计算。奇数跨和偶数跨取半边结构的方法，可进一步取1/4结构。"}, {"id": "ch7_n23", "name": "桁架位移法", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "7-7 位移法计算桁架。以结点线位移为基本未知量，利用几何关系和平衡条件求解。"}, {"id": "ch7_n24", "name": "组合结构位移法", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "7-7 位移法计算组合结构。梁式杆计弯曲变形，链杆计轴向变形，综合处理。"}, {"id": "ch7_n25", "name": "支座移动计算", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "7-8-1 支座移动时的计算。自由项为基本结构在支座移动下产生的附加约束力。"}, {"id": "ch7_n26", "name": "温度改变计算", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "7-8-2 温度改变时的计算。温度分解为轴线温变和温差，分别产生固端力。"}, {"id": "ch7_n27", "name": "混合法概念", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "概念性", "desc": "7-9 混合法基本概念。多余约束多时宜用位移法，结点位移多时宜用力法，混合使用取各自较少的未知量。"}, {"id": "ch8_l1", "name": "第8章 实用分析方法", "type": "分类", "level": 1, "labels": ["重点"], "ktype": "", "desc": "第8章 超静定结构的实用分析方法。包括力矩分配法、剪力分配法、定性分析、超静定特性及影响线包络图等渐近和近似方法。"}, {"id": "ch8_n2", "name": "力矩分配法", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "8-1 力矩分配法。以力矩分配和传递为核心的渐近法，适用于无侧移刚架和连续梁。"}, {"id": "ch8_n3", "name": "力矩分配拓展", "type": "分类", "level": 2, "labels": ["难点"], "ktype": "", "desc": "8-2 力矩分配法的拓展应用。包括无剪力力矩分配和与位移法联合应用。"}, {"id": "ch8_n4", "name": "剪力分配法", "type": "分类", "level": 2, "labels": ["重点", "考点"], "ktype": "", "desc": "8-3 剪力分配法。适用于单层排架和横梁刚度无穷大刚架的剪力按侧移刚度分配方法。"}, {"id": "ch8_n5", "name": "定性分析", "type": "分类", "level": 2, "labels": [], "ktype": "", "desc": "8-4 超静定结构的定性分析。对桁架、连续梁和刚架进行定性内力分析。"}, {"id": "ch8_n6", "name": "超静定特性", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "8-5 超静定结构的特性。超静定结构的一般特性和内力变化规律。"}, {"id": "ch8_n7", "name": "影响线包络图", "type": "分类", "level": 2, "labels": ["考点"], "ktype": "", "desc": "8-6 超静定结构的影响线及内力包络图。超静定影响线作法和连续梁包络图。"}, {"id": "ch8_n8", "name": "基本原理", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "概念性", "desc": "8-1-1 力矩分配法的基本原理。通过转动刚度、分配系数和传递系数实现力矩的分配与传递。"}, {"id": "ch8_n9", "name": "多结点分配", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "8-1-2 多个结点的力矩分配。依次对每个结点反复进行分配和传递，渐近收敛。"}, {"id": "ch8_n10", "name": "无剪力分配", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "程序性", "desc": "8-2-1 无剪力力矩分配。适用于剪力静定杆件，放松结点过程中剪力静定杆始终无剪力。"}, {"id": "ch8_n11", "name": "与位移法联合", "type": "分类", "level": 3, "labels": ["难点"], "ktype": "程序性", "desc": "8-2-1 力矩分配法与位移法联合应用。有侧移结构取线位移为未知量，力矩分配处理角位移。"}, {"id": "ch8_n12", "name": "排架剪力分配", "type": "分类", "level": 3, "labels": ["重点", "考点"], "ktype": "程序性", "desc": "8-3-1 单层排架的剪力分配法。柱顶侧向荷载按各柱侧移刚度的相对大小分担。"}, {"id": "ch8_n13", "name": "刚架剪力分配", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "8-3-2 横梁刚度无穷大刚架的剪力分配。柱顶无角位移仅有线位移，用反弯点法求弯矩。"}, {"id": "ch8_n14", "name": "桁架定性分析", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "8-4-1 超静定梁式桁架的定性分析。支座反力和节间内力合力静定，内力遵循能者多劳原则。"}, {"id": "ch8_n15", "name": "连续梁刚架定性", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "8-4-2 连续梁和无侧移刚架的定性分析。根据变形协调和能者多劳原则判断内力分布。"}, {"id": "ch8_n16", "name": "有侧移刚架定性", "type": "分类", "level": 3, "labels": [], "ktype": "概念性", "desc": "8-4-3 有侧移刚架的定性分析。用反弯点法和悬臂梁法作水平荷载下内力定性分析。"}, {"id": "ch8_n17", "name": "一般特性", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "8-5-1 超静定结构的一般特性。非荷载因素产生内力、协同分担、刚度相关、防护能力强、刚度大。"}, {"id": "ch8_n18", "name": "内力变化规律", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "概念性", "desc": "8-5-2 超静定结构的内力变化规律。荷载作用下内力与刚度比值有关，非荷载因素与刚度绝对值有关。"}, {"id": "ch8_n19", "name": "超静定影响线", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "8-6-1 超静定结构的影响线。直接法和比拟法（挠度法）两种作法。"}, {"id": "ch8_n20", "name": "包络图作法", "type": "分类", "level": 3, "labels": ["考点"], "ktype": "程序性", "desc": "8-6-2 连续梁的最不利荷载位置及内力包络图。逐跨布载法叠加求最大最小弯矩。"}], "links": [{"source": "ch1_l1", "target": "ch1_n4", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n5", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n6", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n7", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n8", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n9", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n10", "type": "包含"}, {"source": "ch1_n4", "target": "ch1_n11", "type": "包含"}, {"source": " const STORAGE_KEY = 'cosmic_knowledge_graph_total_l3_v1';

function loadData() {

      graphData = JSON.parse(saved);
      return;
    } catch(e) {}
  }
  graphData = JSON.parse(JSON.stringify(INITIAL_DATA));

  updateStats();
}

  if (!confirm('确定要还原到初始数据吗？所有修改将丢失。')) return;

  saveData();
  initGraph();
  showToast('已还原到初始数据', 'success');
}

  document.getElementById('stat-nodes').textContent = graphData.nodes.length;
  document.getElementById('stat-links').textContent = graphData.links.length;
}

// ======================== STARFIELD ========================
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let stars = [];

function initStarfield() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  stars = [];
  const count = Math.floor((starCanvas.width * starCanvas.height) / 6000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * starCanvas.width,
      y: Math.random() * starCanvas.height,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.2,
      tw: Math.random() * 0.02 + 0.005,
      tp: Math.random() * Math.PI * 2,
      vx: (Math.random() - 0.5) * 0.05,
      vy: (Math.random() - 0.5) * 0.05,
    });
  }
}

function animateStars() {
  starCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
  for (const s of stars) {
    s.tp += s.tw;
    const a = s.a * (0.6 + 0.4 * Math.sin(s.tp));
    s.x += s.vx; s.y += s.vy;
    if (s.x < 0) s.x = starCanvas.width;
    if (s.x > starCanvas.width) s.x = 0;
    if (s.y < 0) s.y = starCanvas.height;
    if (s.y > starCanvas.height) s.y = 0;
    starCtx.beginPath();
    starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    starCtx.fillStyle = `rgba(200,210,255,${a})`;
    starCtx.fill();
    if (s.r > 0.8) {
      starCtx.beginPath();
      starCtx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      starCtx.fillStyle = `rgba(150,170,255,${a*0.08})`;
      starCtx.fill();
    }
  }
  requestAnimationFrame(animateStars);
}

let svg, gMain, gLink, gNode, zoomBehavior;
const nodeColorMap = {
  1: { core: '#ffd700', glow: '#ff8c00', ring: 'rgba(255,215,0,0.3)' },
  2: { core: '#4488ff', glow: '#2255aa', ring: 'rgba(68,136,255,0.3)' },
  3: { core: '#9d6bff', glow: '#6633cc', ring: 'rgba(157,107,255,0.3)' },
  4: { core: '#e8e8ff', glow: '#8888bb', ring: 'rgba(200,200,255,0.3)' },
};
const nodeRadiusMap = { 1: 22, 2: 16, 3: 12, 4: 8 };
const linkColorMap = {
  '包含': '#5577ff',
  '前置': '#ffa030',
  '后置': '#50ff80',
  '关联': '#d050ff',
};
const linkDashMap = {

  '前置': '7,4',

};

function initGraph() {
  const container = document.getElementById('graph-container');
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Resolve link source/target from string IDs to node object references
  const nodeMap = {};
  graphData.nodes.forEach(n => { nodeMap[n.id] = n; });
  graphData.links.forEach(l => {
    if (typeof l.source === 'string') l.source = nodeMap[l.source];
    if (typeof l.target === 'string') l.target = nodeMap[l.target];
  });

  d3.select('#graph-svg').selectAll('*').remove();

  svg = d3.select('#graph-svg')
    .attr('viewBox', `0 0 ${width} ${height}`);

  // Defs for gradients
  const defs = svg.append('defs');

  graphData.nodes.forEach(node => {
    const colors = nodeColorMap[node.level] || nodeColorMap[4];
    const r = nodeRadiusMap[node.level] || 8;
    const gradId = `grad-${node.id}`;
    const grad = defs.append('radialGradient').attr('id', gradId);
    grad.append('stop').attr('offset', '0%').attr('stop-color', colors.core).attr('stop-opacity', 1);
    grad.append('stop').attr('offset', '50%').attr('stop-color', colors.glow).attr('stop-opacity', 0.8);
    grad.append('stop').attr('offset', '100%').attr('stop-color', colors.glow).attr('stop-opacity', 0);
    node._gradId = gradId;
    node._r = r;
    node._colors = colors;
  });

  // Glow filter
  const filter = defs.append('filter').attr('id', 'glow').attr('x', '-50%').attr('y', '-50%').attr('width', '200%').attr('height', '200%');
  filter.append('feGaussianBlur').attr('stdDeviation', '3').attr('result', 'blur');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode').attr('in', 'blur');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');

  // Central galaxy glow gradient
  galaxyCenterX = width / 2;
  galaxyCenterY = height / 2;
  const centerGrad = defs.append('radialGradient').attr('id', 'centerGlow');
  centerGrad.append('stop').attr('offset', '0%').attr('stop-color', '#4488ff').attr('stop-opacity', 0.15);
  centerGrad.append('stop').attr('offset', '40%').attr('stop-color', '#9d6bff').attr('stop-opacity', 0.06);
  centerGrad.append('stop').attr('offset', '100%').attr('stop-color', '#9d6bff').attr('stop-opacity', 0);

  gMain = svg.append('g').attr('class', 'main-group');

  // Orbit ring for L2 around galaxy center (the "solar" orbit)
  const orbitGroup = gMain.append('g').attr('class', 'orbit-rings');
  orbitGroup.append('circle')
    .attr('class', 'orbit-ring')
    .attr('cx', galaxyCenterX).attr('cy', galaxyCenterY)
    .attr('r', 170)
    .attr('stroke-dasharray', '2,10');
  // Central glow
  orbitGroup.append('circle')
    .attr('class', 'galaxy-core')
    .attr('cx', galaxyCenterX).attr('cy', galaxyCenterY)
    .attr('r', 80)
    .attr('fill', 'url(#centerGlow)');

  // Galaxy rotation wrapper
  gGalaxy = gMain.append('g').attr('class', 'galaxy-group');

  // Links
  gLink = gGalaxy.append('g').attr('class', 'links')
    .selectAll('line')
    .data(graphData.links)
    .enter().append('line')
    .attr('class', 'link-line')
    .attr('stroke', d => linkColorMap[d.type] || linkColorMap['包含'])
    .attr('stroke-width', d => d.type === '包含' ? 1.5 : 2.5)
    .attr('stroke-opacity', d => d.type === '包含' ? 0.7 : 0.85)
    .attr('stroke-dasharray', d => linkDashMap[d.type] || '5,3')
    .style('cursor', 'pointer')
    .on('click', function(event, d) {
      event.stopPropagation();
      if (confirm(`删除该"${d.type}"关系？`)) {
        graphData.links = graphData.links.filter(l =>
          !(l.source.id === d.source.id && l.target.id === d.target.id && l.type === d.type));
        saveData();
        initGraph();
        showToast('关系已删除', 'success');
      }
    });

  // Nodes
  gNode = gGalaxy.append('g').attr('class', 'nodes')
    .selectAll('g')
    .data(graphData.nodes)
    .enter().append('g')
    .attr('class', 'node-group')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', dragStarted)
      .on('drag', dragged)
      .on('end', dragEnded));

  // Outer glow ring
  gNode.append('circle')
    .attr('class', 'node-glow')
    .attr('r', d => d._r * 2.2)
    .attr('fill', d => `url(#${d._gradId})`)
    .attr('opacity', 0.35);

  // Main circle
  gNode.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => d._r)
    .attr('fill', d => `url(#${d._gradId})`)
    .attr('stroke', d => d._colors.core)
    .attr('stroke-width', 1.5)
    .attr('filter', 'url(#glow)');

  // Label
  gNode.append('text')
    .attr('class', 'node-label')
    .attr('dy', d => d._r + 16)
    .attr('text-anchor', 'middle')
    .text(d => d.name.length > 16 ? d.name.substring(0, 14) + '…' : d.name)
    .style('display', showLabels ? 'block' : 'none');

  // Badge indicators (small dots for labels)
  gNode.each(function(d) {
    if (d.labels && d.labels.length > 0) {
      const badgeColors = { '重点': '#ffd700', '难点': '#ff5577', '考点': '#00e0ff', '课程思政': '#ff6ec7' };
      const g = d3.select(this);
      d.labels.forEach((label, i) => {
        const angle = (i / d.labels.length) * Math.PI * 2 - Math.PI / 2;
        const bx = Math.cos(angle) * (d._r + 5);
        const by = Math.sin(angle) * (d._r + 5);
        g.append('circle')
          .attr('class', 'badge-dot')
          .attr('cx', bx).attr('cy', by)
          .attr('r', 3)
          .attr('fill', badgeColors[label] || '#9d6bff')
          .attr('stroke', 'rgba(0,0,0,0.4)')
          .attr('stroke-width', 0.5);
      });
    }
  });

  // Apply level visibility
  applyLevelVisibility();

  // Node events
  gNode.on('mouseenter', function(event, d) {
    showTooltip(event, d);
    highlightPropagation(d);
    if (galaxyRotating) { wasRotatingBeforeHover = true; galaxyRotating = false; }
  })
  .on('mousemove', function(event) {
    moveTooltip(event);
  })
  .on('mouseleave', function() {
    hideTooltip();
    unhighlight();
    if (wasRotatingBeforeHover) { galaxyRotating = true; wasRotatingBeforeHover = false; }
  })
  .on('click', function(event, d) {
    event.stopPropagation();
    selectedNode = d;
    showDetail(d);
  });

  // Click empty space
  svg.on('click', function() {
    closeDetail();
    selectedNode = null;
  });

  // Zoom
  let currentZoomTransform = d3.zoomIdentity;
  zoomBehavior = d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => {
      currentZoomTransform = event.transform;
      gMain.attr('transform', event.transform);
    });
  svg.call(zoomBehavior);

  // Radial tree layout (planets orbiting star)
  calculateRadialLayout();
  updateGraphPositions();

  // Initial zoom-out to fit the concentric ring layout (L3 at 900px radius)
  const initScale = 0.35;
  const initTx = (width - width * initScale) / 2;
  const initTy = (height - height * initScale) / 2;
  svg.call(zoomBehavior.transform, d3.zoomIdentity.translate(initTx, initTy).scale(initScale));

  updateStats();
}

// ======================== RADIAL LAYOUT (Concentric Rings) ========================
function calculateRadialLayout() {
  const cx = galaxyCenterX;
  const cy = galaxyCenterY;

  // Build parent-children tree from "包含" links
  const childrenMap = {};
  const parentMap = {};  // child -> parent
  graphData.links.forEach(l => {
    const s = (l.source.id || l.source);
    const t = (l.target.id || l.target);
    if (l.type === '包含') {
      if (!childrenMap[s]) childrenMap[s] = [];
      childrenMap[s].push(t);
      parentMap[t] = s;
    }
  });

  // Find root node (L0 or L1)
  const root = graphData.nodes.find(n => n.level === 0) || graphData.nodes.find(n => n.level === 1);
  if (!root) return;

  // Count total leaf descendants for angular weighting
  function countDescendants(nodeId) {
    const children = childrenMap[nodeId] || [];
    let count = children.length;
    children.forEach(cid => { count += countDescendants(cid); });
    return Math.max(count, 1);
  }

  // Concentric ring radii FROM GALAXY CENTER
  // Each level on its own ring, progressively further out
  // Large gaps between rings for visual clarity
  const ringRadius = { 0: 0, 1: 280, 2: 580, 3: 900, 4: 1250 };

  // Minimum angular gap between nodes on the same ring (radians)
  const MIN_ANGLE_GAP = 0.10;

  // ---- Step 1: Place L1 nodes evenly around the center ----
  const l1Nodes = graphData.nodes.filter(n => n.level === 1);
  // Sort by chapter order for consistent layout
  l1Nodes.sort((a, b) => {
    const aMatch = a.id.match(/ch(\d+)/);
    const bMatch = b.id.match(/ch(\d+)/);
    if (aMatch && bMatch) return parseInt(aMatch[1]) - parseInt(bMatch[1]);
    return 0;
  });

  // Weight L1 nodes by their descendant count for proportional angular sectors
  const l1Weights = l1Nodes.map(n => countDescendants(n.id));
  const l1TotalWeight = l1Weights.reduce((a, b) => a + b, 0);
  const l1TotalGap = MIN_ANGLE_GAP * Math.max(l1Nodes.length, 1);
  const l1AvailableRange = 2 * Math.PI - l1TotalGap;

  let l1Angle = -Math.PI / 2;  // Start from top
  const l1AngleMap = {};  // nodeId -> {start, mid, end}

  l1Nodes.forEach((node, i) => {
    const sectorSize = l1AvailableRange * (l1Weights[i] / l1TotalWeight);
    const start = l1Angle;
    const end = l1Angle + sectorSize;
    const mid = (start + end) / 2;
    
    node.x = cx + Math.cos(mid) * ringRadius[1];
    node.y = cy + Math.sin(mid) * ringRadius[1];
    node._angle = mid;
    
    l1AngleMap[node.id] = { start, mid, end };
    l1Angle = end + MIN_ANGLE_GAP;
  });

  // ---- Step 2: Place L2 nodes within their parent L1's angular sector ----
  const l2Nodes = graphData.nodes.filter(n => n.level === 2);
  const l2AngleMap = {};

  l1Nodes.forEach(l1Node => {
    const l2Children = (childrenMap[l1Node.id] || [])
      .map(cid => graphData.nodes.find(n => n.id === cid))
      .filter(n => n && n.level === 2);
    
    if (l2Children.length === 0) return;

    const parentSector = l1AngleMap[l1Node.id];
    // Use 80% of parent's sector for children, leaving 10% margin on each side
    const margin = (parentSector.end - parentSector.start) * 0.08;
    let sectorStart = parentSector.start + margin;
    let sectorEnd = parentSector.end - margin;
    let sectorRange = sectorEnd - sectorStart;

    // If only 1 child, center it in the sector
    if (l2Children.length === 1) {
      const mid = (sectorStart + sectorEnd) / 2;
      const node = l2Children[0];
      node.x = cx + Math.cos(mid) * ringRadius[2];
      node.y = cy + Math.sin(mid) * ringRadius[2];
      node._angle = mid;
      l2AngleMap[node.id] = { start: sectorStart, mid, end: sectorEnd };
      return;
    }

    // Weight L2 children by their descendant count
    const weights = l2Children.map(n => countDescendants(n.id));
    const totalWeight = weights.reduce((a, b) => a + b, 0);
    const totalGap = MIN_ANGLE_GAP * (l2Children.length - 1);
    const availableRange = sectorRange - totalGap;

    let currentAngle = sectorStart;
    l2Children.forEach((node, i) => {
      const sectorSize = availableRange * (weights[i] / totalWeight);
      const start = currentAngle;
      const end = currentAngle + sectorSize;
      const mid = (start + end) / 2;

      node.x = cx + Math.cos(mid) * ringRadius[2];
      node.y = cy + Math.sin(mid) * ringRadius[2];
      node._angle = mid;

      l2AngleMap[node.id] = { start, mid, end };
      currentAngle = end + MIN_ANGLE_GAP;
    });
  });

  // ---- Step 3: Place L3 nodes within their parent L2's angular sector ----
  const l3Nodes = graphData.nodes.filter(n => n.level === 3);

  l2Nodes.forEach(l2Node => {
    const l3Children = (childrenMap[l2Node.id] || [])
      .map(cid => graphData.nodes.find(n => n.id === cid))
      .filter(n => n && n.level === 3);

    if (l3Children.length === 0) return;

    const parentSector = l2AngleMap[l2Node.id];
    if (!parentSector) return;

    // Use 75% of parent's sector for children
    const margin = (parentSector.end - parentSector.start) * 0.12;
    let sectorStart = parentSector.start + margin;
    let sectorEnd = parentSector.end - margin;
    let sectorRange = sectorEnd - sectorStart;

    if (l3Children.length === 1) {
      const mid = (sectorStart + sectorEnd) / 2;
      const node = l3Children[0];
      node.x = cx + Math.cos(mid) * ringRadius[3];
      node.y = cy + Math.sin(mid) * ringRadius[3];
      node._angle = mid;
      return;
    }

    // Evenly distribute L3 children (no weighting needed since they're leaf nodes in this graph)
    const totalGap = MIN_ANGLE_GAP * (l3Children.length - 1);
    const availableRange = sectorRange - totalGap;
    const step = availableRange / l3Children.length;

    let currentAngle = sectorStart;
    l3Children.forEach((node, i) => {
      const start = currentAngle;
      const end = currentAngle + step;
      const mid = (start + end) / 2;

      node.x = cx + Math.cos(mid) * ringRadius[3];
      node.y = cy + Math.sin(mid) * ringRadius[3];
      node._angle = mid;

      currentAngle = end + MIN_ANGLE_GAP;
    });
  });

  // ---- Step 4: Place L0 root at center ----
  root.x = cx;
  root.y = cy;

  // ---- Step 5: Handle orphan nodes (not connected via "包含" to root) ----
  const placedIds = new Set([root.id]);
  graphData.nodes.forEach(n => {
    if (n.x !== undefined) placedIds.add(n.id);
  });

  let orphanIndex = 0;
  const orphans = graphData.nodes.filter(n => !placedIds.has(n.id));
  orphans.forEach(n => {
    const angle = (orphanIndex / Math.max(orphans.length, 1)) * 2 * Math.PI - Math.PI / 2;
    const r = ringRadius[n.level] || 600;
    n.x = cx + Math.cos(angle) * r;
    n.y = cy + Math.sin(angle) * r;
    orphanIndex++;
  });
}

// ======================== GALAXY ROTATION ========================
function updateGraphPositions() {
  const cosA = Math.cos(galaxyAngle);
  const sinA = Math.sin(galaxyAngle);
  const cx = galaxyCenterX, cy = galaxyCenterY;
  gLink
    .attr('x1', d => cx + (d.source.x - cx) * cosA - (d.source.y - cy) * sinA)
    .attr('y1', d => cy + (d.source.x - cx) * sinA + (d.source.y - cy) * cosA)
    .attr('x2', d => cx + (d.target.x - cx) * cosA - (d.target.y - cy) * sinA)
    .attr('y2', d => cy + (d.target.x - cx) * sinA + (d.target.y - cy) * cosA);
  gNode.attr('transform', d => {
    const rx = cx + (d.x - cx) * cosA - (d.y - cy) * sinA;
    const ry = cy + (d.x - cx) * sinA + (d.y - cy) * cosA;
    return `translate(${rx},${ry})`;
  });
}

function animateGalaxy() {
  if (galaxyRotating) {
    galaxyAngle += galaxySpeed;
    updateGraphPositions();
  }
  requestAnimationFrame(animateGalaxy);
}

function toggleRotation() {
  galaxyRotating = !galaxyRotating;
  document.getElementById('toggle-rotation-btn').textContent = galaxyRotating ? '暂停旋转' : '开启旋转';
}

function dragStarted(event, d) {
  // No simulation; just allow dragging
}
function dragged(event, d) {
  const cosA = Math.cos(-galaxyAngle);
  const sinA = Math.sin(-galaxyAngle);
  const dx = event.x - galaxyCenterX;
  const dy = event.y - galaxyCenterY;
  d.x = galaxyCenterX + dx * cosA - dy * sinA;
  d.y = galaxyCenterY + dx * sinA + dy * cosA;
  updateGraphPositions();
}
function dragEnded(event, d) {
  // Node stays where dropped
}

// ======================== HIGHLIGHT (Direct Neighbors) ========================
function highlightPropagation(node) {
  // Find only DIRECTLY connected nodes (1-hop neighbors)
  const connected = new Set([node.id]);
  graphData.links.forEach(l => {
    const s = l.source.id || l.source;
    const t = l.target.id || l.target;
    if (s === node.id) connected.add(t);
    if (t === node.id) connected.add(s);
  });

  // Nodes: show direct neighbors (even if level hidden), dim everything else
  gNode
    .style('display', d => {
      if (connected.has(d.id)) return null;              // hovered node + direct neighbors: always show
      return hiddenLevels.has(d.level) ? 'none' : null;  // others: respect level visibility
    })
    .style('opacity', d => connected.has(d.id) ? 1 : 0.12)
    .style('transition', 'opacity 0.3s ease');

  // Links: show links touching the hovered node, dim the rest
  gLink
    .style('display', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      if (s === node.id || t === node.id) return null;   // links touching hovered node: always show
      const sLevel = d.source.level;
      const tLevel = d.target.level;
      return (hiddenLevels.has(sLevel) || hiddenLevels.has(tLevel)) ? 'none' : null;
    })
    .style('opacity', d => {
      const s = d.source.id || d.source;
      const t = d.target.id || d.target;
      return (s === node.id || t === node.id) ? 1 : 0.06;
    })
    .style('transition', 'opacity 0.3s ease');
}

function unhighlight() {
  gNode
    .style('opacity', null)
    .style('transition', null);
  gLink
    .style('opacity', null)
    .style('transition', null);
  applyLevelVisibility();
}
