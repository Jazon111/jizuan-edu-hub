  &lt;script&gt;
        lucide.createIcons();

        let L = 10;
        let currentType = 'point';
        let loads = [];
        let charts = {};

        const el = (id) =&gt; document.getElementById(id);

        // --- Type Switcher ---
        window.setType = (type) =&gt; {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn =&gt; {
                btn.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
                btn.classList.add('border-transparent', 'bg-slate-50', 'text-slate-500');
            });
            const activeBtn = el(`btn-${type}`);
            activeBtn.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
            activeBtn.classList.remove('border-transparent', 'bg-slate-50', 'text-slate-500');

            el('magLabel').innerText = type === 'udl' ? '数值 (kN/m)' : type === 'moment' ? '数值 (kN&middot;m)' : '数值 (kN)';
            el('lenInputBox').style.display = type === 'udl' ? 'block' : 'none';
        };

        // --- Calculation Engine ---
        function solve() {
            let sumP = 0;
            let sumMA = 0;

            loads.forEach(ld =&gt; {
                if (ld.type === 'point') {
                    sumP += ld.mag;
                    sumMA += ld.mag * ld.pos;
                } else if (ld.type === 'moment') {
                    sumMA += ld.mag; // Clockwise positive
                } else if (ld.type === 'udl') {
                    let total = ld.mag * ld.len;
                    sumP += total;
                    sumMA += total * (ld.pos + ld.len / 2);
                }
            });

            const Rb = sumMA / L;
            const Ra = sumP - Rb;

            const points = 301; // Higher resolution for free span
            const step = L / (points - 1);
            let dataV = [], dataM = [];

            for (let i = 0; i &lt; points; i++) {
                let x = i * step;
                let V = Ra;
                let M = Ra * x;

                loads.forEach(ld =&gt; {
                    if (x &gt; ld.pos) {
                        if (ld.type === 'point') {
                            V -= ld.mag;
                            M -= ld.mag * (x - ld.pos);
                        } else if (ld.type === 'moment') {
                            M += ld.mag; // Superposition: Clockwise moment on left increases internal moment
                        } else if (ld.type === 'udl') {
                            let activeLen = Math.min(x - ld.pos, ld.len);
                            let force = ld.mag * activeLen;
                            V -= force;
                            M -= force * (activeLen / 2 + Math.max(0, x - (ld.pos + ld.len)));
                        }
                    }
                });
                dataV.push({x, y: V});
                dataM.push({x, y: M});
            }
            return { dataV, dataM, Ra, Rb };
        }

        // --- UI &amp; Charts ---
        function initCharts() {
            const commonOptions = {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'bottom', grid: { color: '#f1f5f9' }, title: { display: true, text: '位置 x (m)', font: { size: 10, weight: 'bold' } } },
                    y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }
                },
                plugins: { 
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.9)',
                        padding: 12,
                        titleFont: { size: 12, weight: 'bold' },
                        bodyFont: { size: 12 },
                        callbacks: {
                            label: (ctx) =&gt; `数值: ${ctx.parsed.y.toFixed(3)}`
                        }
                    }
                }
            };

            charts.v = new Chart(el('vChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.08)', fill: true, data: [], tension: 0, pointRadius: 0, borderWidth: 2 }] },
                options: commonOptions
            });

            charts.m = new Chart(el('mChart'), {
                type: 'line',
                data: { datasets: [{ borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.08)', fill: true, data: [], tension: 0, pointRadius: 0, borderWidth: 2 }] },
                options: {
                    ...commonOptions,
                    scales: {
                        ...commonOptions.scales,
                        y: { ...commonOptions.scales.y, reverse: true } // Positive moment down
                    }
                }
            });
        }

        function update() {
            el('spanDisplay').innerText = `L = ${L.toFixed(2)}m`;
            const { dataV, dataM } = solve();
            
            charts.v.data.datasets[0].data = dataV;
            charts.m.data.datasets[0].data = dataM;
            
            // Update X-axis range
            charts.v.options.scales.x.max = L;
            charts.m.options.scales.x.max = L;
            
            charts.v.update();
            charts.m.update();

            const maxV = Math.max(...dataV.map(d =&gt; Math.abs(d.y)));
            const maxM = Math.max(...dataM.map(d =&gt; Math.abs(d.y)));
            el('vMax').innerText = `|V|max: ${maxV.toFixed(3)} kN`;
            el('mMax').innerText = `|M|max: ${maxM.toFixed(3)} kN&middot;m`;
            
            renderLoads();
        }

        function renderLoads() {
            const list = el('loadList');
            list.innerHTML = loads.length ? '' : '&lt;div class=&quot;text-center py-8 text-slate-300 italic text-sm&quot;&gt;等待添加荷载...&lt;/div&gt;';
            
            const viz = el('loadMarkers');
            viz.innerHTML = '';
            const vizWidth = el('beamViz').offsetWidth - 100; // 50px padding each side

            loads.forEach((ld, i) =&gt; {
                // List item
                const item = document.createElement('div');
                const isOut = ld.pos &gt; L || (ld.type === 'udl' &amp;&amp; ld.pos + ld.len &gt; L);
                item.className = `flex items-center justify-between p-3 rounded-xl border transition-all ${isOut ? 'bg-red-50 border-red-200' : 'bg-slate-50 border-slate-100'}`;
                item.innerHTML = `
                    &lt;div class=&quot;flex flex-col&quot;&gt;
                        &lt;span class=&quot;text-[9px] font-black ${isOut ? 'text-red-500' : 'text-slate-400'} uppercase tracking-tighter&quot;&gt;${ld.type === 'point' ? '集中力' : ld.type === 'moment' ? '力偶' : '均布荷载'}&lt;/span&gt;
                        &lt;span class=&quot;text-xs font-bold ${isOut ? 'text-red-700' : 'text-slate-700'}&quot;&gt;${ld.mag}${ld.type === 'udl' ? 'kN/m' : ld.type === 'moment' ? 'kNm' : 'kN'} @ ${ld.pos}m&lt;/span&gt;
                        ${isOut ? '&lt;span class=&quot;text-[8px] text-red-500 font-bold&quot;&gt;超出跨径范围!&lt;/span&gt;' : ''}
                    &lt;/div&gt;
                    &lt;button onclick=&quot;removeLoad(${i})&quot; class=&quot;p-2 text-slate-300 hover:text-red-500 transition-colors&quot;&gt;&lt;i data-lucide=&quot;x&quot; class=&quot;w-4 h-4&quot;&gt;&lt;/i&gt;&lt;/button&gt;
                `;
                list.appendChild(item);

                // Viz marker (only if within range)
                if (ld.pos &lt;= L) {
                    const marker = document.createElement('div');
                    marker.className = 'absolute';
                    const left = 50 + (ld.pos / L) * vizWidth;
                    marker.style.left = `${left}px`;
                    
                    if (ld.type === 'point') {
                        marker.style.top = '30px';
                        marker.innerHTML = `&lt;div class=&quot;w-0.5 h-[50px] bg-blue-500 relative&quot;&gt;&lt;div class=&quot;absolute bottom-0 -left-1 w-0 h-0 border-l-4 border-r-4 border-t-8 border-t-blue-500 border-l-transparent border-r-transparent&quot;&gt;&lt;/div&gt;&lt;/div&gt;`;
                    } else if (ld.type === 'moment') {
                        marker.style.top = '64px';
                        marker.style.transform = 'translateX(-16px)';
                        marker.innerHTML = `&lt;div class=&quot;w-8 h-8 border-2 border-red-500 rounded-full border-t-transparent flex items-center justify-center bg-white/80&quot;&gt;&lt;i data-lucide=&quot;rotate-cw&quot; class=&quot;w-4 h-4 text-red-500&quot;&gt;&lt;/i&gt;&lt;/div&gt;`;
                    } else if (ld.type === 'udl') {
                        const width = Math.min((ld.len / L) * vizWidth, vizWidth - (ld.pos / L) * vizWidth);
                        marker.style.top = '50px';
                        marker.style.width = `${width}px`;
                        marker.className += ' bg-emerald-500/20 border-t-2 border-emerald-500 h-[30px] flex justify-around items-end pb-1';
                        marker.innerHTML = Array(Math.min(10, Math.ceil(ld.len))).fill('&lt;div class=&quot;w-px h-4 bg-emerald-500&quot;&gt;&lt;/div&gt;').join('');
                    }
                    viz.appendChild(marker);
                }
            });
            lucide.createIcons();
        }

        // --- Events ---
        el('addBtn').onclick = () =&gt; {
            const mag = parseFloat(el('magnitude').value);
            const pos = parseFloat(el('position').value);
            const len = parseFloat(el('loadLen').value);
            if (isNaN(mag) || isNaN(pos)) return;
            loads.push({ type: currentType, mag, pos, len: currentType === 'udl' ? len : 0 });
            update();
        };

        el('beamLength').oninput = (e) =&gt; { 
            const val = parseFloat(e.target.value);
            if (val &gt; 0) {
                L = val; 
                update(); 
            }
        };

        el('clearAll').onclick = () =&gt; {
            if (confirm('确定要清空所有荷载吗？')) {
                loads = [];
                update();
            }
        };

        window.removeLoad = (i) =&gt; { loads.splice(i, 1); update(); };

        // Initial Setup
        initCharts();
        update();
        
        // Handle window resize for viz
        window.onresize = renderLoads;
    &lt;/script&gt;
